tion steps, and recency requirements", "Apply accident-reporting, alcohol/drug, and medical-fitness rules", "Describe registration, marking, and the three Remote ID compliance paths"], "sections": [["Who and what Part 107 covers", ["Small UA = less than 55 lb at takeoff, including everything on board or attached (107.3).", "Applies to civil, non-recreational operations. Does NOT apply to public aircraft operations, air carrier ops, moored balloons, kites, amateur rockets, or unmanned free balloons (107.1).", "Recreational flyers use 49 U.S.C. 44809 and TRUST; a Part 107 holder flying for fun either follows Part 107 or meets the recreational rules.", "Crew roles: Remote PIC (final authority, 107.19); person manipulating the controls (may be uncertificated only under direct supervision with immediate takeover ability); visual observer (optional)."]], ["Getting and keeping the certificate", ["Eligibility (107.61): age 16+; read, speak, write, understand English; no condition that interferes with safe operation; pass the UAG test (or ALC-451 for current Part 61 pilots).", "Process: IACRA FTN → schedule at PSI ($175) → pass (70%, 42/60) → IACRA application (Form 8710-13) → TSA vetting → temporary then permanent certificate.", "Failed test? Wait 14 calendar days to retest (107.71).", "The certificate does not expire. Recency (107.65): initial test or recurrent training within the previous 24 calendar months; recurrent is free online (ALC-677).", "Carry certificate + ID when flying; present to FAA, NTSB, TSA, or any federal/state/local law enforcement officer on request (107.7).", "Address change: notify the FAA within 30 days or stop exercising privileges (107.77)."]], ["Reporting, alcohol, drugs, fitness", ["Accident report within 10 calendar days (107.9) for serious injury (AIS 3+), any loss of consciousness, or damage to property other than the UA exceeding $500 (repair cost or fair market value). Report via FAADroneZone or the FSDO.", "Alcohol: 8 hours bottle-to-throttle; BAC below 0.04; not under the influence (107.27 → 91.17).", "Drug conviction or refusing an alcohol test: denial up to 1 year or suspension/revocation (107.57, 107.59).", "No medical certificate, but you may not fly with a known physical or mental condition that would interfere with safe operation (107.17)."]], ["Registration and Remote ID", ["Every drone flown under Part 107 must be registered regardless of weight (Part 48); $5 per aircraft, valid 3 years. Owner must be 13+.", "Registration number goes on an external surface.", "Remote ID (Part 89): standard Remote ID drone, broadcast module (VLOS only), or FRIA (VLOS, no RID equipment).", "RID broadcasts UA ID, UA position/altitude/velocity, control station position, time, and emergency status — not the pilot's name.", "Standard RID serial number goes on the registration. If RID stops broadcasting in flight: land as soon as practicable."]]], "traps": ["Damage to the drone itself never counts toward the $500.", "'Calendar months' run to the end of the month.", "Recreational registration cannot be used for Part 107 flights."]}, {"id": "M2", "num": 2, "title": "Regulations II — Operating Rules, Night, Over People & Waivers", "area": "REG", "acs": "UA.I.B, I.D, I.E", "session": 1, "minutes": 60, "objectives": ["Apply the 107.51 operating limits from memory", "State lighting and training requirements for civil twilight and night", "Identify the four categories of operations over people", "Distinguish waivable from non-waivable rules"], "sections": [["The numbers you must know (107.51)", ["Altitude: 400 ft AGL — or higher within 400 ft of a structure, up to 400 ft above its top.", "Groundspeed: 87 knots (100 mph).", "Visibility: 3 statute miles from the control station.", "Clouds: 500 ft below, 2,000 ft horizontally."]], ["Preflight and crew", ["Remote PIC checks the sUAS before every flight (107.15) and completes 107.49: assess the environment (weather, airspace, people and property), brief everyone on conditions, emergency and contingency procedures and roles, verify control links, sufficient power, and secure attachments.", "VLOS (107.31): unaided vision except corrective lenses. FPV is allowed only if a VO keeps VLOS.", "VO (107.33) is optional; if used, effective communication is required.", "One UA at a time (107.35)."]], ["Prohibited or limited operations", ["Careless or reckless operation (107.23(a)). Dropping objects is allowed if no undue hazard (107.23(b)).", "From a moving aircraft: never. From a moving land or water vehicle: only over sparsely populated areas (107.25).", "Hazardous materials: prohibited, not waivable (107.36).", "Yield right of way to all aircraft (107.37).", "Controlled airspace (B, C, D, surface E) needs ATC authorization (107.41); don't interfere with airport traffic (107.43); restricted/prohibited areas need the controlling agency (107.45); obey TFRs/NOTAMs (107.47).", "In-flight emergency: deviate as necessary; written report to FAA if requested (107.21)."]], ["Civil twilight and night (107.29)", ["Civil twilight (lower 48): 30 min before official sunrise to sunrise; sunset to 30 min after sunset.", "Anti-collision lighting visible 3 SM with flash rate sufficient to avoid collision, for twilight AND night.", "Intensity may be reduced (never extinguished) in the interest of safety.", "Night requires initial test or recurrent training under the current rules (post-April 6, 2021). No waiver needed."]], ["Operations over people (Subpart D)", ["Category 1: 0.55 lb or less including everything; no exposed rotating parts that would lacerate skin.", "Category 2: injury below 11 ft-lb transfer; no exposed lacerating parts; no safety defects; FAA-accepted Declaration of Compliance.", "Category 3: below 25 ft-lb; DOC; NOT over open-air assemblies; only over closed/restricted-access sites with notice, or transit (not sustained) over people.", "Category 4: FAA airworthiness certificate; follow its operating limitations.", "Sustained flight over open-air assemblies (Cat 1, 2, 4) requires Remote ID compliance."]], ["Waivers (Subpart D, 107.205)", ["Waivable examples: 107.25, 107.29, 107.31, 107.33, 107.35, 107.37(a), 107.39, 107.41, 107.51, 107.145.", "Not waivable: hazmat (107.36), alcohol/drugs (107.27), careless/reckless (107.23).", "Apply via FAADroneZone with a safety case; allow up to 90 days."]]], "traps": ["The structure exception still needs airspace authorization if in controlled airspace.", "Twilight needs the same lights as night.", "Cat 3 is the only category banned over open-air assemblies."]}, {"id": "M3", "num": 3, "title": "Airspace Classification & Authorization", "area": "AIR", "acs": "UA.II.A, II.B", "session": 1, "minutes": 45, "objectives": ["Identify each airspace class and its chart depiction", "Decide whether a location needs ATC authorization", "Use LAANC, UAS Facility Maps, and FAADroneZone correctly", "Recognize special use airspace, MTRs, and TFRs"], "sections": [["The classes", ["Class A: 18,000 ft MSL to FL600 — not a factor for sUAS.", "Class B: solid blue; tiered 'upside-down wedding cake'; numbers = ceiling/floor in hundreds ft MSL (80/30).", "Class C: solid magenta; ~5 NM surface area, ~10 NM shelf from 1,200 ft above airport to 4,000 ft above airport.", "Class D: dashed blue; surface to ~2,500 ft above airport; [32] = ceiling 3,200 MSL; [-32] = up to but not including.", "Class E: surface area = dashed magenta; magenta vignette = floor 700 AGL; blue vignette = floor 1,200 AGL; otherwise 14,500 MSL.", "Class G: uncontrolled — no authorization needed."]], ["Do I need authorization?", ["Yes in B, C, D, and Class E surface areas (107.41).", "No under a Class C/B shelf if the airspace at your altitude is E (above surface) or G.", "Mode C veil (30 NM magenta circle) does not by itself require authorization.", "Part-time towers: when closed, airspace reverts per Chart Supplement."]], ["LAANC and FAADroneZone", ["LAANC: near-real-time authorization through FAA-approved apps, up to UAS Facility Map grid altitudes.", "Grid value = max AGL altitude ATC may authorize there; 0 = further coordination.", "Above grid altitude or LAANC unavailable → FAADroneZone request (plan ahead)."]], ["Special use and other airspace", ["Prohibited (P-56): no flight. Restricted: controlling agency permission when active.", "MOA: no permission, but check activity. Alert: training/unusual activity. Warning: offshore beyond 3 NM.", "MTRs: IR/VR; 4 digits = at or below 1,500 AGL; 3 digits = segments above 1,500 AGL.", "TFRs are FDC NOTAMs — check tfr.faa.gov or B4UFLY. Stadium TFR: 3 NM / 3,000 AGL, 1 hr before to 1 hr after (MLB, NFL, NCAA D-I football, major speedways; 30,000+ seats).", "National Security UAS Flight Restrictions (99.7) over sensitive sites."]]], "traps": ["Read whether chart altitudes are MSL or AGL.", "Authorization depends on the airspace at YOUR altitude.", "Sectionals do not show TFRs."]}, {"id": "M4", "num": 4, "title": "Sectional Chart Lab", "area": "AIR", "acs": "UA.II.A, V.B", "session": 2, "minutes": 70, "objectives": ["Read airport data blocks, frequencies, and field elevation", "Determine airspace class, floor, ceiling, and authorization need at any point", "Interpret obstacles, MEFs, latitude/longitude, and hazard symbols", "Read unfamiliar current-sectional excerpts (post-October 26, 2026 test format)"], "sections": [["Reading an airport", ["Blue symbol = towered; magenta = nontowered.", "Data block: name, identifier, CT frequency (★ = part-time), ATIS, elevation, L = lighting, longest runway in hundreds of ft, circled C = CTAF, UNICOM.", "Use the Chart Supplement for hours, pattern direction, and remarks."]], ["Obstacles and terrain", ["Obstacle labels: bold top = MSL; (parentheses) = AGL.", "Group obstacles, lighted obstacles, and towers over 1,000 ft AGL have special symbols.", "MEF = highest terrain/obstacle in the quadrangle (+ buffer), in thousands/hundreds MSL."]], ["Position and hazards", ["Latitude = N/S of equator (lines run E–W). Longitude = E/W of prime meridian. Each degree = 60 minutes; ticks every minute.", "Parachute symbol = jump area. Magenta flag = VFR checkpoint (manned traffic). Gray line with IR/VR = MTR.", "Wildlife refuges, national parks: manned aircraft asked to stay above 2,000 ft AGL; check local rules."]], ["Method for any chart question", ["1) Find the point. 2) What airspace boundary surrounds it? 3) Floor/ceiling — MSL or AGL? 4) Convert using field or ground elevation. 5) Is my operating altitude inside controlled airspace? 6) Any SUA, MTR, obstacle, or NOTAM issue?", "Practice on current sectionals, not just the supplement — the test now shows unfamiliar chart excerpts."]]], "traps": ["Subtract field elevation when converting MSL to AGL.", "Class D ceilings are charted MSL.", "The newest test shows charts you have never seen."]}, {"id": "M5", "num": 5, "title": "Weather", "area": "WX", "acs": "UA.III.A, III.B", "session": 2, "minutes": 35, "objectives": ["Decode METARs and TAFs", "Explain density altitude effects", "Recognize hazardous weather: thunderstorms, microbursts, fronts, fog, icing"], "sections": [["Sources", ["aviationweather.gov; Flight Service (1-800-WX-BRIEF).", "METAR: hourly observation (SPECI = special). TAF: 24–30 hr forecast, 4×/day.", "AIRMETs: Sierra (IFR/mountain obscuration), Tango (turbulence, ≥30 kt surface winds, LLWS), Zulu (icing). SIGMETs and Convective SIGMETs for severe weather. PIREPs from pilots."]], ["Decoding", ["Wind: dddssGggKT from degrees TRUE. Visibility in SM. Clouds: FEW/SCT/BKN/OVC + hundreds ft AGL. Ceiling = lowest BKN/OVC/VV.", "Temp/dewpoint °C (M = minus). Altimeter A3002 = 30.02 inHg.", "TAF change groups: FM (from), TEMPO (temporary), PROB30/40."]], ["Effects on performance", ["Standard: 15°C, 29.92 inHg; lapse ~2°C per 1,000 ft; pressure ~1 inHg per 1,000 ft.", "Density altitude rises with heat, elevation, humidity → less thrust/lift, worse climb.", "Stable air: stratiform, smooth, poor visibility. Unstable: cumuliform, showers, turbulence, good visibility.", "Inversion: smooth air, haze/fog, wind shear possible."]], ["Hazards", ["Thunderstorm needs moisture, instability, lift. Stages: cumulus (updrafts), mature (rain at surface, up+down), dissipating (downdrafts).", "Microburst: ≤1 mile, downdrafts up to 6,000 fpm.", "Cold front: fast, gusty, showers. Warm front: stratiform, low ceilings, steady precipitation.", "Fog: small temp/dewpoint spread. Radiation (clear calm nights), advection (moist air over cold surface, wind).", "Frost: remove before flight. Mechanical turbulence near buildings and trees."]]], "traps": ["METAR winds are true; tower/ATIS winds are magnetic.", "Cloud heights are AGL.", "FEW and SCT are not ceilings."]}, {"id": "M6", "num": 6, "title": "Loading & Performance", "area": "LP", "acs": "UA.IV.A", "session": 2, "minutes": 20, "objectives": ["Compute load factor in turns", "Explain CG effects", "Relate weight and environment to performance"], "sections": [["Load factor", ["Level turn load factor = 1 / cos(bank): 30° ≈ 1.15, 45° ≈ 1.41, 60° = 2.0.", "Structural load = weight × load factor (e.g., 33 lb × 1.154 ≈ 38 lb).", "Stall speed rises with √(load factor): ~41% higher at 2 G.", "Stalls occur when the critical angle of attack is exceeded — at any airspeed."]], ["Weight and balance", ["Use the manufacturer's data for weight and CG limits.", "Forward CG: more stable, heavier controls, higher stall speed. Aft CG: less stable, harder stall recovery.", "More payload: shorter flight time, slower climb, less agility."]], ["Environment", ["High density altitude reduces thrust and lift.", "Cold reduces lithium battery capacity; warm batteries and watch voltage."]]], "traps": ["Use the chart: find bank angle, read load factor, multiply by weight."]}, {"id": "M7", "num": 7, "title": "Operations — Radio, Airports, Emergencies, ADM, Physiology, Maintenance", "area": "OPS", "acs": "UA.V.A–F", "session": 2, "minutes": 50, "objectives": ["Use standard radio phraseology and interpret position reports", "Apply ADM, CRM, and hazardous-attitude antidotes", "Plan emergency procedures", "Recognize physiological hazards", "Apply maintenance and inspection best practices"], "sections": [["Radio and airports", ["CTAF at nontowered airports; UNICOM (nongovernment station); MULTICOM 122.9 where none exists; ATIS for weather/runway info.", "Phonetic alphabet; altitudes 'four thousand five hundred'; runway 'two seven'.", "Pattern legs: departure, crosswind, downwind, base, final. Standard left turns; ~1,000 ft AGL pattern altitude.", "Runway number = magnetic heading ÷ 10. Wind sock large end points into the wind. X = closed.", "Chart Supplement = most complete airport information."]], ["Emergencies", ["Brief and set lost-link (RTH altitude) before every flight.", "Flyaway toward an airport: notify ATC with position and heading.", "Manned aircraft approaching: yield — descend or move clear.", "Swollen battery: remove from service. Battery fire: follow manufacturer/fire guidance; keep extinguishing means at the site.", "Remote ID failure: land as soon as practicable."]], ["ADM and CRM", ["Hazardous attitudes & antidotes: Anti-authority → Follow the rules. Impulsivity → Not so fast, think first. Invulnerability → It could happen to me. Macho → Taking chances is foolish. Resignation → I'm not helpless.", "Tools: PAVE, IMSAFE, DECIDE, 3P (Perceive-Process-Perform), risk = likelihood × severity.", "CRM in all phases; safety culture = procedures + speak-up; avoid automation complacency and task saturation."]], ["Physiology", ["Fatigue, dehydration, hyperventilation, stress, alcohol, medications.", "Scan: short, regular movements, ~10° sectors, ~1 sec each.", "Night: dark adaptation ~30 min; off-center viewing."]], ["Maintenance", ["Follow the manufacturer; if none, create a scheduled maintenance protocol.", "Remote PIC inspects before each flight; replace damaged props; keep records."]]], "traps": ["Downwind is flown opposite the landing direction.", "The remote PIC — not the client — briefs emergencies."]}], "keyNumbers": [["Max weight", "< 55 lb incl. payload"], ["Max altitude", "400 ft AGL (+400 ft over structure within 400 ft)"], ["Max groundspeed", "87 kt / 100 mph"], ["Visibility", "3 SM from control station"], ["Cloud clearance", "500 ft below / 2,000 ft horizontal"], ["Anti-collision light", "Visible 3 SM"], ["Civil twilight", "±30 min of official sunrise/sunset"], ["Accident report", "10 calendar days; >$500, serious injury, LOC"], ["Alcohol", "8 hours; BAC < 0.04"], ["Recency", "24 calendar months (ALC-677, free)"], ["Address change", "30 days"], ["Retest wait", "14 calendar days"], ["Minimum age", "16"], ["Registration", "$5, 3 years, all Part 107 drones"], ["Cat 1 / 2 / 3", "≤0.55 lb / 11 ft-lb / 25 ft-lb"], ["Stadium TFR", "3 NM, 3,000 ft AGL, ±1 hour"], ["Class C shelf", "1,200 ft above airport"], ["Magenta vignette", "Class E from 700 AGL"], ["60° bank", "2 G"], ["Test", "60 Q, 2 hr, 70% (42), $175"]], "flashcards": [["Max weight", "< 55 lb incl. payload"], ["Max altitude", "400 ft AGL (+400 ft over structure within 400 ft)"], ["Max groundspeed", "87 kt / 100 mph"], ["Visibility", "3 SM from control station"], ["Cloud clearance", "500 ft below / 2,000 ft horizontal"], ["Anti-collision light", "Visible 3 SM"], ["Civil twilight", "±30 min of official sunrise/sunset"], ["Accident report", "10 calendar days; >$500, serious injury, LOC"], ["Alcohol", "8 hours; BAC < 0.04"], ["Recency", "24 calendar months (ALC-677, free)"], ["Address change", "30 days"], ["Retest wait", "14 calendar days"], ["Minimum age", "16"], ["Registration", "$5, 3 years, all Part 107 drones"], ["Cat 1 / 2 / 3", "≤0.55 lb / 11 ft-lb / 25 ft-lb"], ["Stadium TFR", "3 NM, 3,000 ft AGL, ±1 hour"], ["Class C shelf", "1,200 ft above airport"], ["Magenta vignette", "Class E from 700 AGL"], ["60° bank", "2 G"], ["Test", "60 Q, 2 hr, 70% (42), $175"], ["Solid blue line", "Class B"], ["Solid magenta line", "Class C"], ["Dashed blue line", "Class D"], ["Dashed magenta line", "Class E surface area (authorization required)"], ["Blue vignette", "Class E from 1,200 ft AGL"], ["[-25] in Class D", "Ceiling up to but not including 2,500 ft MSL"], ["Obstacle (number)", "Height AGL"], ["★ next to CT", "Part-time tower"], ["Circled C", "CTAF"], ["MULTICOM", "122.9 MHz"], ["VR1234 (4 digits)", "Flown at or below 1,500 ft AGL"], ["AIRMET Sierra", "IFR & mountain obscuration"], ["AIRMET Tango", "Turbulence, ≥30 kt surface winds, LLWS"], ["AIRMET Zulu", "Icing & freezing levels"], ["Ceiling", "Lowest BKN, OVC, or VV"], ["METAR wind reference", "Degrees TRUE"], ["Standard atmosphere", "15°C, 29.92 inHg"], ["Thunderstorm ingredients", "Moisture, instability, lift"], ["Dissipating stage", "Downdrafts dominate"], ["Microburst", "≤1 mile; up to 6,000 fpm downdraft"], ["Anti-authority", "Follow the rules. They are usually right."], ["Impulsivity", "Not so fast. Think first."], ["Invulnerability", "It could happen to me."], ["Macho", "Taking chances is foolish."], ["Resignation", "I'm not helpless. I can make a difference."], ["PAVE", "Pilot, Aircraft, enVironment, External pressures"], ["IMSAFE", "Illness, Medication, Stress, Alcohol, Fatigue, Emotion"], ["DECIDE", "Detect, Estimate, Choose, Identify, Do, Evaluate"], ["Remote ID paths", "Standard RID · broadcast module · FRIA"], ["RID failure in flight", "Land as soon as practicable"], ["Not waivable", "Hazmat (107.36), alcohol/drugs, careless/reckless"], ["Who briefs emergencies", "Remote PIC"]], "labs": [{"id": "L1", "title": "Lab 1 — Legal or Not? (Regulations Scenario Drill)", "module": "M1–M2", "session": 1, "minutes": "15 (inside Module 2)", "purpose": "Apply Part 107 rules to realistic CAP and civilian scenarios and cite the regulation.", "setup": "Print the scenario cards, cut apart. Teams of 2–3. Each team draws a card, decides LEGAL / NOT LEGAL / LEGAL WITH CONDITIONS, and cites the rule. 60 seconds per card, then debrief.", "items": [["A cadet (age 15) with no certificate flies a squadron demo while you, a certificated remote PIC, stand beside her with the ability to take the controls.", "LEGAL — uncertificated person under direct supervision; remote PIC can take immediate control. (107.12, 107.19)"], ["You inspect an antenna at 1,200 ft AGL, staying 300 ft horizontally from a 900-ft tower, in Class G.", "LEGAL — within 400 ft of the structure and no higher than 400 ft above its top (900 + 400 = 1,300 ft). (107.51(b))"], ["You fly 20 minutes after sunset with the drone's standard nav lights (visible 1 mile).", "NOT LEGAL — civil twilight requires anti-collision lights visible 3 SM. (107.29)"], ["Your drone hits a parked car. Repair estimate: $650. No injuries.", "LEGAL WITH CONDITIONS — report to FAA within 10 calendar days. (107.9)"], ["You had one beer at 7 PM and fly a sunrise mission at 6 AM.", "LEGAL — more than 8 hours, provided BAC below 0.04 and not impaired. (107.27/91.17)"], ["You fly FPV goggles alone in a field, no one else present.", "NOT LEGAL — VLOS requires unaided vision; FPV only with a VO maintaining VLOS. (107.31)"], ["You operate two drones at once for a mapping job.", "NOT LEGAL without a waiver. (107.35)"], ["You fly from a moving pickup truck along a rural road with no houses.", "LEGAL — sparsely populated area, not carrying property for hire. (107.25)"], ["You carry a small propane canister to a remote site by drone.", "NOT LEGAL — hazardous material, not waivable. (107.36)"], ["You fly in Class D airspace at 150 ft AGL after getting LAANC approval for 200 ft.", "LEGAL — authorized and within the approved altitude. (107.41)"], ["Your Remote ID module stops broadcasting mid-flight. You finish the last 3 photos.", "NOT LEGAL — land as soon as practicable. (Part 89)"], ["A 0.4-lb drone (no exposed lacerating props) hovers over a crowd at a parade, standard Remote ID on.", "LEGAL — Category 1 with Remote ID for sustained flight over an open-air assembly; still check TFRs and local rules. (107.110, Part 89)"], ["You moved 45 days ago and haven't updated your address with the FAA.", "NOT LEGAL to exercise privileges until you notify the FAA. (107.77)"], ["Your last recurrent training was completed March 3, 2024. Today is March 20, 2026.", "LEGAL — current through March 31, 2026. (107.65)"], ["A helicopter approaches your search grid. You keep hovering because you were there first.", "NOT LEGAL — must yield right of way. (107.37)"], ["You fly a stadium area at 300 ft AGL, 2 NM from an NFL stadium, 45 minutes after the game ends.", "NOT LEGAL — the stadium TFR runs until 1 hour after the event. (FDC 4/3621, 99.7)"]]}, {"id": "L2", "title": "Lab 2 — Airspace & Authorization Planner", "module": "M3", "session": 1, "minutes": "15 (inside Module 3)", "purpose": "Determine whether a proposed site needs authorization and how to get it, using live FAA tools.", "setup": "Instructor projects the FAA UAS Facility Map and a LAANC app (any FAA-approved supplier). Students work in pairs with phones or laptops. Suggested local sites: Lehigh Valley Intl (ABE, Class C), Reading Regional (RDG, Class D), Philadelphia Intl (PHL, Class B), Quakertown (UKT) and Pottstown (PTW) nontowered airports, and a local stadium. Verify each site's airspace on the current chart before class.", "items": [["Site 1: A park 2 NM from a nontowered airport, flying at 200 ft AGL. What airspace? Authorization? Other actions?", "Usually Class G (verify chart) — no ATC authorization; avoid interfering with traffic; monitor CTAF optional; check NOTAMs/TFRs."], ["Site 2: Inside the surface area of a Class D airport, 150 ft AGL. Grid shows 200.", "Class D — LAANC authorization up to 200 ft is available; request 150 ft."], ["Site 3: Under a Class C shelf (floor 1,200 ft above airport), 6 NM from the airport, 300 ft AGL.", "Outside Class C at your altitude; check if a Class E surface or another class applies; normally no authorization."], ["Site 4: Inside Class B surface area, grid shows 0.", "LAANC cannot approve; FAADroneZone request with further coordination; plan weeks ahead."], ["Site 5: You need 350 ft in a Class D grid showing 200.", "Request through FAADroneZone (above facility map altitude)."], ["Site 6: Within 3 NM of a 30,000+ seat stadium during an MLB game.", "Stadium TFR — prohibited from 1 hr before to 1 hr after unless specially authorized."], ["Site 7: Inside an active restricted area.", "Need permission from the using/controlling agency."], ["Site 8: Inside an MOA.", "No permission needed; check activity and use caution."]]}, {"id": "L3", "title": "Lab 3 — Sectional Chart Lab", "module": "M4", "session": 2, "minutes": 70, "purpose": "Build chart-reading skill that transfers to unfamiliar, current sectional excerpts (the post-October 26, 2026 test format).", "setup": "Part A uses FAA-CT-8080-2H (printed in color). Part B uses 4–6 excerpts the instructor crops from the CURRENT local sectional (free from FAA Digital VFR Charts). Part C is a timed drill. Students use the Chart Reading Worksheet for each point.", "items": [["Part A-1: Using the chart legend (Figure 'Legend' pages of FAA-CT-8080-2H), identify the symbols for Class B, C, D, E-surface, E-700, E-1,200, towered vs nontowered airports, obstacle, group obstacle, parachute area, VFR checkpoint, MTR, MOA, restricted, prohibited.", "Instructor checks each against the legend."], ["Part A-2: FAA sample question style — 'Refer to Figure 26, area 4: what does the line of latitude measure?'", "Degrees north of the equator."], ["Part A-3: Using FAA-CT-8080-2H Figure 2 (load factor chart), find the load factor at 30°, 45°, 60°.", "≈1.15, ≈1.4, 2.0 (also used in Lab 5)."], ["Part B (each excerpt): Complete the Chart Reading Worksheet — airport name/ID, towered?, tower/CTAF/ATIS frequencies, field elevation, airspace class at surface, ceiling (MSL→AGL), authorization needed at 300 ft AGL?, highest obstacle within 2 NM (MSL/AGL), MEF, nearby SUA/MTR/hazards.", "Instructor answer key is filled in from the same excerpt before class (see Instructor Key template)."], ["Part B example (from the FAA's own August 2026 advisory): Millville Muni (MIV) — what airspace at the surface and is authorization needed?", "Class E surface area — authorization required."], ["Part B example (FAA August 2026 advisory): Grand Canyon National Park Airport (GCN) — CTAF when the tower is closed?", "119.0."], ["Part C: 10-minute drill — instructor calls 10 points on a projected unfamiliar excerpt; teams write airspace + authorization (Y/N).", "Score: 1 point each; review misses together."]]}, {"id": "L4", "title": "Lab 4 — METAR / TAF Decoding", "module": "M5", "session": 2, "minutes": "15 (inside Module 5)", "purpose": "Decode real-format weather reports and decide go/no-go for a sUAS mission.", "setup": "Individual worksheet, 8 minutes, then pair-check. Reports below are realistic training examples, not live data. Optional: pull the live METAR for ABE/RDG from aviationweather.gov and decode it together.", "items": [["METAR KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002 — wind, visibility, ceiling, temp/dew, altimeter?", "Wind 270° true at 15 kt gusting 25; vis 10 SM; ceiling 4,500 ft AGL (broken); 8°C / −2°C; 30.02 inHg. Go/no-go: gusts may exceed many small UA limits — check manufacturer wind limits."], ["METAR KRDG 220554Z 00000KT 1/2SM FG VV002 04/04 A3015 — what's happening? Can you fly at 200 ft?", "Calm, ½ SM fog, vertical visibility 200 ft, temp = dewpoint. NO: visibility below 3 SM and obscured; cannot meet cloud/visibility minimums."], ["METAR KPHL 221854Z 18008KT 10SM FEW040 SCT250 31/18 A2996 — ceiling?", "No ceiling (FEW and SCT only). Hot day → higher density altitude, reduced performance."], ["METAR KUKT 231415Z AUTO 32012KT 7SM -RA OVC015 06/03 A2988 — ceiling and precipitation?", "Overcast 1,500 ft AGL ceiling; light rain. Legal to fly at 400 ft (500 ft below clouds = must stay at or below 1,000 ft AGL), but rain may exceed UA water limits."], ["TAF KABE 211130Z 2112/2212 22010KT P6SM SCT050 FM211800 27018G28KT P6SM BKN040 TEMPO 2120/2124 3SM -SHRA BKN025 — when do winds increase? Worst conditions?", "From 1800Z on the 21st: 270° at 18 G28. Temporarily 2000–2400Z: 3 SM in light rain showers, ceiling 2,500 ft."], ["Convert 1800Z to local time in Pennsylvania in November (EST).", "1300 local (UTC−5)."]]}, {"id": "L5", "title": "Lab 5 — Loading & Performance Calculations", "module": "M6", "session": 2, "minutes": "10 (inside Module 6)", "purpose": "Compute structural loads in turns and reason about CG and density altitude.", "setup": "Calculator or the load factor chart (FAA-CT-8080-2H Figure 2).", "items": [["A 20-lb fixed-wing UA in a 60° level turn. Load on the structure?", "20 × 2.0 = 40 lb."], ["A 33-lb UA in a 30° bank (LF ≈ 1.154)?", "≈ 38 lb."], ["A 10-lb UA in a 45° bank (LF ≈ 1.414)?", "≈ 14.1 lb."], ["Stall speed is 20 kt in level flight. Approximate stall speed at 60° bank?", "20 × √2 ≈ 28 kt."], ["A camera is moved aft on a fixed-wing UA. Effect?", "CG moves aft → less stable, harder stall recovery."], ["Same mission, July afternoon (34°C) vs. November morning (5°C). Which has better performance and why?", "November — lower density altitude; but cold reduces battery capacity, so watch voltage."]]}, {"id": "L6", "title": "Lab 6 — Operations & ADM Scenarios", "module": "M7", "session": 2, "minutes": "20 (inside Module 7)", "purpose": "Practice radio interpretation, emergency response, and aeronautical decision-making with CAP-style missions.", "setup": "Tables of 3–4. Each table gets one mission card and the emergency inject cards. Use PAVE and IMSAFE on the mission, then respond to injects. 2-minute brief-back per table.", "items": [["Mission: Post-storm damage assessment for a county EMA, 4 miles from a nontowered airport. Crew got 4 hours of sleep. The client wants imagery in 1 hour. Apply PAVE.", "Pilot: fatigue (IMSAFE) → risk; Aircraft: check batteries/props; enVironment: gusty post-frontal winds, debris, possible TFR (check NOTAMs); External pressure: client deadline — don't let it drive the decision."], ["Radio: You hear 'Valley traffic, Cessna 123, left downwind runway 28, Valley.' Where is the aircraft?", "Downwind for 28 is flown on ~100°; left traffic → runway on its left (north) → aircraft is south of the runway, flying east."], ["Inject: Lost link at 300 ft, RTH set to 150 ft, trees are 120 ft tall near home point.", "RTH altitude too low for safety margin; brief crew, watch the aircraft, be ready to resume control; set RTH above obstacles next time."], ["Inject: The drone flies away toward a Class D surface area.", "Notify the tower with last position/heading/altitude; keep the VO tracking."], ["Inject: A battery is puffy after landing.", "Remove from service, isolate in a fire-safe container, dispose per guidance."], ["Inject: A crew member says, 'Just launch, we can skip the checklist this once.'", "Impulsivity → 'Not so fast. Think first.' Complete the checklist."], ["Inject: The VO says, 'Nothing bad ever happens on these missions.'", "Invulnerability → 'It could happen to me.'"], ["Inject: A medical helicopter approaches the scene.", "Yield immediately — descend/move clear; land if needed."]]}], "resources": [["14 CFR Part 107 — Small Unmanned Aircraft Systems (eCFR)", "https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-107", null, "The regulation itself. Read Subparts A–D.", true], ["14 CFR Part 89 — Remote Identification (eCFR)", "https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-89", null, "Remote ID rules.", true], ["FAA-S-ACS-10B Remote Pilot Airman Certification Standards", "https://www.faa.gov/training_testing/testing/acs/uas_acs.pdf", "FAA-S-ACS-10B_Remote_Pilot_ACS.pdf", "Every testable knowledge element; codes used in this course.", true], ["FAA-G-8082-22 Remote Pilot sUAS Study Guide", "https://www.faa.gov/sites/faa.gov/files/uas/resources/policy_library/remote_pilot_study_guide.pdf", "FAA-G-8082-22_Remote_Pilot_Study_Guide.pdf", "Primary student reading.", true], ["FAA-CT-8080-2H Airman Knowledge Testing Supplement", "https://www.faa.gov/training_testing/testing/supplements/media/sport_rec_private_akts.pdf", "FAA-CT-8080-2H_Testing_Supplement.pdf", "Figures used on the test. Print sectional, legend, and load factor pages in color.", true], ["FAA UAG Sample Questions", "https://www.faa.gov/sites/faa.gov/files/training_testing/testing/test_questions/uag_questions.pdf", "FAA_UAG_Sample_Questions.pdf", "Official sample items with ACS codes.", true], ["AC 107-2A Small Unmanned Aircraft System", "https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_107-2A.pdf", "AC_107-2A.pdf", "FAA guidance on certification, operations, over people, night, waivers.", true], ["FAA Airman Testing Community Advisory — August 2026", "https://www.faa.gov/training_testing/testing/August_2026_ATCA.pdf", "FAA_ATCA_August_2026.pdf", "Announces UAG chart-image questions from Oct 26, 2026, with two sample items.", true], ["FAA Airman Testing Community Advisory — September 2026 Special Edition", "https://www.faa.gov/training_testing/testing/September_2026_Special_Edition.pdf", "FAA_ATCA_September_2026_Special.pdf", "Repeats the UAG chart change.", false], ["Pilot's Handbook of Aeronautical Knowledge (FAA-H-8083-25C)", "https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak", null, "Weather, ADM, physiology, aerodynamics depth.", false], ["Aviation Weather Handbook (FAA-H-8083-28)", "https://www.faa.gov/regulations_policies/handbooks_manuals/aviation", null, "METAR/TAF and weather products reference (on the FAA handbooks page).", false], ["Aeronautical Information Manual — Chapter 11 (UAS)", "https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap11_section_5.html", null, "UAS pilot testing, certification, responsibilities.", false], ["FAA Digital VFR Sectional Charts", "https://www.faa.gov/air_traffic/flight_info/aeronav/digital_products/vfr/", null, "Current sectionals for the chart lab (New York function trySubmit(){const un=quiz.ans.filter(x=>x===null).length;if(un&&!confirm(un+" unanswered. Submit anyway?"))return;finish(false)}
function finish(timeout){stopTimer();quiz.done=true;quiz.timeout=timeout;const right=quiz.qs.filter((q,i)=>quiz.ans[i]===q.answer).length;quiz.pct=Math.round(right/quiz.qs.length*100);quiz.right=right;
 const miss=store("missed")||{};quiz.qs.forEach((q,i)=>{if(quiz.ans[i]===q.answer)delete miss[q.id];else miss[q.id]=1});store("missed",miss);
 const h=store("history")||[];h.push({set:quiz.set,title:quiz.title,pct:quiz.pct,n:quiz.qs.length,date:new Date().toISOString().slice(0,10)});store("history",h.slice(-50));render();window.scrollTo(0,0)}
function results(){const by={};quiz.qs.forEach((q,i)=>{by[q.area]=by[q.area]||[0,0];by[q.area][1]++;if(quiz.ans[i]===q.answer)by[q.area][0]++});const pass=quiz.pct>=70;
 return `<div class="card"><h2>${esc(quiz.title)} — results</h2>${quiz.timeout?'<p class="note">Time expired. Unanswered questions were scored wrong.</p>':''}
 <div class="row"><span class="big">${quiz.pct}%</span><span>${quiz.right} of ${quiz.qs.length} correct</span><span class="badge ${pass?'pass':'fail'}">${pass?'Above':'Below'} the FAA 70% pass mark</span>${quiz.pct>=85?'<span class="badge pass">Meets course 85% target</span>':''}</div>
 <h3>By area</h3><table class="tbl">${Object.entries(by).map(([a,[r,t]])=>`<tr><th>${esc(AREAS[a])}</th><td>${r}/${t}</td><td>${Math.round(r/t*100)}%</td></tr>`).join("")}</table>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="quiz=null;render()">Back to exams</button><button class="btn sec" onclick="startMisses()">Drill my misses</button><button class="btn sec" onclick="window.print()">Print results</button></div></div>
 <div class="card"><h2>Review</h2>${quiz.qs.map((q,i)=>{const a=quiz.ans[i],ok=a===q.answer;return `<details ${ok?'':'open'}><summary>${ok?'✔':'✘'} ${i+1}. ${esc(q.q)}</summary><p class="small">Your answer: <b>${a===null?'—':esc(q.choices[a])}</b><br>Correct: <b>${esc(q.choices[q.answer])}</b></p><div class="say small">${esc(q.exp)} <span class="mute">(${esc(q.ref)})</span></div></details>`}).join("")}</div>`}

/* ---------- Flashcards ---------- */
function cards(){if(!fc)fc={deck:shuffle(DATA.flashcards.map((c,i)=>i)),i:0,flip:false};const c=DATA.flashcards[fc.deck[fc.i]];
 return `<div class="card"><div class="row" style="justify-content:space-between"><b>Flashcards</b><span class="small mute">${fc.i+1} / ${fc.deck.length} · tap card to flip</span></div></div>
 <div class="card flash" onclick="fc.flip=!fc.flip;render()"><div>${esc(c[0])}</div>${fc.flip?`<div class="back">${esc(c[1])}</div>`:`<div class="small mute" style="margin-top:10px">tap to reveal</div>`}</div>
 <div class="row"><button class="btn sec" onclick="fc.i=(fc.i-1+fc.deck.length)%fc.deck.length;fc.flip=false;render()">‹ Prev</button><button class="btn" onclick="fc.i=(fc.i+1)%fc.deck.length;fc.flip=false;render()">Next ›</button><button class="btn sec" onclick="fc=null;render()">Shuffle</button></div>`}

/* ---------- Labs ---------- */
function labs(){if(lab)return labView(lab,false);
 return `<div class="card"><h2>Lab exercises</h2><p class="small mute">Student versions. Answers appear in Instructor mode and the printed instructor key.</p><div class="tasklist">${DATA.labs.map(l=>`<button onclick="lab='${l.id}';render()"><b>${esc(l.title)}</b><br><span class="small mute">Session ${l.session} · ${esc(String(l.minutes))} min · ${esc(l.module)}</span></button>`).join("")}</div></div>`}
function labView(id,key){const l=DATA.labs.find(x=>x.id===id);
 return `<div class="row noprint" style="margin-bottom:10px"><button class="btn sec sm" onclick="lab=null;render()">← All labs</button><button class="btn sec sm" onclick="window.print()">Print</button></div>
 <div class="card"><h2>${esc(l.title)}</h2><p><b>Purpose:</b> ${esc(l.purpose)}</p><p class="small"><b>Setup:</b> ${esc(l.setup)}</p></div>
 <div class="card"><ol class="tight">${l.items.map(([q,a])=>`<li style="margin-bottom:10px">${esc(q)}${key?`<div class="say small" style="margin-top:4px"><b>Key:</b> ${esc(a)}</div>`:`<div style="border-bottom:1px dashed var(--line);height:28px"></div>`}</li>`).join("")}</ol></div>`}

/* ---------- Tools ---------- */
function tools(){return `<div class="grid2">
 <div class="card"><h2>METAR decoder</h2><p class="small mute">Paste a METAR to see a plain-language breakdown.</p><input type="text" id="metar" value="KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002" oninput="decodeMetar()"><div id="mout" class="small" style="margin-top:8px"></div></div>
 <div class="card"><h2>Load factor calculator</h2><label>Weight (lb)</label><input type="number" id="lw" value="33" oninput="lfCalc()"><label>Bank angle (°)</label><input type="number" id="lb" value="30" oninput="lfCalc()"><div id="lout" style="margin-top:8px"></div></div>
 <div class="card"><h2>MSL ↔ AGL</h2><label>Altitude MSL (ft)</label><input type="number" id="am" value="3200" oninput="altCalc()"><label>Ground / field elevation (ft)</label><input type="number" id="ae" value="700" oninput="altCalc()"><div id="aout" style="margin-top:8px"></div></div>
 <div class="card"><h2>Recency date</h2><label>Test or recurrent training completed</label><input type="text" id="rd" placeholder="YYYY-MM-DD" value="2025-04-06" oninput="recCalc()"><div id="rout" style="margin-top:8px"></div></div>
 </div>
 <div class="card"><h2>Airspace quick reference</h2><table class="tbl"><tr><th>Class</th><th>Chart</th><th>Typical vertical limits</th><th>Part 107 authorization</th></tr>
 <tr><td>A</td><td>Not charted on sectional</td><td>18,000 MSL – FL600</td><td>N/A</td></tr>
 <tr><td>B</td><td>Solid blue</td><td>Surface – ~10,000 MSL, tiered</td><td>Required</td></tr>
 <tr><td>C</td><td>Solid magenta</td><td>Surface – 4,000 above airport; shelf from 1,200</td><td>Required</td></tr>
 <tr><td>D</td><td>Dashed blue</td><td>Surface – ~2,500 above airport</td><td>Required</td></tr>
 <tr><td>E surface</td><td>Dashed magenta</td><td>Surface up</td><td>Required</td></tr>
 <tr><td>E 700 / 1,200</td><td>Magenta / blue vignette</td><td>Floor 700 or 1,200 AGL</td><td>Not below floor</td></tr>
 <tr><td>G</td><td>—</td><td>Surface up to overlying E</td><td>Not required</td></tr></table></div>`}
function decodeMetar(){const s=($("#metar")||{}).value||"";const t=s.trim().toUpperCase().split(/\s+/);const o=[];
 t.forEach((x,i)=>{let m;
  if(i===0&&/^[A-Z0-9]{4}$/.test(x))o.push(["Station",x]);
  else if(m=/^(\d\d)(\d\d)(\d\d)Z$/.exec(x))o.push(["Time",`Day ${m[1]}, ${m[2]}:${m[3]} UTC (Zulu)`]);
  else if(x==="AUTO")o.push(["Type","Automated observation"]);
  else if(m=/^(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT$/.exec(x))o.push(["Wind",m[1]==="000"&&m[2]==="00"?"Calm":`${m[1]==="VRB"?"Variable":"From "+m[1]+"° true"} at ${+m[2]} kt${m[4]?", gusting "+(+m[4])+" kt":""}`]);
  else if(m=/^(\d{3})V(\d{3})$/.exec(x))o.push(["Wind variability",`Varying between ${m[1]}° and ${m[2]}°`]);
  else if(m=/^(P?)(\d+\/\d+|\d+)SM$/.exec(x))o.push(["Visibility",(m[1]?"More than ":"")+m[2]+" statute miles"+(eval(m[2])<3?" — BELOW Part 107 minimum (3 SM)":"")]);
  else if(m=/^(FEW|SCT|BKN|OVC|VV)(\d{3})(CB|TCU)?$/.exec(x)){const nm={FEW:"Few",SCT:"Scattered",BKN:"Broken",OVC:"Overcast",VV:"Vertical visibility"}[m[1]];const ft=+m[2]*100;o.push(["Clouds",`${nm} at ${ft.toLocaleString()} ft AGL${/BKN|OVC|VV/.test(m[1])?" (ceiling if lowest)":""}${m[3]?" — "+m[3]:""}`])}
  else if(x==="CLR"||x==="SKC")o.push(["Clouds","Clear"]);
  else if(m=/^(M?\d\d)\/(M?\d\d)$/.exec(x)){const f=v=>v.replace("M","−");o.push(["Temp / dewpoint",`${f(m[1])}°C / ${f(m[2])}°C (spread ${Math.abs(parseInt(m[1].replace("M","-"))-parseInt(m[2].replace("M","-")))}°)`])}
  else if(m=/^A(\d\d)(\d\d)$/.exec(x))o.push(["Altimeter",`${m[1]}.${m[2]} inHg`]);
  else if(/^[-+]?(VC)?(RA|SN|DZ|FG|BR|HZ|TS|SH|FZ|GR|GS|PL|IC|UP|SQ|FC)+/.test(x)){const map={RA:"rain",SN:"snow",DZ:"drizzle",FG:"fog",BR:"mist",HZ:"haze",TS:"thunderstorm",SH:"showers",FZ:"freezing",GR:"hail",GS:"small hail",PL:"ice pellets",IC:"ice crystals",UP:"unknown precip",SQ:"squall",FC:"funnel cloud",VC:"in vicinity"};let d=x.startsWith("-")?"light ":x.startsWith("+")?"heavy ":"";d+=x.replace(/^[-+]/,"").match(/VC|RA|SN|DZ|FG|BR|HZ|TS|SH|FZ|GR|GS|PL|IC|UP|SQ|FC/g).map(c=>map[c]).join(" ");o.push(["Weather",d])}
  else if(x==="RMK")o.push(["Remarks","(remarks follow)"]);
 });
 const el=$("#mout");if(el)el.innerHTML=`<table class="tbl">${o.map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table>`}
function lfCalc(){const w=+($("#lw")||{}).value,b=+($("#lb")||{}).value;const el=$("#lout");if(!el)return;if(!(b>=0&&b<85)){el.innerHTML="Enter a bank angle from 0 to 84°.";return}const lf=1/Math.cos(b*Math.PI/180);el.innerHTML=`Load factor <b>${lf.toFixed(3)} G</b><br>Structure load <b>${(w*lf).toFixed(1)} lb</b><br>Stall speed increase <b>${((Math.sqrt(lf)-1)*100).toFixed(0)}%</b>`}
function altCalc(){const a=+($("#am")||{}).value,e=+($("#ae")||{}).value;const el=$("#aout");if(el)el.innerHTML=`<b>${(a-e).toLocaleString()} ft AGL</b>`}
function recCalc(){const v=(($("#rd")||{}).value||"").trim();const el=$("#rout");if(!el)return;const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v);if(!m){el.innerHTML="Use YYYY-MM-DD.";return}let y=+m[1]+2,mo=+m[2];const last=new Date(y,mo,0);el.innerHTML=`Current through <b>${last.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</b> (24 calendar months)`}

/* ---------- Library ---------- */
function lib(){return `<div class="card"><h2>Free reference library</h2><p class="small mute">All core materials are free FAA publications. ★ = required for this course.</p><table class="tbl">${DATA.resources.map(r=>`<tr><td>${r[4]?"★":""}</td><td><a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a><div class="small mute">${esc(r[3])}</div></td></tr>`).join("")}</table></div>`}

/* ---------- Instructor ---------- */
function inst(){if(!unlocked)return `<div class="card lock"><h2>🔒 Instructor mode</h2><p class="small mute">Lesson plan, timing, lab answer keys, teaching techniques, and exam keys.</p><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')tryUnlock()"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="tryUnlock()">Unlock</button></div></div>`;
 const subs=[["plan","Lesson plan"],["keys","Lab keys"],["teach","Teaching techniques"],["exam","Exam keys"],["set","Settings"]];
 let body="";
 if(instSub==="plan")body=[1,2].map(s=>`<div class="card"><h2>Session ${s}</h2><table class="tbl"><tr><th>Time</th><th>Block</th><th>Content</th></tr>${DATA.schedule[s].map(r=>`<tr><td class="mono">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td></tr>`).join("")}</table></div>`).join("")+`<div class="card"><h2>Formats</h2><ul class="tight"><li><b>Single day:</b> Session 1 08:00–12:00, lunch, Session 2 13:00–17:00. Between-session work moves to pre-work.</li><li><b>Two weekends (recommended):</b> spacing improves retention, especially for charts.</li></ul></div>`;
 if(instSub==="keys")body=lab?labView(lab,true):`<div class="card"><div class="tasklist">${DATA.labs.map(l=>`<button onclick="lab='${l.id}';render()"><b>${esc(l.title)}</b> — answer key</button>`).join("")}</div></div>`;
 if(instSub==="teach")body=`<div class="card"><h2>Teaching techniques used in this course</h2><table class="tbl">${DATA.teaching.map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table></div>`;
 if(instSub==="exam")body=Object.keys(DATA.sets).map(k=>`<div class="card"><details><summary>${esc(DATA.setInfo[k][0])} — answer key</summary><ol class="tight small">${DATA.sets[k].map(id=>{const q=BYID[id];return `<li>${esc(q.q)} — <b>${"ABC"[q.answer]}. ${esc(q.choices[q.answer])}</b></li>`}).join("")}</ol></details></div>`).join("");
 if(instSub==="set")body=`<div class="card"><h2>Change instructor password</h2><input type="password" id="np" placeholder="New password"><div class="row" style="margin-top:8px"><button class="btn" onclick="setPw()">Save</button><button class="btn sec" onclick="store('pw',null);alert('Reset to default.')">Reset to default</button></div><h3>Clear student data on this device</h3><button class="btn sec" onclick="if(confirm('Clear scores and missed questions?')){store('history',[]);store('missed',{});alert('Cleared.')}">Clear scores</button></div>`;
 return `<div class="row noprint" style="margin-bottom:10px">${subs.map(([k,l])=>`<button class="btn ${instSub===k?'':'sec'} sm" onclick="instSub='${k}';lab=null;render()">${l}</button>`).join("")}<button class="btn sec sm" onclick="unlocked=false;render()">Lock</button></div>`+body}
function tryUnlock(){const v=($("#pw")||{}).value||"";if(sha256(K+":"+v)===pwHash()){unlocked=true;render()}else alert("Incorrect password.")}
function setPw(){const v=($("#np")||{}).value||"";if(v.length<4){alert("Use at least 4 characters.");return}store("pw",sha256(K+":"+v));alert("Password saved on this device.")}

render();
document.addEventListener("input",()=>{});
setTimeout(()=>{if(VIEW==="tools"){decodeMetar();lfCalc();altCalc();recCalc()}},0);
const _r=render;render=function(){_r();if(VIEW==="tools"){decodeMetar();lfCalc();altCalc();recCalc()}};
</script>
</body>
</html>
