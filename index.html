200 ft MSL — the highest terrain or obstacle in that quadrangle plus a safety margin, rounded up.<\/li>\n<li>Terrain is shown with color tints (higher = darker brown) and contour lines.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> Obstacle \"1549 (1137)\": the top is at 1,549 ft MSL, and it stands 1,137 ft tall. Ground elevation at its base = 1,549 − 1,137 = <b>412 ft MSL<\/b>. Because it is a structure, you may fly up to 1,537 ft AGL within 400 ft of it — but check what airspace that puts you in.<\/div>"},{"t":"4.5 A method for any chart question","acs":["UA.II.A.K1","UA.II.A.K2","UA.II.A.K3","UA.II.B.K2"],"html":"<ol class=\"steps\">\n<li><b>Find the point.<\/b> Use the area number, the lat/long, or a named landmark.<\/li>\n<li><b>Find the nearest airspace boundary around it.<\/b> Solid blue (B), solid magenta (C), dashed blue (D), dashed magenta (E surface), vignettes (E700/E1200).<\/li>\n<li><b>Read the floor and ceiling<\/b> — and note whether they are MSL or AGL.<\/li>\n<li><b>Convert<\/b> to AGL using the field elevation or the ground elevation (from obstacles, contours or the airport).<\/li>\n<li><b>Compare with your altitude.<\/b> Is your planned AGL altitude inside a Class B, C, D or E surface area? Then you need authorization.<\/li>\n<li><b>Look for everything else:<\/b> SUA (hatched borders), MTRs (gray lines), parachute symbols, obstacles, stadiums, wildlife areas, VFR checkpoints. Then check NOTAMs/TFRs (not printed).<\/li>\n<\/ol>\n<p>Practice this method on the sample chart below, then do the <b>Chart Workbook<\/b> questions (Practice Exams → Chart Workbook).<\/p>\n{{FIG:F_SECT}}\n<details class=\"chk\"><summary>Area 2 on Figure 1: What airspace are you in at 300 ft AGL? Do you need authorization?<\/summary>Area 2 is inside the Kestrel Class C <b>shelf<\/b> (outer ring, 1,600–4,400 MSL). Ground is about 412 ft MSL, so 300 ft AGL ≈ 712 ft MSL — below the 1,600-ft MSL floor. No vignette is shown, so Class E starts at 1,200 ft AGL. You are in <b>Class G<\/b>: no authorization needed (but stay clear of Kestrel traffic).<\/details>\n<details class=\"chk\"><summary>Area 5: Cedar County has a dashed magenta circle. Authorization at 200 ft AGL?<\/summary><b>Yes.<\/b> Dashed magenta = Class E surface area designated for an airport — controlled from the surface (107.41).<\/details>\n<details class=\"chk\"><summary>Area 4: Pine Hill sits in a magenta vignette. What does it mean for you?<\/summary>Class E begins at <b>700 ft AGL<\/b> inside the shaded area; below that is <b>Class G<\/b>. At 400 ft AGL you need no authorization, but you must not interfere with the airport's traffic and should monitor CTAF 122.8. There is also a <b>parachute<\/b> jumping area at Pine Hill.<\/details>"}]},{"id":"M5","num":5,"title":"Weather","area":"WX","acs":"UA.III.A, III.B","session":2,"minutes":35,"objectives":["Decode METARs and TAFs","Explain density altitude effects","Recognize hazardous weather: thunderstorms, microbursts, fronts, fog, icing"],"sections":[["Sources",["aviationweather.gov; Flight Service (1-800-WX-BRIEF).","METAR: hourly observation (SPECI = special). TAF: 24–30 hr forecast, 4×/day.","AIRMETs: Sierra (IFR/mountain obscuration), Tango (turbulence, ≥30 kt surface winds, LLWS), Zulu (icing). SIGMETs and Convective SIGMETs for severe weather. PIREPs from pilots."]],["Decoding",["Wind: dddssGggKT from degrees TRUE. Visibility in SM. Clouds: FEW/SCT/BKN/OVC + hundreds ft AGL. Ceiling = lowest BKN/OVC/VV.","Temp/dewpoint °C (M = minus). Altimeter A3002 = 30.02 inHg.","TAF change groups: FM (from), TEMPO (temporary), PROB30/40."]],["Effects on performance",["Standard: 15°C, 29.92 inHg; lapse ~2°C per 1,000 ft; pressure ~1 inHg per 1,000 ft.","Density altitude rises with heat, elevation, humidity → less thrust/lift, worse climb.","Stable air: stratiform, smooth, poor visibility. Unstable: cumuliform, showers, turbulence, good visibility.","Inversion: smooth air, haze/fog, wind shear possible."]],["Hazards",["Thunderstorm needs moisture, instability, lift. Stages: cumulus (updrafts), mature (rain at surface, up+down), dissipating (downdrafts).","Microburst: ≤1 mile, downdrafts up to 6,000 fpm.","Cold front: fast, gusty, showers. Warm front: stratiform, low ceilings, steady precipitation.","Fog: small temp/dewpoint spread. Radiation (clear calm nights), advection (moist air over cold surface, wind).","Frost: remove before flight. Mechanical turbulence near buildings and trees."]]],"traps":["METAR winds are true; tower/ATIS winds are magnetic.","Cloud heights are AGL.","FEW and SCT are not ceilings."],"lessons":[{"t":"5.1 Where to get weather","acs":["UA.III.A.K1","UA.III.A.K5"],"html":"<ul>\n<li><b>Aviation Weather Center<\/b> — <b>aviationweather.gov<\/b>: METARs, TAFs, radar, satellite, prog charts, AIRMETs/SIGMETs, PIREPs. Free.<\/li>\n<li><b>Flight Service<\/b> — <b>1800wxbrief.com<\/b> or <b>1-800-WX-BRIEF<\/b>: standard, abbreviated and outlook briefings, plus NOTAMs.<\/li>\n<li><b>ASOS / AWOS<\/b> — automated surface stations at airports. They broadcast on a frequency (shown near the airport name on the chart) and by phone (number in the Chart Supplement).\n <ul><li><b>ASOS<\/b> (Automated Surface Observing System) is the primary U.S. observing network and reports a full METAR (wind, visibility, precipitation type, obscurations, sky condition, temperature, dewpoint, altimeter).<\/li>\n <li><b>AWOS<\/b> levels: AWOS-A (altimeter only), AWOS-1 (adds wind, temperature, dewpoint, density altitude), AWOS-2 (adds visibility), <b>AWOS-3<\/b> (adds cloud/ceiling), AWOS-3P (precipitation type), AWOS-3T (thunderstorm detection).<\/li><\/ul><\/li>\n<li><b>ATIS<\/b> at busier airports — recorded weather and airport information.<\/li>\n<li><b>PIREPs<\/b> (pilot reports) — actual turbulence, icing, cloud tops.<\/li>\n<li>Advisories: <b>SIGMETs<\/b> (severe hazards for all aircraft), <b>Convective SIGMETs<\/b> (thunderstorms), <b>AIRMETs<\/b> — Sierra (IFR and mountain obscuration), Tango (turbulence, sustained surface winds of 30 kt or more, low-level wind shear), Zulu (icing and freezing levels).<\/li>\n<\/ul>\n<div class=\"tip\"><b>Practical tip:<\/b> A consumer weather app is not an aviation source. Use the nearest METAR/TAF and add local observation — wind at 400 ft is often much stronger than at the ground.<\/div>"},{"t":"5.2 Decoding a METAR","acs":["UA.III.A.K2"],"html":"<p>A <b>METAR<\/b> is an hourly routine surface observation (a <b>SPECI<\/b> is a special report issued when conditions change significantly).<\/p>\n<div class=\"metar mono\">METAR KABE 211651Z 27015G25KT 10SM -RA BKN045 OVC080 08/M02 A3002 RMK AO2<\/div>\n<table class=\"tbl\">\n<tr><th>Element<\/th><th>Meaning<\/th><\/tr>\n<tr><td class=\"mono\">KABE<\/td><td>Station identifier (Allentown, PA)<\/td><\/tr>\n<tr><td class=\"mono\">211651Z<\/td><td>Day of the month (21) and time <b>16:51 UTC (Zulu)<\/b>. Eastern Standard Time = UTC − 5.<\/td><\/tr>\n<tr><td class=\"mono\">27015G25KT<\/td><td>Wind <b>from 270° TRUE<\/b> at 15 knots, gusting to 25 knots. VRB = variable; 00000KT = calm; 280V350 = direction varying between 280° and 350°.<\/td><\/tr>\n<tr><td class=\"mono\">10SM<\/td><td>Visibility 10 statute miles (fractions: 1 1/2SM; M1/4SM = less than ¼ SM)<\/td><\/tr>\n<tr><td class=\"mono\">-RA<\/td><td>Weather: light rain. Intensity: <b>-<\/b> light, (none) moderate, <b>+<\/b> heavy; VC = in the vicinity (5–10 SM).<\/td><\/tr>\n<tr><td class=\"mono\">BKN045 OVC080<\/td><td>Sky: broken clouds at <b>4,500 ft AGL<\/b>, overcast at 8,000 ft AGL. Heights are in <b>hundreds of feet AGL<\/b>.<\/td><\/tr>\n<tr><td class=\"mono\">08/M02<\/td><td>Temperature 8 °C / dewpoint <b>minus<\/b> 2 °C<\/td><\/tr>\n<tr><td class=\"mono\">A3002<\/td><td>Altimeter setting 30.02 inches of mercury<\/td><\/tr>\n<tr><td class=\"mono\">RMK AO2<\/td><td>Remarks: automated station with a precipitation sensor<\/td><\/tr>\n<\/table>\n<h4>Sky cover<\/h4>\n<table class=\"tbl\"><tr><th>Code<\/th><th>Coverage<\/th><th>Ceiling?<\/th><\/tr>\n<tr><td>SKC / CLR<\/td><td>Clear (CLR = no clouds below 12,000 ft at automated stations)<\/td><td>No<\/td><\/tr>\n<tr><td>FEW<\/td><td>1/8–2/8<\/td><td>No<\/td><\/tr>\n<tr><td>SCT<\/td><td>3/8–4/8<\/td><td>No<\/td><\/tr>\n<tr><td>BKN<\/td><td>5/8–7/8<\/td><td><b>Yes<\/b><\/td><\/tr>\n<tr><td>OVC<\/td><td>8/8<\/td><td><b>Yes<\/b><\/td><\/tr>\n<tr><td>VV<\/td><td>Vertical visibility into an obscuration (sky hidden)<\/td><td><b>Yes<\/b><\/td><\/tr><\/table>\n<p>The <b>ceiling<\/b> is the lowest <b>broken<\/b> or <b>overcast<\/b> layer, or the vertical visibility into an obscuration. \"CB\" after a layer = cumulonimbus; \"TCU\" = towering cumulus.<\/p>\n<h4>Weather codes<\/h4>\n<p class=\"small\"><b>Descriptors:<\/b> MI shallow · BC patches · DR low drifting · BL blowing · SH showers · TS thunderstorm · FZ freezing. <b>Precipitation:<\/b> DZ drizzle · RA rain · SN snow · SG snow grains · IC ice crystals · PL ice pellets · GR hail · GS small hail · UP unknown. <b>Obscuration:<\/b> BR mist (visibility 5/8 to 6 SM) · FG fog (less than 5/8 SM) · FU smoke · HZ haze · DU dust · SA sand · VA volcanic ash. <b>Other:<\/b> SQ squall · FC funnel cloud (+FC tornado) · SS/DS sand/duststorm.<\/p>\n<details class=\"chk\"><summary>Decode: METAR KMDT 031853Z VRB04KT 3/4SM BR OVC004 12/11 A2981<\/summary>Harrisburg, day 3 at 18:53Z. Wind variable at 4 kt. Visibility ¾ SM in mist. Overcast at 400 ft AGL (ceiling). Temp 12 °C, dewpoint 11 °C (spread 1° — fog likely). Altimeter 29.81. <b>No-go<\/b> for sUAS: visibility is below 3 SM and you can't stay 500 ft below a 400-ft ceiling.<\/details>"},{"t":"5.3 Decoding a TAF","acs":["UA.III.A.K3"],"html":"<p>A <b>Terminal Aerodrome Forecast<\/b> covers the area within <b>5 statute miles<\/b> of the airport. TAFs are issued <b>four times a day<\/b> (0000Z, 0600Z, 1200Z, 1800Z) and are valid for <b>24 or 30 hours<\/b>.<\/p>\n<div class=\"metar mono\">TAF KABE 211730Z 2118/2218 27012G22KT P6SM SCT050<br>&nbsp;&nbsp;FM212300 30008KT P6SM SKC<br>&nbsp;&nbsp;TEMPO 2120/2122 3SM -SHRA BKN025<br>&nbsp;&nbsp;PROB30 2206/2210 1SM BR OVC006<\/div>\n<table class=\"tbl\">\n<tr><td class=\"mono\">211730Z<\/td><td>Issued the 21st at 17:30Z<\/td><\/tr>\n<tr><td class=\"mono\">2118/2218<\/td><td>Valid from the 21st at 18Z to the 22nd at 18Z<\/td><\/tr>\n<tr><td class=\"mono\">P6SM<\/td><td>Visibility more than 6 statute miles<\/td><\/tr>\n<tr><td class=\"mono\">FM212300<\/td><td><b>From<\/b> 23:00Z on the 21st — a rapid, lasting change; everything before it is replaced<\/td><\/tr>\n<tr><td class=\"mono\">TEMPO 2120/2122<\/td><td><b>Temporary<\/b> fluctuations (less than 1 hour each, less than half the period) between 20Z and 22Z<\/td><\/tr>\n<tr><td class=\"mono\">PROB30 2206/2210<\/td><td><b>30% probability<\/b> of these conditions between 06Z and 10Z on the 22nd<\/td><\/tr>\n<tr><td class=\"mono\">BECMG<\/td><td>Becoming — gradual change over the period given<\/td><\/tr>\n<tr><td class=\"mono\">WS010/18040KT<\/td><td>Low-level wind shear at 1,000 ft AGL, wind 180° at 40 kt<\/td><\/tr>\n<tr><td class=\"mono\">NSW<\/td><td>No significant weather<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>On the test:<\/b> Cloud heights in METARs and TAFs are <b>AGL<\/b>; wind directions are <b>true<\/b>. Wind given by a tower, ATIS or AWOS/ASOS voice broadcast is <b>magnetic<\/b>.<\/div>"},{"t":"5.4 Weather charts","acs":["UA.III.A.K4"],"html":"<ul>\n<li><b>Surface analysis chart<\/b> — current positions of <b>fronts<\/b>, highs (H) and lows (L), and <b>isobars<\/b> (lines of equal pressure). Isobars close together = strong pressure gradient = <b>strong wind<\/b>. Winds circulate clockwise around highs and counterclockwise around lows (Northern Hemisphere).<\/li>\n<li><b>Prognostic (prog) charts<\/b> — forecast positions of fronts, pressure systems and weather for the next 12–48+ hours.<\/li>\n<li><b>Radar<\/b> — precipitation intensity; useful for thunderstorm tracking. <b>Satellite<\/b> — cloud cover (visible by day, infrared day and night).<\/li>\n<li><b>Convective outlook<\/b> (Storm Prediction Center) — risk of thunderstorms and severe weather.<\/li>\n<li><b>Graphical AIRMETs (G-AIRMET)<\/b> — areas of IFR, turbulence, icing.<\/li>\n<\/ul>\n{{FIG:F_FRONTS}}"},{"t":"5.5 The atmosphere: pressure, temperature and stability","acs":["UA.III.B.K1","UA.III.B.K1c"],"html":"<h4>Standard atmosphere (sea level)<\/h4>\n<ul><li>Temperature <b>15 °C (59 °F)<\/b>; pressure <b>29.92 inHg (1013.2 hPa)<\/b>.<\/li>\n<li>Standard temperature lapse rate: about <b>2 °C (3.5 °F) per 1,000 ft<\/b>. Pressure drops about <b>1 inHg per 1,000 ft<\/b> in the lower atmosphere.<\/li><\/ul>\n<h4>Stability<\/h4>\n<table class=\"tbl\"><tr><th>Stable air<\/th><th>Unstable air<\/th><\/tr>\n<tr><td>Stratiform (layered) clouds<\/td><td>Cumuliform (heaped) clouds<\/td><\/tr>\n<tr><td>Smooth air<\/td><td>Turbulence<\/td><\/tr>\n<tr><td>Fair to poor visibility (haze, smoke)<\/td><td>Good visibility, except in showers<\/td><\/tr>\n<tr><td>Steady precipitation<\/td><td>Showery precipitation, thunderstorms<\/td><\/tr><\/table>\n<ul>\n<li>Warm, moist air is the most unstable. Cooling air from below (cool surface) makes it more stable.<\/li>\n<li>A <b>temperature inversion<\/b> (temperature <i>increasing<\/i> with altitude) is very stable: smooth air, poor visibility, fog, haze, and possible <b>wind shear<\/b> at the top of the inversion. Common on clear, calm nights.<\/li>\n<li><b>Dewpoint<\/b> is the temperature at which air becomes saturated. When the <b>temperature–dewpoint spread<\/b> is small (about 2 °C / 4 °F or less), expect <b>fog or low clouds<\/b>.<\/li>\n<li>Estimate the base of convective clouds: (temperature − dewpoint in °C) ÷ 2.5 × 1,000 ft (or ÷ 4.4 using °F).<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> Temp 22 °C, dewpoint 12 °C: spread 10 °C ÷ 2.5 = 4 → cloud bases near <b>4,000 ft AGL<\/b>.<\/div>"},{"t":"5.6 Density altitude","acs":["UA.III.B.K1a"],"html":"<ul>\n<li><b>Pressure altitude<\/b> = the altitude shown when the altimeter is set to 29.92. <b>Density altitude<\/b> = pressure altitude corrected for non-standard temperature. It is the altitude the aircraft \"feels.\"<\/li>\n<li><b>High density altitude<\/b> = thin air = <b>worse performance<\/b>: propellers and rotors make less thrust, wings make less lift, the aircraft climbs more slowly, needs more power to hover, carries less payload, and drains the battery faster.<\/li>\n<li>Three things raise density altitude: <b>high<\/b> elevation, <b>hot<\/b> temperature, and <b>humid<\/b> air. Remember: <b>\"high, hot and humid = poor performance.\"<\/b><\/li>\n<li>Rule of thumb: density altitude ≈ pressure altitude + 120 × (OAT − standard temperature at that altitude) (°C).<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> Field elevation 2,000 ft, altimeter 29.92, temperature 31 °C. Standard temperature at 2,000 ft ≈ 15 − 4 = 11 °C. Difference = 20 °C × 120 = 2,400 ft. Density altitude ≈ <b>4,400 ft<\/b>. Expect noticeably weaker climb and shorter flight time.<\/div>"},{"t":"5.7 Wind and currents","acs":["UA.III.B.K1b"],"html":"<ul>\n<li><b>Wind increases with height<\/b> above the ground because surface friction slows it. The wind at 400 ft can be much stronger than what you feel at the launch point.<\/li>\n<li><b>Mechanical turbulence<\/b>: wind flowing over and around buildings, trees and hills creates eddies, especially on the <b>downwind (lee) side<\/b>. Expect strong, unpredictable gusts around rooftops and between buildings.<\/li>\n<li><b>Convective currents (thermals)<\/b>: uneven heating — pavement, plowed fields and sand rise; water and vegetation sink. Expect bumpy air on sunny afternoons.<\/li>\n<li><b>Wind shear<\/b>: a sudden change in wind speed or direction over a short distance. Found near thunderstorms, fronts, temperature inversions and terrain.<\/li>\n<li><b>Mountain and valley winds<\/b>: air flows up slopes by day (valley breeze) and down slopes at night. Strong winds over ridges produce severe downdrafts on the lee side.<\/li>\n<li><b>Sea and land breezes<\/b>: onshore by day, offshore at night.<\/li>\n<li><b>Wake turbulence and rotor downwash<\/b>: helicopters and aircraft leave powerful vortices that can flip a small drone.<\/li>\n<\/ul>\n<div class=\"tip\">Check the manufacturer's <b>maximum wind resistance<\/b>. Keep enough battery to fly home <b>into<\/b> the wind.<\/div>"},{"t":"5.8 Air masses and fronts","acs":["UA.III.B.K1d"],"html":"<ul>\n<li>An <b>air mass<\/b> is a large body of air with fairly uniform temperature and moisture taken on from where it formed (continental/maritime, polar/tropical).<\/li>\n<li>A <b>front<\/b> is the boundary between two air masses. Crossing a front you can expect a change in <b>temperature, wind direction, and pressure<\/b>, plus clouds and precipitation.<\/li>\n<li><b>Cold front<\/b>: cold air pushes under warm air; fast-moving, narrow band of cumuliform clouds, showers, thunderstorms, gusty winds and turbulence; after passage, clearing, cooler temperatures, rising pressure, better visibility. A <b>squall line<\/b> (a line of thunderstorms) may form ahead of a fast cold front — often the most severe weather.<\/li>\n<li><b>Warm front<\/b>: warm air slides over cold air; slow-moving, wide area of stratiform clouds, steady precipitation, low ceilings, poor visibility, fog.<\/li>\n<li><b>Stationary front<\/b>: little movement; poor weather can persist for days. <b>Occluded front<\/b>: a cold front overtakes a warm front.<\/li>\n<\/ul>"},{"t":"5.9 Thunderstorms, microbursts, tornadoes, lightning and hail","acs":["UA.III.B.K1e","UA.III.B.K1f","UA.III.B.K1h","UA.III.B.K1k"],"html":"<p>A thunderstorm needs three ingredients: <b>sufficient moisture<\/b>, an <b>unstable lapse rate<\/b>, and a <b>lifting force<\/b> (fronts, terrain, heating).<\/p>\n{{FIG:F_TSTORM}}\n<ul>\n<li><b>Cumulus stage<\/b>: continuous <b>updrafts<\/b>. <b>Mature stage<\/b>: begins when <b>precipitation reaches the surface<\/b>; updrafts and downdrafts both present — the most violent stage. <b>Dissipating stage<\/b>: dominated by <b>downdrafts<\/b>.<\/li>\n<li><b>Microburst<\/b>: an intense, localized downdraft affecting an area about <b>1 mile or less<\/b> across, with downdrafts up to about <b>6,000 ft per minute<\/b> and outflow winds up to about 45 kt; usually lasts about 15 minutes. A small drone cannot climb out of it.<\/li>\n<li><b>Gust front<\/b>: outflow winds can arrive miles ahead of the storm — the wind shifts and strengthens suddenly.<\/li>\n<li><b>Hail<\/b> can fall miles away from the storm, under the anvil, even in clear air.<\/li>\n<li><b>Tornadoes<\/b> come from severe thunderstorms; funnel clouds (FC) and tornadoes (+FC) are reported in METARs.<\/li>\n<li><b>Lightning<\/b> can strike well away from the storm. If you hear thunder, you are within striking distance — land, secure the equipment and seek shelter. Wait 30 minutes after the last thunder before resuming.<\/li>\n<\/ul>\n<div class=\"warn\">Stay well away from thunderstorms — at least several miles; follow your organization's lightning policy.<\/div>"},{"t":"5.10 Icing, fog, ceiling and visibility","acs":["UA.III.B.K1g","UA.III.B.K1i","UA.III.B.K1j"],"html":"<h4>Icing<\/h4>\n<ul>\n<li>Structural icing needs <b>visible moisture<\/b> (rain, drizzle, cloud, fog) and <b>temperatures at or below freezing<\/b> on the aircraft. Freezing rain produces the fastest, most dangerous clear ice.<\/li>\n<li>Ice on propellers <b>destroys lift and thrust<\/b> and adds weight; it can unbalance props and cause vibration. Most small drones are not designed for icing.<\/li>\n<li><b>Frost<\/b> on the aircraft must be removed before flight. Cold also <b>reduces battery capacity<\/b> — keep batteries warm until launch and watch voltage closely.<\/li>\n<\/ul>\n<h4>Fog<\/h4>\n<p>Fog is a cloud at the surface that forms when the temperature–dewpoint spread is small and there are condensation nuclei.<\/p>\n<ul>\n<li><b>Radiation fog<\/b>: clear, calm, humid nights in low areas; burns off after sunrise.<\/li>\n<li><b>Advection fog<\/b>: moist air moving over a colder surface (coasts); needs wind; can be extensive and persistent.<\/li>\n<li><b>Upslope fog<\/b>: moist air pushed up a slope cools adiabatically.<\/li>\n<li><b>Precipitation-induced fog<\/b>: warm rain falling through cool air (often with warm fronts). <b>Steam fog<\/b>: cold air over warmer water. <b>Ice fog<\/b>: very cold temperatures.<\/li>\n<\/ul>\n<h4>Ceiling and visibility for sUAS<\/h4>\n<ul><li>You need <b>3 SM flight visibility<\/b> from the control station and must stay <b>500 ft below and 2,000 ft horizontally<\/b> from clouds.<\/li>\n<li>With a ceiling of 800 ft AGL, the highest you could fly is 300 ft AGL.<\/li>\n<li>Haze and smoke reduce visibility and make it hard to see other aircraft and your own drone.<\/li><\/ul>"}]},{"id":"M6","num":6,"title":"Loading & Performance","area":"LP","acs":"UA.IV.A","session":2,"minutes":20,"objectives":["Compute load factor in turns","Explain CG effects","Relate weight and environment to performance"],"sections":[["Load factor",["Level turn load factor = 1 / cos(bank): 30° ≈ 1.15, 45° ≈ 1.41, 60° = 2.0.","Structural load = weight × load factor (e.g., 33 lb × 1.154 ≈ 38 lb).","Stall speed rises with √(load factor): ~41% higher at 2 G.","Stalls occur when the critical angle of attack is exceeded — at any airspeed."]],["Weight and balance",["Use the manufacturer's data for weight and CG limits.","Forward CG: more stable, heavier controls, higher stall speed. Aft CG: less stable, harder stall recovery.","More payload: shorter flight time, slower climb, less agility."]],["Environment",["High density altitude reduces thrust and lift.","Cold reduces lithium battery capacity; warm batteries and watch voltage."]]],"traps":["Use the chart: find bank angle, read load factor, multiply by weight."],"lessons":[{"t":"6.1 Weight, balance and stability","acs":["UA.IV.A.K1","UA.IV.A.K1a","UA.IV.A.K1b"],"html":"<ul>\n<li><b>Weight<\/b> is limited by the manufacturer's <b>maximum takeoff weight<\/b>. Extra weight means more power to hover or climb, <b>shorter flight time<\/b>, slower climb and acceleration, less ability to fight wind, and more stress on motors, arms and props.<\/li>\n<li><b>Center of gravity (CG)<\/b> is the point where the aircraft balances. Payloads, batteries and accessories move it. Manufacturers specify a CG range.<\/li>\n<li>A CG that is <b>off-center<\/b> makes some motors work harder than others (less margin for control, faster battery drain). On fixed-wing sUAS, a <b>forward<\/b> CG increases stability but needs more elevator to raise the nose; an <b>aft<\/b> CG reduces stability and can make the aircraft uncontrollable.<\/li>\n<li><b>Unbalanced or unsecured payloads<\/b> can shift in flight. 107.49 requires that anything attached is secure and does not affect controllability.<\/li>\n<li>Re-check weight and balance any time you add a camera, light, speaker, drop mechanism or parachute.<\/li>\n<\/ul>\n{{FIG:F_CG}}\n<div class=\"ex\"><b>Worked example — finding the CG.<\/b> Moment = weight × arm (distance from a reference point).<br>\nAirframe 6.0 lb at 10 in = 60.0 lb-in · Battery 2.0 lb at 9 in = 18.0 lb-in · Camera 1.0 lb at 14 in = 14.0 lb-in.<br>\nTotal weight = 9.0 lb; total moment = 92.0 lb-in. <b>CG = 92.0 ÷ 9.0 = 10.2 in<\/b> from the reference. If the allowable range is 9.5–10.5 in, the aircraft is within limits.<\/div>"},{"t":"6.2 Load factor","acs":["UA.IV.A.K1","UA.IV.A.K2"],"html":"<p><b>Load factor<\/b> is the ratio of the load the wings (or rotors) must support to the aircraft's weight, measured in \"G.\" In straight-and-level flight it is 1 G. In a <b>level, coordinated turn<\/b> it increases with bank angle: <b>load factor = 1 ÷ cos(bank angle)<\/b>.<\/p>\n{{FIG:F_LOAD}}\n<table class=\"tbl\"><tr><th>Bank<\/th><th>0°<\/th><th>30°<\/th><th>45°<\/th><th>60°<\/th><th>70°<\/th><\/tr>\n<tr><td>Load factor<\/td><td>1.0<\/td><td>1.15<\/td><td>1.41<\/td><td>2.0<\/td><td>2.9<\/td><\/tr><\/table>\n<ul>\n<li>Higher load factor → the structure carries more load, the aircraft needs more lift/thrust, and a fixed-wing aircraft's <b>stall speed rises<\/b> (by the square root of the load factor: at 60° bank, about 1.41 × the normal stall speed).<\/li>\n<li>Abrupt maneuvers, pull-ups and gusts also increase load factor.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example (classic test question).<\/b> A small UA weighs <b>33 lb<\/b>. What load must the structure support in a 30° banked, level turn? 33 × 1.154 = <b>about 38 lb<\/b>.<\/div>\n<div class=\"ex\"><b>Worked example.<\/b> A 4-lb fixed-wing drone banks 60°. Load factor 2.0 → the wing supports <b>8 lb<\/b>, and the stall speed increases by about 41%.<\/div>"},{"t":"6.3 Using performance data","acs":["UA.IV.A.K2"],"html":"<p>The manufacturer's performance data tells you the aircraft's limits. Read it, and then <b>adjust for today's conditions<\/b>.<\/p>\n<ul>\n<li>Typical data: maximum takeoff weight and payload, flight time (usually measured at sea level, no wind, no payload), maximum speed, maximum wind resistance, service ceiling, operating temperature range, battery specifications, transmission range.<\/li>\n<li>Every degradation adds up: <b>heavier payload + high density altitude + strong wind + cold battery<\/b> can cut a \"30-minute\" flight to 12 minutes.<\/li>\n<li>Set battery reserves (for example, land with 25–30% remaining) and plan return-to-home with the headwind in mind.<\/li>\n<li>Exceeding published limits can cause loss of control, motor overheating, or structural failure.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> Spec flight time 28 minutes. Today: 2-lb payload (−20%), 15-kt wind (−15%), 35 °F temperature (−15%). Rough remaining endurance: 28 × 0.8 × 0.85 × 0.85 ≈ <b>16 minutes<\/b>. Plan a 10-minute mission with reserve.<\/div>"}]},{"id":"M7","num":7,"title":"Operations — Radio, Airports, Emergencies, ADM, Physiology, Maintenance","area":"OPS","acs":"UA.V.A–F","session":2,"minutes":50,"objectives":["Use standard radio phraseology and interpret position reports","Apply ADM, CRM, and hazardous-attitude antidotes","Plan emergency procedures","Recognize physiological hazards","Apply maintenance and inspection best practices"],"sections":[["Radio and airports",["CTAF at nontowered airports; UNICOM (nongovernment station); MULTICOM 122.9 where none exists; ATIS for weather/runway info.","Phonetic alphabet; altitudes 'four thousand five hundred'; runway 'two seven'.","Pattern legs: departure, crosswind, downwind, base, final. Standard left turns; ~1,000 ft AGL pattern altitude.","Runway number = magnetic heading ÷ 10. Wind sock large end points into the wind. X = closed.","Chart Supplement = most complete airport information."]],["Emergencies",["Brief and set lost-link (RTH altitude) before every flight.","Flyaway toward an airport: notify ATC with position and heading.","Manned aircraft approaching: yield — descend or move clear.","Swollen battery: remove from service. Battery fire: follow manufacturer/fire guidance; keep extinguishing means at the site.","Remote ID failure: land as soon as practicable."]],["ADM and CRM",["Hazardous attitudes & antidotes: Anti-authority → Follow the rules. Impulsivity → Not so fast, think first. Invulnerability → It could happen to me. Macho → Taking chances is foolish. Resignation → I'm not helpless.","Tools: PAVE, IMSAFE, DECIDE, 3P (Perceive-Process-Perform), risk = likelihood × severity.","CRM in all phases; safety culture = procedures + speak-up; avoid automation complacency and task saturation."]],["Physiology",["Fatigue, dehydration, hyperventilation, stress, alcohol, medications.","Scan: short, regular movements, ~10° sectors, ~1 sec each.","Night: dark adaptation ~30 min; off-center viewing."]],["Maintenance",["Follow the manufacturer; if none, create a scheduled maintenance protocol.","Remote PIC inspects before each flight; replace damaged props; keep records."]]],"traps":["Downwind is flown opposite the landing direction.","The remote PIC — not the client — briefs emergencies."],"lessons":[{"t":"7.1 Radio: towered and nontowered airports","acs":["UA.V.A.K1","UA.V.A.K2","UA.V.A.K3","UA.V.A.K4","UA.V.A.K5"],"html":"<p>Part 107 doesn't require a radio, but <b>listening<\/b> to aviation frequencies tells you where manned aircraft are. (Transmitting on aviation frequencies from the ground generally requires FCC authorization — most remote pilots should listen only.)<\/p>\n<h4>Towered airports<\/h4>\n<ul><li>Pilots talk to the <b>control tower<\/b> on the tower (CT) frequency. Ground control handles taxiing.<\/li>\n<li><b>ATIS<\/b> (Automatic Terminal Information Service): a continuous recorded broadcast of non-control information — weather, active runway, NOTAMs. Each update gets a phonetic letter (\"Information Bravo\") and is normally updated hourly or when something changes. Winds on ATIS are <b>magnetic<\/b>.<\/li><\/ul>\n<h4>Nontowered airports<\/h4>\n<ul>\n<li><b>CTAF<\/b> (Common Traffic Advisory Frequency) is the frequency pilots use to announce their position and intentions at an airport without an operating tower. It may be a UNICOM, MULTICOM, Flight Service, or the tower frequency when the tower is closed. Marked Ⓒ on the chart.<\/li>\n<li><b>UNICOM<\/b>: a non-government advisory station (often the FBO) that can give airport information. Common frequencies: 122.7, 122.725, 122.8, 122.975, 123.0, 123.05, 123.075 (122.95 at towered airports).<\/li>\n<li><b>MULTICOM 122.9<\/b>: used when there is no tower, Flight Service or UNICOM.<\/li>\n<li><b>Self-announce procedures<\/b>: pilots announce on CTAF about <b>10 miles out<\/b>, entering <b>downwind<\/b>, <b>base<\/b>, <b>final<\/b> and when <b>leaving the runway<\/b>. A call ends with the airport name.<\/li>\n<\/ul>\n<div class=\"say mono\">\"Cedar County traffic, Cessna six-one-two-four-tango, ten miles south, inbound for landing runway two-seven, Cedar County.\"<\/div>\n<p class=\"small\">Hearing that call tells you a Cessna will soon be on a downwind and final for Runway 27 — move your drone well clear of the approach end.<\/p>"},{"t":"7.2 Phraseology","acs":["UA.V.A.K6","UA.V.A.K7","UA.V.A.K8"],"html":"<h4>Phonetic alphabet<\/h4>\n<p class=\"mono small\">A Alfa · B Bravo · C Charlie · D Delta · E Echo · F Foxtrot · G Golf · H Hotel · I India · J Juliett · K Kilo · L Lima · M Mike · N November · O Oscar · P Papa · Q Quebec · R Romeo · S Sierra · T Tango · U Uniform · V Victor · W Whiskey · X X-ray · Y Yankee · Z Zulu<br>Numbers: 3 \"tree\", 5 \"fife\", 9 \"niner\"<\/p>\n<h4>Call signs and registration<\/h4>\n<ul><li>U.S. aircraft registration numbers start with <b>N<\/b>: N1234A is spoken \"November one-two-three-four-alfa.\" After first contact, pilots often use the type plus the last three characters (\"Cessna three-four-alfa\").<\/li>\n<li>Airline call signs use the company name and flight number (\"Delta four-five-two\").<\/li><\/ul>\n<h4>Altitudes, directions, speeds and time<\/h4>\n<ul>\n<li><b>Altitudes<\/b> are spoken in thousands and hundreds: 1,500 = \"one thousand five hundred\"; 12,500 = \"one two thousand five hundred\". Above 18,000 ft: flight levels (\"flight level one niner zero\").<\/li>\n<li><b>Directions/headings<\/b> are three digits in degrees magnetic: \"heading two seven zero\". <b>Runways<\/b> are named by magnetic heading ÷ 10: Runway 27 ≈ 270°.<\/li>\n<li><b>Traffic positions<\/b> use the clock: \"traffic, two o'clock, three miles\" = ahead and to the right.<\/li>\n<li><b>Speeds<\/b> in knots. <b>Time<\/b> in 24-hour UTC (\"Zulu\"): 2:30 p.m. EST = 1930Z (EDT = UTC − 4).<\/li>\n<li>Winds from a tower or ATIS are <b>magnetic<\/b>; winds in METAR/TAF are <b>true<\/b>.<\/li>\n<\/ul>"},{"t":"7.3 Airports: types, towers, markings and patterns","acs":["UA.V.B.K1","UA.V.B.K2","UA.V.B.K3","UA.V.B.K4","UA.V.B.K5"],"html":"<ul>\n<li><b>Types<\/b>: towered (operating control tower), nontowered (uncontrolled), heliports, seaplane bases, private airports, and airports with part-time towers (uncontrolled when the tower is closed).<\/li>\n<li><b>ATC towers<\/b>: listen to the tower frequency to build situational awareness — you'll hear which runway is in use and where aircraft are.<\/li>\n<li><b>Security Identification Display Areas (SIDA)<\/b>: areas at airports where people must display airport-issued ID. Drone operations on airport property need airport management coordination; never enter a SIDA without authorization.<\/li>\n<\/ul>\n{{FIG:F_RUNWAY}}\n<h4>Airport signs<\/h4>\n<table class=\"tbl\">\n<tr><td><span class=\"sign red\">27-9<\/span><\/td><td><b>Mandatory instruction<\/b> — red background, white letters: runway holding position, ILS critical area, no entry. Do not proceed without clearance.<\/td><\/tr>\n<tr><td><span class=\"sign loc\">B<\/span><\/td><td><b>Location<\/b> — black background, yellow letters: the taxiway or runway you are on.<\/td><\/tr>\n<tr><td><span class=\"sign dir\">← A<\/span><\/td><td><b>Direction<\/b> — yellow background, black letters with arrows: direction to the intersecting taxiway.<\/td><\/tr>\n<tr><td><span class=\"sign dir\">RAMP →<\/span><\/td><td><b>Destination<\/b> — yellow background, black letters: direction to a destination.<\/td><\/tr>\n<tr><td><span class=\"sign rdr\">3<\/span><\/td><td><b>Runway distance remaining<\/b> — black background, white numbers (thousands of feet).<\/td><\/tr>\n<\/table>\n<h4>Traffic patterns<\/h4>\n{{FIG:F_PATTERN}}\n<ul>\n<li>The <b>standard pattern uses left turns<\/b>. \"RP\" on a chart or the Chart Supplement means right-hand pattern.<\/li>\n<li>Legs: <b>upwind/departure, crosswind, downwind, base, final<\/b>. Manned aircraft usually enter on a <b>45° angle to the downwind<\/b> leg.<\/li>\n<li>Typical pattern altitude: about <b>1,000 ft AGL<\/b> (light aircraft). Aircraft on final and departure pass low over the runway extension — your drone's altitude.<\/li>\n<\/ul>\n<details class=\"chk\"><summary>Check yourself: The wind is from 280° at 12 kt. Which runway at an airport with Runways 9-27 is likely in use?<\/summary><b>Runway 27<\/b> — aircraft take off and land into the wind (270° is closest to 280°).<\/details>"},{"t":"7.4 Airport data, wildlife and lighting","acs":["UA.V.B.K6","UA.V.B.K6a","UA.V.B.K6b","UA.V.B.K7","UA.V.B.K8"],"html":"<h4>Sources of airport data<\/h4>\n<ul><li><b>Sectional charts<\/b> (Module 4) and the <b>Chart Supplement<\/b> (runway lengths, tower hours, pattern direction, lighting, remarks, wildlife warnings, phone numbers).<\/li>\n<li><b>NOTAMs<\/b> for temporary changes. <b>ATIS/AWOS/ASOS<\/b> for current weather.<\/li><\/ul>\n<h4>Birds and wildlife<\/h4>\n<ul>\n<li>Birds may attack drones (hawks, eagles, gulls). Avoid nesting areas, migration routes and refuges; climb or land rather than chase or harass birds.<\/li>\n<li>Most bird strikes on manned aircraft happen below 3,000 ft AGL near airports. The Chart Supplement lists airports with bird hazards.<\/li>\n<li><b>Report<\/b> any collision between an aircraft (including your drone) and wildlife to the FAA Wildlife Strike Database (<b>wildlife.faa.gov<\/b>).<\/li>\n<\/ul>\n<h4>Airport and seaplane base lighting<\/h4>\n<ul>\n<li><b>Rotating beacons<\/b>: white-green = lighted civil land airport; <b>white-yellow = lighted water airport (seaplane base)<\/b>; dual-peaked white + green = military; green-yellow-white = heliport. A beacon on during daylight at a Class B, C, D or E surface area may mean the weather is below VFR minimums.<\/li>\n<li>Runway edge lights <b>white<\/b> (yellow on the last 2,000 ft of instrument runways); threshold <b>green<\/b>; runway end <b>red<\/b>; taxiway edge lights <b>blue<\/b>.<\/li>\n<li><b>Pilot-controlled lighting<\/b> at some nontowered airports: pilots click the mic on CTAF — 7 times in 5 seconds for high intensity, 5 for medium, 3 for low. Runway lights coming on at night = an aircraft is likely arriving.<\/li>\n<li><b>VASI/PAPI<\/b> glide-path lights show red/white to landing pilots.<\/li>\n<\/ul>\n{{FIG:F_LIGHTS}}"},{"t":"7.5 Emergency planning, lost link, fly-aways and GPS loss","acs":["UA.V.C.K1","UA.V.C.K3","UA.V.C.K4","UA.V.C.K6","UA.V.C.K7"],"html":"<h4>Plan before you launch<\/h4>\n<ul>\n<li>Brief the crew on <b>emergency and contingency procedures<\/b> (107.49): lost link, fly-away, low battery, manned aircraft approaching, injury, fire, and who calls whom.<\/li>\n<li>Have phone numbers ready: the ATC facility listed in your authorization, local 911, the property owner, your CAP chain of command.<\/li>\n<li>107.21: in an emergency you may deviate from the rules as needed. If the FAA asks, send a written report.<\/li>\n<\/ul>\n<h4>Loss of control link<\/h4>\n<ul>\n<li>Know what your aircraft does: <b>return to home (RTH)<\/b>, hover, or land. Set the RTH altitude above the highest obstacle on the route and check the home point is correct before takeoff.<\/li>\n<li>Know the expected flight path and alert people under it. Keep trying to re-establish the link (move to higher ground, point the antennas correctly).<\/li>\n<\/ul>\n<h4>Fly-away<\/h4>\n<ul>\n<li>Try regaining control; switch flight modes; note the last known position, heading and altitude.<\/li>\n<li>If the drone may enter controlled airspace or endanger people or other aircraft, <b>notify ATC<\/b> (the facility in your authorization) and local authorities immediately.<\/li>\n<li>If the result is an accident that meets 107.9, report within 10 days.<\/li>\n<\/ul>\n<h4>Loss of GPS<\/h4>\n<ul>\n<li>Without GPS, many drones switch to <b>attitude (ATTI) mode<\/b>: they hold altitude but <b>drift with the wind<\/b>, and position hold, geofencing and <b>RTH won't work<\/b>.<\/li>\n<li>Causes: interference, jamming, solar activity, flying under bridges, near tall buildings or in canyons. Keep manual flying skills sharp and practice ATTI-mode landings.<\/li>\n<\/ul>\n<h4>Operations over people and at night<\/h4>\n<ul><li><b>Over people<\/b>: verify the category label, configuration and Remote ID; plan the route over non-participants per the category; keep a clear landing zone; brief the crew.<\/li>\n<li><b>At night<\/b>: lights on and checked, crew dark-adapted with red light, daylight site survey done, a lighted landing area, and a plan for losing visual orientation (use the lights and the map).<\/li><\/ul>"},{"t":"7.6 Lithium batteries","acs":["UA.V.C.K2","UA.V.C.K2a","UA.V.C.K2b","UA.V.C.K2c","UA.V.C.K2d"],"html":"<p>Lithium-polymer (LiPo) and lithium-ion batteries store a lot of energy. Damage, overcharging or short circuits can cause <b>thermal runaway<\/b> — a self-sustaining fire with toxic smoke that's hard to put out and can re-ignite.<\/p>\n<table class=\"tbl\">\n<tr><th>Transportation & handling<\/th><td>Inspect for <b>swelling (\"puffing\"), dents, punctures, torn wrap, heat or odor<\/b> — retire damaged batteries. Protect terminals from short circuits (caps, tape, individual bags). Carry in a fire-resistant container. On airlines: spare lithium batteries go in <b>carry-on only<\/b>; up to 100 Wh allowed, 101–160 Wh need airline approval (max 2 spares), over 160 Wh not allowed for passengers. Store at a partial \"storage\" charge in a cool, dry place.<\/td><\/tr>\n<tr><th>Safe charging<\/th><td>Use the <b>manufacturer's charger<\/b>. Never leave charging batteries unattended. Charge on a non-flammable surface, away from flammables. Don't charge a hot battery (let it cool after flight) or a cold one. Don't charge damaged batteries.<\/td><\/tr>\n<tr><th>Safe usage<\/th><td>Follow voltage and temperature limits; don't run batteries below their minimum voltage. Cold reduces capacity sharply — warm batteries before flight. Watch for sudden voltage drop. Track cycle count and retire old batteries.<\/td><\/tr>\n<tr><th>Fires<\/th><td>Move away and keep people clear (toxic fumes). Use large amounts of <b>water<\/b> or a suitable extinguisher to cool the pack and surrounding cells; let a burning pack burn out in a safe place. Never put a damaged battery in household trash — use a battery recycling program.<\/td><\/tr>\n<\/table>"},{"t":"7.7 Radio frequencies and interference","acs":["UA.V.C.K5"],"html":"<ul>\n<li>Most drones use unlicensed bands: <b>2.4 GHz<\/b> and <b>5.8 GHz<\/b> (some also 900 MHz or 5.1 GHz), shared with Wi-Fi, Bluetooth and many other devices.<\/li>\n<li><b>2.4 GHz<\/b>: longer range and better at passing obstacles, but crowded — more interference in cities.<\/li>\n<li><b>5.8 GHz<\/b>: more channels and less interference, but <b>shorter range<\/b> and more easily blocked by trees and buildings.<\/li>\n<li>Control links need <b>line of sight<\/b>. Buildings, terrain, trees and even your own body can block the signal. Point antennas as the manufacturer recommends.<\/li>\n<li>Interference sources: Wi-Fi routers, other drones, power lines, cell towers, radar and broadcast transmitters, metal structures (bridges, steel buildings). Reduced range = higher lost-link risk.<\/li>\n<li>Equipment must follow FCC rules; modifying transmitters to increase power can be illegal and can interfere with other services.<\/li>\n<\/ul>"},{"t":"7.8 Aeronautical decision-making (ADM) and CRM","acs":["UA.V.D.K1","UA.V.D.K1a","UA.V.D.K1b","UA.V.D.K2","UA.V.D.K3"],"html":"<p><b>ADM<\/b> is a systematic approach to consistently choosing the best course of action. Most accidents involve human error, so good decisions matter more than stick skills.<\/p>\n<h4>Models<\/h4>\n<ul>\n<li><b>DECIDE<\/b>: <b>D<\/b>etect a change → <b>E<\/b>stimate the need to react → <b>C<\/b>hoose a desirable outcome → <b>I<\/b>dentify actions → <b>D<\/b>o the action → <b>E<\/b>valuate the effect.<\/li>\n<li><b>3P<\/b>: <b>Perceive<\/b> hazards → <b>Process<\/b> (evaluate risk) → <b>Perform<\/b> (mitigate) — and repeat throughout the flight.<\/li>\n<li><b>PAVE<\/b> checklist: <b>P<\/b>ilot (IMSAFE), <b>A<\/b>ircraft (condition, batteries), en<b>V<\/b>ironment (weather, airspace, terrain, people), <b>E<\/b>xternal pressures (client deadlines, wanting to please, \"get-there-itis\").<\/li>\n<\/ul>\n<h4>Crew Resource Management (CRM)<\/h4>\n<p>CRM is the effective use of <b>all available resources<\/b> — people, equipment and information.<\/p>\n<ul>\n<li><b>Effective team communication<\/b>: a pre-flight briefing; clear, standard phrases; <b>closed-loop<\/b> communication (repeat back); anyone can call \"stop\" for safety; keep chatter out of critical phases (sterile cockpit).<\/li>\n<li><b>Task management<\/b>: prioritize (aviate, navigate, communicate); delegate (VO watches traffic, PIC flies, payload operator runs the camera); avoid task saturation; use checklists.<\/li>\n<\/ul>\n<h4>Situational awareness<\/h4>\n<p>Knowing what is going on around you: aircraft position, battery state, wind, people, other aircraft, the plan. It is lost through distraction, fatigue, complacency and task overload — and the first sign is often surprise. Rebuild it by pausing, hovering, checking telemetry and asking the crew.<\/p>"},{"t":"7.9 Hazardous attitudes and risk management","acs":["UA.V.D.K4","UA.V.D.K5"],"html":"<table class=\"tbl\">\n<tr><th>Attitude<\/th><th>Sounds like<\/th><th>Antidote<\/th><\/tr>\n<tr><td><b>Anti-authority<\/b><\/td><td>\"Don't tell me.\"<\/td><td>\"Follow the rules. They are usually right.\"<\/td><\/tr>\n<tr><td><b>Impulsivity<\/b><\/td><td>\"Do it quickly.\"<\/td><td>\"Not so fast. Think first.\"<\/td><\/tr>\n<tr><td><b>Invulnerability<\/b><\/td><td>\"It won't happen to me.\"<\/td><td>\"It could happen to me.\"<\/td><\/tr>\n<tr><td><b>Macho<\/b><\/td><td>\"I can do it.\"<\/td><td>\"Taking chances is foolish.\"<\/td><\/tr>\n<tr><td><b>Resignation<\/b><\/td><td>\"What's the use?\"<\/td><td>\"I'm not helpless. I can make a difference.\"<\/td><\/tr>\n<\/table>\n<h4>Hazard identification and risk assessment<\/h4>\n<ul>\n<li>A <b>hazard<\/b> is a condition that could lead to an accident (a power line, gusty wind, a tired pilot). <b>Risk<\/b> is the likelihood and severity of a hazard causing harm.<\/li>\n<li>Use a <b>risk matrix<\/b>: likelihood (improbable → frequent) × severity (negligible → catastrophic). High risk → mitigate or don't fly.<\/li>\n<li><b>Mitigate<\/b>: change the time, location, altitude or crew; add a VO; wait for better weather; reduce the mission.<\/li>\n<li>Re-assess as conditions change. Saying \"no-go\" is a successful decision.<\/li>\n<\/ul>\n<details class=\"chk\"><summary>Check yourself: \"The client is waiting — we'll skip the compass calibration and launch.\" Which attitude?<\/summary><b>Impulsivity<\/b> (and external pressure). Antidote: \"Not so fast. Think first.\"<\/details>"},{"t":"7.10 Physiology","acs":["UA.V.E.K1","UA.V.E.K2","UA.V.E.K3","UA.V.E.K4","UA.V.E.K5","UA.V.E.K7"],"html":"<ul>\n<li><b>Dehydration<\/b>: loss of body water; symptoms are thirst, headache, fatigue, cramps, dizziness and poor judgment. Drink water regularly (don't wait for thirst), wear a hat, take breaks in the shade.<\/li>\n<li><b>Heatstroke<\/b>: the body can no longer control its temperature — confusion, hot dry skin, collapse. A medical emergency. Prevent it with water, shade, light clothing and rest.<\/li>\n<li><b>Alcohol and drugs<\/b>: impair judgment, coordination and vision long after you feel fine. 8 hours and BAC under 0.04 are minimums, not targets.<\/li>\n<li><b>Prescription and over-the-counter medication<\/b>: antihistamines, cold medicine, sleep aids, pain medication and many others cause drowsiness or slowed reactions. Read the label; if it warns against driving or operating machinery, don't fly.<\/li>\n<li><b>Hyperventilation<\/b>: breathing too fast or deeply, often from stress or anxiety, causes too little CO₂ — dizziness, tingling, lightheadedness. Fix: <b>slow the breathing rate<\/b>, breathe into a paper bag, or talk aloud.<\/li>\n<li><b>Stress<\/b>: <b>acute<\/b> (short-term: a fly-away) or <b>chronic<\/b> (long-term: job, family, money). Chronic stress degrades performance — don't fly when it's high.<\/li>\n<li><b>Fatigue<\/b>: <b>acute<\/b> (short-term, after hard work or missed sleep; fixed by rest) and <b>chronic<\/b> (long-term, needs more than one night's sleep). Fatigue causes slow reactions, missed items and poor decisions.<\/li>\n<li><b>Fitness for flight — IMSAFE<\/b>: <b>I<\/b>llness · <b>M<\/b>edication · <b>S<\/b>tress · <b>A<\/b>lcohol · <b>F<\/b>atigue · <b>E<\/b>motion/<b>E<\/b>ating.<\/li>\n<\/ul>"},{"t":"7.11 Vision and night","acs":["UA.V.E.K6","UA.V.E.K8","UA.V.E.K9"],"html":"<h4>Factors affecting vision<\/h4>\n<ul>\n<li>Your eyes see clearly only in a narrow central cone. Use a <b>scanning technique<\/b>: a series of short, regularly spaced eye movements, bringing successive areas of the sky into central view — each movement no more than about <b>10°<\/b>, pausing at least <b>1 second<\/b> on each area.<\/li>\n<li><b>Empty-field myopia<\/b>: with nothing to focus on (featureless sky, haze), the eyes relax to a short focal distance and you miss distant aircraft. Focus on a distant object periodically.<\/li>\n<li>Haze and smoke make objects look <b>farther away<\/b> than they are. Glare, a dirty screen, sunglasses and fatigue reduce detection. An aircraft on a collision course shows <b>no relative motion<\/b> — it just grows larger.<\/li>\n<\/ul>\n<h4>Night operations<\/h4>\n<ul>\n<li>Full <b>dark adaptation takes about 30 minutes<\/b>; a bright light ruins it instantly. Use <b>red<\/b> or dim light and dim your control screen.<\/li>\n<li>The center of the eye has a <b>night blind spot<\/b>. Use <b>off-center viewing<\/b> — look about 5–10° to the side of an object to see it at night.<\/li>\n<li>Vitamin A and good overall health help; smoking and fatigue hurt night vision.<\/li>\n<\/ul>\n<h4>Night illusions<\/h4>\n<ul>\n<li><b>Autokinesis<\/b>: staring at a single stationary light (your drone's light against a dark sky) for several seconds makes it appear to move. Keep your eyes moving and cross-check telemetry.<\/li>\n<li><b>False horizon<\/b>: sloping cloud layers, lights on the ground, or stars can be mistaken for the horizon.<\/li>\n<li>It's easy to <b>lose orientation<\/b> of a drone at night — you can't see which way it is facing. Use position lights, a heading indicator on the screen, and conservative maneuvers.<\/li>\n<\/ul>"},{"t":"7.12 Maintenance and inspection","acs":["UA.V.F.K1","UA.V.F.K2","UA.V.F.K3","UA.V.F.K4","UA.V.F.K5","UA.V.F.K6","UA.V.F.K7"],"html":"<ul>\n<li><b>Basic maintenance<\/b>: follow the manufacturer's manual — scheduled maintenance (motor and prop replacement at set hours, firmware updates, battery cycle limits) and unscheduled maintenance (after a hard landing, crash or unusual vibration). If there's no manual, follow industry best practices.<\/li>\n<li><b>Preflight inspection<\/b> (107.15/107.49), using a checklist: airframe and arms (cracks, loose fasteners); <b>propellers<\/b> (chips, cracks, bends, secure); motors (spin freely, no grit); battery (charge, swelling, secure latch); controller and display charged; firmware current; <b>GPS/satellite lock and home point<\/b>; compass/IMU calibration when required; camera, payload and gimbal secure; Remote ID working; control link and failsafe settings correct.<\/li>\n<li><b>Night preflight<\/b>: everything above <b>plus<\/b> anti-collision light working and visible for 3 SM, position lights, crew lighting, and a daylight survey of the site.<\/li>\n<li><b>Mitigating failures<\/b>: replace parts on schedule, carry spare props and batteries, keep firmware consistent across aircraft and controller, monitor battery health, keep the controller and phone/tablet charged, use a backup control station if available.<\/li>\n<li><b>Record keeping<\/b>: keep a log of flights (date, location, duration, crew), maintenance and repairs, parts replaced, battery cycles and incidents. Records help spot trends and show compliance if the FAA asks. Part 107 doesn't require a specific logbook, but CAP does require sortie records.<\/li>\n<li><b>Who may maintain an sUAS<\/b>: the remote PIC or anyone else qualified, following the manufacturer's instructions. No FAA mechanic certificate is needed for Part 107 aircraft (Category 4 follows its approved program and Part 43). Some repairs may need to go back to the manufacturer.<\/li>\n<li><b>Manufacturer's Declaration of Compliance (Categories 2 and 3)<\/b>: confirm the aircraft is on the FAA's list of accepted DoCs, the label is present, and no unapproved modification has been made. If the FAA rescinds a DoC (for a safety defect), the aircraft can't be used over people until it's corrected.<\/li>\n<\/ul>"}]}],"keyNumbers":[["Max weight","< 55 lb incl. payload"],["Max altitude","400 ft AGL (+400 ft over structure within 400 ft)"],["Max groundspeed","87 kt / 100 mph"],["Visibility","3 SM from control station"],["Cloud clearance","500 ft below / 2,000 ft horizontal"],["Anti-collision light","Visible 3 SM"],["Civil twilight","±30 min of official sunrise/sunset"],["Accident report","10 calendar days; >$500, serious injury, LOC"],["Alcohol","8 hours; BAC < 0.04"],["Recency","24 calendar months (ALC-677, free)"],["Address change","30 days"],["Retest wait","14 calendar days"],["Minimum age","16"],["Registration","$5, 3 years, all Part 107 drones"],["Cat 1 / 2 / 3","≤0.55 lb / 11 ft-lb / 25 ft-lb"],["Stadium TFR","3 NM, 3,000 ft AGL, ±1 hour"],["Class C shelf","1,200 ft above airport"],["Magenta vignette","Class E from 700 AGL"],["60° bank","2 G"],["Test","60 Q, 2 hr, 70% (42), $175"]],"flashcards":[["Max weight","< 55 lb incl. payload"],["Max altitude","400 ft AGL (+400 ft over structure within 400 ft)"],["Max groundspeed","87 kt / 100 mph"],["Visibility","3 SM from control station"],["Cloud clearance","500 ft below / 2,000 ft horizontal"],["Anti-collision light","Visible 3 SM"],["Civil twilight","±30 min of official sunrise/sunset"],["Accident report","10 calendar days; >$500, serious injury, LOC"],["Alcohol","8 hours; BAC < 0.04"],["Recency","24 calendar months (ALC-677, free)"],["Address change","30 days"],["Retest wait","14 calendar days"],["Minimum age","16"],["Registration","$5, 3 years, all Part 107 drones"],["Cat 1 / 2 / 3","≤0.55 lb / 11 ft-lb / 25 ft-lb"],["Stadium TFR","3 NM, 3,000 ft AGL, ±1 hour"],["Class C shelf","1,200 ft above airport"],["Magenta vignette","Class E from 700 AGL"],["60° bank","2 G"],["Test","60 Q, 2 hr, 70% (42), $175"],["Solid blue line","Class B"],["Solid magenta line","Class C"],["Dashed blue line","Class D"],["Dashed magenta line","Class E surface area (authorization required)"],["Blue vignette","Class E from 1,200 ft AGL"],["[-25] in Class D","Ceiling up to but not including 2,500 ft MSL"],["Obstacle (number)","Height AGL"],["★ next to CT","Part-time tower"],["Circled C","CTAF"],["MULTICOM","122.9 MHz"],["VR1234 (4 digits)","Flown at or below 1,500 ft AGL"],["AIRMET Sierra","IFR & mountain obscuration"],["AIRMET Tango","Turbulence, ≥30 kt surface winds, LLWS"],["AIRMET Zulu","Icing & freezing levels"],["Ceiling","Lowest BKN, OVC, or VV"],["METAR wind reference","Degrees TRUE"],["Standard atmosphere","15°C, 29.92 inHg"],["Thunderstorm ingredients","Moisture, instability, lift"],["Dissipating stage","Downdrafts dominate"],["Microburst","≤1 mile; up to 6,000 fpm downdraft"],["Anti-authority","Follow the rules. They are usually right."],["Impulsivity","Not so fast. Think first."],["Invulnerability","It could happen to me."],["Macho","Taking chances is foolish."],["Resignation","I'm not helpless. I can make a difference."],["PAVE","Pilot, Aircraft, enVironment, External pressures"],["IMSAFE","Illness, Medication, Stress, Alcohol, Fatigue, Emotion"],["DECIDE","Detect, Estimate, Choose, Identify, Do, Evaluate"],["Remote ID paths","Standard RID · broadcast module · FRIA"],["RID failure in flight","Land as soon as practicable"],["Not waivable","Hazmat (107.36), alcohol/drugs, careless/reckless"],["Who briefs emergencies","Remote PIC"]],"labs":[{"id":"L1","title":"Lab 1 — Legal or Not? (Regulations Scenario Drill)","module":"M1–M2","session":1,"minutes":"15 (inside Module 2)","purpose":"Apply Part 107 rules to realistic CAP and civilian scenarios and cite the regulation.","setup":"Print the scenario cards, cut apart. Teams of 2–3. Each team draws a card, decides LEGAL / NOT LEGAL / LEGAL WITH CONDITIONS, and cites the rule. 60 seconds per card, then debrief.","items":[["A cadet (age 15) with no certificate flies a squadron demo while you, a certificated remote PIC, stand beside her with the ability to take the controls.","LEGAL — uncertificated person under direct supervision; remote PIC can take immediate control. (107.12, 107.19)"],["You inspect an antenna at 1,200 ft AGL, staying 300 ft horizontally from a 900-ft tower, in Class G.","LEGAL — within 400 ft of the structure and no higher than 400 ft above its top (900 + 400 = 1,300 ft). (107.51(b))"],["You fly 20 minutes after sunset with the drone's standard nav lights (visible 1 mile).","NOT LEGAL — civil twilight requires anti-collision lights visible 3 SM. (107.29)"],["Your drone hits a parked car. Repair estimate: $650. No injuries.","LEGAL WITH CONDITIONS — report to FAA within 10 calendar days. (107.9)"],["You had one beer at 7 PM and fly a sunrise mission at 6 AM.","LEGAL — more than 8 hours, provided BAC below 0.04 and not impaired. (107.27/91.17)"],["You fly FPV goggles alone in a field, no one else present.","NOT LEGAL — VLOS requires unaided vision; FPV only with a VO maintaining VLOS. (107.31)"],["You operate two drones at once for a mapping job.","NOT LEGAL without a waiver. (107.35)"],["You fly from a moving pickup truck along a rural road with no houses.","LEGAL — sparsely populated area, not carrying property for hire. (107.25)"],["You carry a small propane canister to a remote site by drone.","NOT LEGAL — hazardous material, not waivable. (107.36)"],["You fly in Class D airspace at 150 ft AGL after getting LAANC approval for 200 ft.","LEGAL — authorized and within the approved altitude. (107.41)"],["Your Remote ID module stops broadcasting mid-flight. You finish the last 3 photos.","NOT LEGAL — land as soon as practicable. (Part 89)"],["A 0.4-lb drone (no exposed lacerating props) hovers over a crowd at a parade, standard Remote ID on.","LEGAL — Category 1 with Remote ID for sustained flight over an open-air assembly; still check TFRs and local rules. (107.110, Part 89)"],["You moved 45 days ago and haven't updated your address with the FAA.","NOT LEGAL to exercise privileges until you notify the FAA. (107.77)"],["Your last recurrent training was completed March 3, 2024. Today is March 20, 2026.","LEGAL — current through March 31, 2026. (107.65)"],["A helicopter approaches your search grid. You keep hovering because you were there first.","NOT LEGAL — must yield right of way. (107.37)"],["You fly a stadium area at 300 ft AGL, 2 NM from an NFL stadium, 45 minutes after the game ends.","NOT LEGAL — the stadium TFR runs until 1 hour after the event. (FDC 4/3621, 99.7)"]]},{"id":"L2","title":"Lab 2 — Airspace & Authorization Planner","module":"M3","session":1,"minutes":"15 (inside Module 3)","purpose":"Determine whether a proposed site needs authorization and how to get it, using live FAA tools.","setup":"Instructor projects the FAA UAS Facility Map and a LAANC app (any FAA-approved supplier). Students work in pairs with phones or laptops. Suggested local sites: Lehigh Valley Intl (ABE, Class C), Reading Regional (RDG, Class D), Philadelphia Intl (PHL, Class B), Quakertown (UKT) and Pottstown (PTW) nontowered airports, and a local stadium. Verify each site's airspace on the current chart before class.","items":[["Site 1: A park 2 NM from a nontowered airport, flying at 200 ft AGL. What airspace? Authorization? Other actions?","Usually Class G (verify chart) — no ATC authorization; avoid interfering with traffic; monitor CTAF optional; check NOTAMs/TFRs."],["Site 2: Inside the surface area of a Class D airport, 150 ft AGL. Grid shows 200.","Class D — LAANC authorization up to 200 ft is available; request 150 ft."],["Site 3: Under a Class C shelf (floor 1,200 ft above airport), 6 NM from the airport, 300 ft AGL.","Outside Class C at your altitude; check if a Class E surface or another class applies; normally no authorization."],["Site 4: Inside Class B surface area, grid shows 0.","LAANC cannot approve; FAADroneZone request with further coordination; plan weeks ahead."],["Site 5: You need 350 ft in a Class D grid showing 200.","Request through FAADroneZone (above facility map altitude)."],["Site 6: Within 3 NM of a 30,000+ seat stadium during an MLB game.","Stadium TFR — prohibited from 1 hr before to 1 hr after unless specially authorized."],["Site 7: Inside an active restricted area.","Need permission from the using/controlling agency."],["Site 8: Inside an MOA.","No permission needed; check activity and use caution."]]},{"id":"L3","title":"Lab 3 — Sectional Chart Lab","module":"M4","session":2,"minutes":70,"purpose":"Build chart-reading skill that transfers to unfamiliar, current sectional excerpts (the post-October 26, 2026 test format).","setup":"Part A uses FAA-CT-8080-2H (printed in color). Part B uses 4–6 excerpts the instructor crops from the CURRENT local sectional (free from FAA Digital VFR Charts). Part C is a timed drill. Students use the Chart Reading Worksheet for each point.","items":[["Part A-1: Using the chart legend (Figure 'Legend' pages of FAA-CT-8080-2H), identify the symbols for Class B, C, D, E-surface, E-700, E-1,200, towered vs nontowered airports, obstacle, group obstacle, parachute area, VFR checkpoint, MTR, MOA, restricted, prohibited.","Instructor checks each against the legend."],["Part A-2: FAA sample question style — 'Refer to Figure 26, area 4: what does the line of latitude measure?'","Degrees north of the equator."],["Part A-3: Using FAA-CT-8080-2H Figure 2 (load factor chart), find the load factor at 30°, 45°, 60°.","≈1.15, ≈1.4, 2.0 (also used in Lab 5)."],["Part B (each excerpt): Complete the Chart Reading Worksheet — airport name/ID, towered?, tower/CTAF/ATIS frequencies, field elevation, airspace class at surface, ceiling (MSL→AGL), authorization needed at 300 ft AGL?, highest obstacle within 2 NM (MSL/AGL), MEF, nearby SUA/MTR/hazards.","Instructor answer key is filled in from the same excerpt before class (see Instructor Key template)."],["Part B example (from the FAA's own August 2026 advisory): Millville Muni (MIV) — what airspace at the surface and is authorization needed?","Class E surface area — authorization required."],["Part B example (FAA August 2026 advisory): Grand Canyon National Park Airport (GCN) — CTAF when the tower is closed?","119.0."],["Part C: 10-minute drill — instructor calls 10 points on a projected unfamiliar excerpt; teams write airspace + authorization (Y/N).","Score: 1 point each; review misses together."]]},{"id":"L4","title":"Lab 4 — METAR / TAF Decoding","module":"M5","session":2,"minutes":"15 (inside Module 5)","purpose":"Decode real-format weather reports and decide go/no-go for a sUAS mission.","setup":"Individual worksheet, 8 minutes, then pair-check. Reports below are realistic training examples, not live data. Optional: pull the live METAR for ABE/RDG from aviationweather.gov and decode it together.","items":[["METAR KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002 — wind, visibility, ceiling, temp/dew, altimeter?","Wind 270° true at 15 kt gusting 25; vis 10 SM; ceiling 4,500 ft AGL (broken); 8°C / −2°C; 30.02 inHg. Go/no-go: gusts may exceed many small UA limits — check manufacturer wind limits."],["METAR KRDG 220554Z 00000KT 1/2SM FG VV002 04/04 A3015 — what's happening? Can you fly at 200 ft?","Calm, ½ SM fog, vertical visibility 200 ft, temp = dewpoint. NO: visibility below 3 SM and obscured; cannot meet cloud/visibility minimums."],["METAR KPHL 221854Z 18008KT 10SM FEW040 SCT250 31/18 A2996 — ceiling?","No ceiling (FEW and SCT only). Hot day → higher density altitude, reduced performance."],["METAR KUKT 231415Z AUTO 32012KT 7SM -RA OVC015 06/03 A2988 — ceiling and precipitation?","Overcast 1,500 ft AGL ceiling; light rain. Legal to fly at 400 ft (500 ft below clouds = must stay at or below 1,000 ft AGL), but rain may exceed UA water limits."],["TAF KABE 211130Z 2112/2212 22010KT P6SM SCT050 FM211800 27018G28KT P6SM BKN040 TEMPO 2120/2124 3SM -SHRA BKN025 — when do winds increase? Worst conditions?","From 1800Z on the 21st: 270° at 18 G28. Temporarily 2000–2400Z: 3 SM in light rain showers, ceiling 2,500 ft."],["Convert 1800Z to local time in Pennsylvania in November (EST).","1300 local (UTC−5)."]]},{"id":"L5","title":"Lab 5 — Loading & Performance Calculations","module":"M6","session":2,"minutes":"10 (inside Module 6)","purpose":"Compute structural loads in turns and reason about CG and density altitude.","setup":"Calculator or the load factor chart (FAA-CT-8080-2H Figure 2).","items":[["A 20-lb fixed-wing UA in a 60° level turn. Load on the structure?","20 × 2.0 = 40 lb."],["A 33-lb UA in a 30° bank (LF ≈ 1.154)?","≈ 38 lb."],["A 10-lb UA in a 45° bank (LF ≈ 1.414)?","≈ 14.1 lb."],["Stall speed is 20 kt in level flight. Approximate stall speed at 60° bank?","20 × √2 ≈ 28 kt."],["A camera is moved aft on a fixed-wing UA. Effect?","CG moves aft → less stable, harder stall recovery."],["Same mission, July afternoon (34°C) vs. November morning (5°C). Which has better performance and why?","November — lower density altitude; but cold reduces battery capacity, so watch voltage."]]},{"id":"L6","title":"Lab 6 — Operations & ADM Scenarios","module":"M7","session":2,"minutes":"20 (inside Module 7)","purpose":"Practice radio interpretation, emergency response, and aeronautical decision-making with CAP-style missions.","setup":"Tables of 3–4. Each table gets one mission card and the emergency inject cards. Use PAVE and IMSAFE on the mission, then respond to injects. 2-minute brief-back per table.","items":[["Mission: Post-storm damage assessment for a county EMA, 4 miles from a nontowered airport. Crew got 4 hours of sleep. The client wants imagery in 1 hour. Apply PAVE.","Pilot: fatigue (IMSAFE) → risk; Aircraft: check batteries/props; enVironment: gusty post-frontal winds, debris, possible TFR (check NOTAMs); External pressure: client deadline — don't let it drive the decision."],["Radio: You hear 'Valley traffic, Cessna 123, left downwind runway 28, Valley.' Where is the aircraft?","Downwind for 28 is flown on ~100°; left traffic → runway on its left (north) → aircraft is south of the runway, flying east."],["Inject: Lost link at 300 ft, RTH set to 150 ft, trees are 120 ft tall near home point.","RTH altitude too low for safety margin; brief crew, watch the aircraft, be ready to resume control; set RTH above obstacles next time."],["Inject: The drone flies away toward a Class D surface area.","Notify the tower with last position/heading/altitude; keep the VO tracking."],["Inject: A battery is puffy after landing.","Remove from service, isolate in a fire-safe container, dispose per guidance."],["Inject: A crew member says, 'Just launch, we can skip the checklist this once.'","Impulsivity → 'Not so fast. Think first.' Complete the checklist."],["Inject: The VO says, 'Nothing bad ever happens on these missions.'","Invulnerability → 'It could happen to me.'"],["Inject: A medical helicopter approaches the scene.","Yield immediately — descend/move clear; land if needed."]]}],"resources":[["14 CFR Part 107 — Small Unmanned Aircraft Systems (eCFR)","https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-107",null,"The regulation itself. Read Subparts A–D.",true],["14 CFR Part 89 — Remote Identification (eCFR)","https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-89",null,"Remote ID rules.",true],["FAA-S-ACS-10B Remote Pilot Airman Certification Standards","https://www.faa.gov/training_testing/testing/acs/uas_acs.pdf","FAA-S-ACS-10B_Remote_Pilot_ACS.pdf","Every testable knowledge element; codes used in this course.",true],["FAA-G-8082-22 Remote Pilot sUAS Study Guide","https://www.faa.gov/sites/faa.gov/files/uas/resources/policy_library/remote_pilot_study_guide.pdf","FAA-G-8082-22_Remote_Pilot_Study_Guide.pdf","Primary student reading.",true],["FAA-CT-8080-2H Airman Knowledge Testing Supplement","https://www.faa.gov/training_testing/testing/supplements/media/sport_rec_private_akts.pdf","FAA-CT-8080-2H_Testing_Supplement.pdf","Figures used on the test. Print sectional, legend, and load factor pages in color.",true],["FAA UAG Sample Questions","https://www.faa.gov/sites/faa.gov/files/training_testing/testing/test_questions/uag_questions.pdf","FAA_UAG_Sample_Questions.pdf","Official sample items with ACS codes.",true],["AC 107-2A Small Unmanned Aircraft System","https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_107-2A.pdf","AC_107-2A.pdf","FAA guidance on certification, operations, over people, night, waivers.",true],["FAA Airman Testing Community Advisory — August 2026","https://www.faa.gov/training_testing/testing/August_2026_ATCA.pdf","FAA_ATCA_August_2026.pdf","Announces UAG chart-image questions from Oct 26, 2026, with two sample items.",true],["FAA Airman Testing Community Advisory — September 2026 Special Edition","https://www.faa.gov/training_testing/testing/September_2026_Special_Edition.pdf","FAA_ATCA_September_2026_Special.pdf","Repeats the UAG chart change.",false],["Pilot's Handbook of Aeronautical Knowledge (FAA-H-8083-25C)","https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak",null,"Weather, ADM, physiology, aerodynamics depth.",false],["Aviation Weather Handbook (FAA-H-8083-28)","https://www.faa.gov/regulations_policies/handbooks_manuals/aviation",null,"METAR/TAF and weather products reference (on the FAA handbooks page).",false],["Aeronautical Information Manual — Chapter 11 (UAS)","https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap11_section_5.html",null,"UAS pilot testing, certification, responsibilities.",false],["FAA Digital VFR Sectional Charts","https://www.faa.gov/air_traffic/flight_info/aeronav/digital_products/vfr/",null,"Current sectionals for the chart lab (New York sectional covers southeastern PA).",true],["FAA UAS Facility Maps","https://www.faa.gov/uas/commercial_operators/uas_facility_maps",null,"LAANC grid altitudes.",true],["FAA TFR List","https://tfr.faa.gov",null,"Current Temporary Flight Restrictions.",false],["aviationweather.gov","https://aviationweather.gov",null,"METAR, TAF, AIRMET, SIGMET, PIREPs.",false],["FAASTeam ALC-451 Part 107 Small UAS Initial","https://www.faasafety.gov/gslac/ALC/CourseLanding.aspx?cID=451",null,"Free online course; anyone may take it as self-study.",true],["FAASTeam ALC-677 Part 107 Recurrent","https://www.faasafety.gov/gslac/ALC/course_content.aspx?cID=677",null,"Free recurrent training every 24 calendar months.",false],["IACRA","https://iacra.faa.gov",null,"Create an FTN before testing; apply for the certificate after passing.",true],["PSI FAA Testing (schedule and practice tests)","https://faa.psiexams.com/faa/login",null,"Schedule the UAG test; free sample tests.",true],["FAADroneZone","https://faadronezone.faa.gov",null,"Registration, waivers, authorizations, accident reports.",false],["How to Register Your Drone (FAA)","https://www.faa.gov/uas/getting_started/register_drone",null,"Registration rules.",false],["Aviation Instructor's Handbook (FAA-H-8083-9)","https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/aviation_instructors_handbook",null,"Teaching techniques used in the Instructor Guide.",false],["AIH Ch. 3 The Learning Process","https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/aviation_instructors_handbook/05_aih_chapter_3.pdf","AIH_Ch3_Learning_Process.pdf","Instructor reading.",false],["AIH Ch. 5 The Teaching Process","https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/aviation_instructors_handbook/07_aih_chapter_5.pdf","AIH_Ch5_Teaching_Process.pdf","Instructor reading.",false],["AIH Ch. 6 Assessment","https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/aviation_instructors_handbook/08_aih_chapter_6.pdf","AIH_Ch6_Assessment.pdf","Instructor reading.",false],["AIH Ch. 7 Planning Instructional Activity","https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/aviation_instructors_handbook/09_aih_chapter_7.pdf","AIH_Ch7_Planning_Instruction.pdf","Instructor reading.",false],["AC 91-57D Exception for Limited Recreational Operations","https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_91-57D.pdf","AC_91-57D.pdf","Recreational vs. Part 107 comparison.",false],["CAP sUAS Regulatory Guidance (CAPR 70-4 and related)","https://www.gocivilairpatrol.com/programs/emergency-services/small-unmanned-aerial-systems-operations/suas-overarching-guidance",null,"CAP sUAS regulations and forms.",true]],"teaching":[["Building-block sequencing","Teach regulations before airspace and airspace before charts, so each block rests on the last (AIH Ch. 7)."],["Scenario-based training (SBT)","Frame rules inside CAP missions — SAR grids, damage assessment, events — so learners decide, not just recall (AIH Ch. 5)."],["Retrieval practice","Short quizzes at the start and end of every block beat rereading. Every module opens with 3 recall questions."],["Spaced repetition","Space practice across pre-work, between-session work, and post-course drills; the two-weekend format adds spacing automatically."],["Interleaving","Mix question topics in later quizzes so learners must identify the rule, as on the real test."],["Worked example → faded guidance","For charts and METARs: instructor models one, pairs do one with prompts, individuals do one alone."],["Telling-and-doing / demonstration-performance","Show LAANC and Facility Maps live, then have every learner perform the lookup (AIH Ch. 5)."],["Guided discussion","Debrief scenarios with 'why' and 'what if' questions rather than giving answers (AIH Ch. 5)."],["Learner-centered grading","Learners self-rate before the instructor grades; compare and discuss gaps (FAA FITS/SBT)."],["Error-focused feedback","Review only the most-missed items, explain the trap, and re-test them within the session."],["Dual coding","Pair every rule with a visual (airspace diagram, chart symbol, number card)."],["Mastery threshold","Learners book the PSI test only after two consecutive practice exams at 85%+."]],"schedule":{"1":[["0:00–0:20","Welcome & roadmap","Course goals, test format, IACRA/PSI, CAP sUAS pathway (CAPR 70-4)"],["0:20–0:35","Diagnostic review","Pre-work diagnostic results; set emphasis"],["0:35–1:35","Module 1","Regulations I — general, certification, reporting, Remote ID"],["1:35–1:45","Break",""],["1:45–2:45","Module 2 + Lab 1","Regulations II — operating rules, night, over people, waivers; Legal or Not? drill"],["2:45–2:55","Break",""],["2:55–3:40","Module 3 + Lab 2","Airspace & authorization; live LAANC/Facility Map planner"],["3:40–4:00","Checkpoint 1","15-question quiz; assign between-session work"]],"2":[["0:00–0:15","Review","Top-missed items from Checkpoint 1 and online work"],["0:15–1:25","Module 4 / Lab 3","Sectional chart lab (supplement → unfamiliar current excerpts → timed drill)"],["1:25–1:35","Break",""],["1:35–2:10","Module 5 + Lab 4","Weather; METAR/TAF decoding"],["2:10–2:30","Module 6 + Lab 5","Loading & performance calculations"],["2:30–2:40","Break",""],["2:40–3:30","Module 7 + Lab 6","Operations & ADM scenarios"],["3:30–3:50","Mini-mock","20 timed questions"],["3:50–4:00","Wrap-up","Full mock online, PSI scheduling, IACRA, CAP UAS Mission Pilot path"]]},"test":[["Test","Unmanned Aircraft General – Small (UAG) at a PSI testing center"],["Questions","60 multiple choice, 3 choices each"],["Time","2 hours"],["Passing","70% (42 of 60)"],["Fee","$175 per attempt (confirm with PSI)"],["Eligi
