<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 107 Remote Pilot Study Guide — CAP</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16202e;--mute:#5a6576;--line:#d9dee6;--acc:#1f3f74;--acc2:#2f5aa3;--accInk:#fff;--pass:#1d7a46;--passBg:#e3f4ea;--fail:#b3261e;--failBg:#fbe7e5;--warn:#8a5a00;--warnBg:#fff3d6;--say:#eef3fb;--sayInk:#163764}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2b3644;--acc:#7fa6e6;--acc2:#a7c3f0;--accInk:#0f141b;--pass:#5fd28f;--passBg:#143322;--fail:#ff8a80;--failBg:#3a1714;--warn:#f0c060;--warnBg:#3a2d0c;--say:#1c2a40;--sayInk:#cfe0ff}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2b3644;--acc:#7fa6e6;--acc2:#a7c3f0;--accInk:#0f141b;--pass:#5fd28f;--passBg:#143322;--fail:#ff8a80;--failBg:#3a1714;--warn:#f0c060;--warnBg:#3a2d0c;--say:#1c2a40;--sayInk:#cfe0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:var(--accInk);padding:12px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.12rem}header .sub{font-size:.8rem;opacity:.85}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav button{background:transparent;border:0;color:inherit;opacity:.8;padding:9px 12px;font:inherit;font-size:.92rem;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-bottom-color:currentColor;font-weight:600}
.theme{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 9px;font:inherit;font-size:.8rem;cursor:pointer;opacity:.85}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:1.25rem;margin:0 0 8px}h3{font-size:1.05rem;margin:14px 0 6px}
.mute{color:var(--mute)}.small{font-size:.86rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tasklist button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.tasklist button:hover{border-color:var(--acc2)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--acc);color:var(--accInk);border-radius:5px;padding:1px 7px;margin-right:6px}
.tag.sec{background:var(--line);color:var(--ink)}
.note{background:var(--warnBg);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:.9rem}
.say{background:var(--say);color:var(--sayInk);border-radius:6px;padding:8px 12px;font-size:.93rem}
ul.tight,ol.tight{margin:4px 0;padding-left:22px}ul.tight li{margin:3px 0}
.btn{background:var(--acc);color:var(--accInk);border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--mute);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc2)}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.opt.ok{background:var(--passBg);border-color:var(--pass);color:var(--pass)}.opt.bad{background:var(--failBg);border-color:var(--fail);color:var(--fail)}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;font-weight:600;cursor:pointer;user-select:none}
.flash .back{font-size:1.1rem;font-weight:400;margin-top:10px;color:var(--acc)}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=text],input[type=password],input[type=number]{width:100%}
label{font-size:.85rem;color:var(--mute);display:block;margin-top:8px}
.badge{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.pass{background:var(--passBg);color:var(--pass)}.badge.fail{background:var(--failBg);color:var(--fail)}.badge.pend{background:var(--line);color:var(--mute)}
.timer{font:700 1.4rem/1 ui-monospace,Consolas,monospace;padding:6px 12px;border-radius:8px;background:var(--say);color:var(--sayInk)}.timer.out{background:var(--failBg);color:var(--fail)}
details{margin-top:8px}summary{cursor:pointer;font-weight:600;color:var(--acc)}
.lock{max-width:380px;margin:40px auto;text-align:center}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.prog>div{height:100%;background:var(--acc2)}
.big{font-size:2.2rem;font-weight:800}
.kv{display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:4px 12px;font-size:.93rem}.kv b{color:var(--mute);font-weight:600}
.qnav{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.qnav button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;font-size:.78rem;cursor:pointer}
.qnav button.ans{background:var(--say)}.qnav button.cur{border-color:var(--acc);border-width:2px}.qnav button.flag{outline:2px solid var(--warn)}
mono,.mono{font-family:ui-monospace,Consolas,monospace}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>

<header class="noprint"><div class="hrow"><div><h1>Part 107 Remote Pilot Study Guide</h1><div class="sub">Civil Air Patrol · FAA Remote Pilot Certificate (sUAS) · UAG knowledge test prep</div></div><button class="theme" onclick="toggleTheme()">◐ Theme</button></div><nav id="nav"></nav></header>
<main id="main"></main>
<script>
const DATA={"areas": {"REG": "Regulations", "AIR": "Airspace & Requirements", "WX": "Weather", "LP": "Loading & Performance", "OPS": "Operations"}, "bank": [{"id": "REG-001", "area": "REG", "acs": "UA.I.A", "q": "Under Part 107, a small unmanned aircraft must weigh:", "choices": ["Less than 50 pounds, not counting the battery", "Less than 55 pounds at takeoff, including everything on board or attached", "55 pounds or less, not counting the payload"], "answer": 1, "exp": "107.3 defines a small UA as less than 55 lb on takeoff including everything on board or otherwise attached.", "ref": "14 CFR 107.3"}, {"id": "REG-002", "area": "REG", "acs": "UA.I.A", "q": "Which operation is NOT governed by Part 107?", "choices": ["Roof inspection photos taken for a contractor who pays you", "Mapping a church cemetery as a donated service for the congregation", "A public aircraft operation conducted by a government agency under its own authority"], "answer": 2, "exp": "Part 107 does not apply to public aircraft operations, air carrier operations, moored balloons, kites, amateur rockets, or unmanned free balloons.", "ref": "14 CFR 107.1"}, {"id": "REG-003", "area": "REG", "acs": "UA.I.B", "q": "Who is directly responsible for, and the final authority over, a small UAS operation?", "choices": ["The remote pilot in command", "The person manipulating the flight controls", "The visual observer"], "answer": 0, "exp": "The remote PIC is directly responsible for and is the final authority as to the operation.", "ref": "14 CFR 107.19"}, {"id": "REG-004", "area": "REG", "acs": "UA.I.B", "q": "A person without a remote pilot certificate may manipulate the flight controls only if:", "choices": ["The remote PIC directly supervises and can immediately take direct control of the aircraft", "The flight remains in Class G airspace below 200 ft AGL", "A visual observer is also present at the control station"], "answer": 0, "exp": "An uncertificated person may fly only under direct supervision of a remote PIC who can immediately take control.", "ref": "14 CFR 107.12(a)(2); 107.19"}, {"id": "REG-005", "area": "REG", "acs": "UA.I.C", "q": "When exercising Part 107 privileges, what must the remote PIC have in physical possession and readily accessible?", "choices": ["A current FAA medical certificate", "The remote pilot certificate and a form of identification", "A printed copy of Part 107 and the aircraft maintenance log"], "answer": 1, "exp": "The certificate and ID must be on hand and readily accessible.", "ref": "14 CFR 107.7(a)(1)"}, {"id": "REG-006", "area": "REG", "acs": "UA.I.C", "q": "Which person may require you to present your remote pilot certificate for inspection?", "choices": ["A local law enforcement officer", "A reporter covering the event", "The owner of property next to your launch site"], "answer": 0, "exp": "The FAA, NTSB, TSA, and any federal, state, or local law enforcement officer may request it.", "ref": "14 CFR 107.7(a)(2)"}, {"id": "REG-007", "area": "REG", "acs": "UA.I.B", "q": "Upon request, a remote PIC must make the small UAS available for inspection or testing to:", "choices": ["The aircraft's manufacturer", "The FAA (the Administrator)", "Any member of the public who files a complaint"], "answer": 1, "exp": "The remote PIC must allow the Administrator to inspect or test the sUAS and associated documents.", "ref": "14 CFR 107.7(b)"}, {"id": "REG-008", "area": "REG", "acs": "UA.I.B", "q": "Within how many days must a reportable small UAS accident be reported to the FAA?", "choices": ["7 business days", "30 calendar days", "10 calendar days"], "answer": 2, "exp": "Report within 10 calendar days of the operation.", "ref": "14 CFR 107.9"}, {"id": "REG-009", "area": "REG", "acs": "UA.I.B", "q": "Which event requires a report to the FAA?", "choices": ["A spectator struck by the UA loses consciousness briefly", "Your UA is destroyed in a crash with no other damage or injury", "A crew member gets a small scratch treated with a bandage"], "answer": 0, "exp": "Reportable: serious injury (AIS level 3 or higher), any loss of consciousness, or more than $500 damage to property other than the UA.", "ref": "14 CFR 107.9"}, {"id": "REG-010", "area": "REG", "acs": "UA.I.B", "q": "Your UA strikes a fence. The repair estimate is $350 and no one is hurt. Must you report it?", "choices": ["Yes, all property damage must be reported", "Yes, because the UA itself was damaged", "No, because damage to property other than the UA does not exceed $500"], "answer": 2, "exp": "Property damage is reportable only when repair cost or fair market value exceeds $500; damage to the UA itself does not count.", "ref": "14 CFR 107.9(b)"}, {"id": "REG-011", "area": "REG", "acs": "UA.I.B", "q": "How may a remote PIC submit a required accident report?", "choices": ["Only by certified mail to the NTSB", "Online through FAADroneZone, or by contacting the local FAA Flight Standards District Office", "Through the drone manufacturer's support portal"], "answer": 1, "exp": "The FAA accepts accident reports through FAADroneZone or the FSDO.", "ref": "14 CFR 107.9; AC 107-2A"}, {"id": "REG-012", "area": "REG", "acs": "UA.I.B", "q": "How long after drinking alcohol must a crewmember wait before acting as a crewmember of a small UAS?", "choices": ["8 hours", "12 hours", "4 hours"], "answer": 0, "exp": "Part 107 applies the 8-hour bottle-to-throttle rule of 91.17.", "ref": "14 CFR 107.27; 91.17"}, {"id": "REG-013", "area": "REG", "acs": "UA.I.B", "q": "A crewmember may not act as a crewmember with a blood alcohol concentration of:", "choices": ["0.02 or greater", "0.04 or greater", "0.08 or greater"], "answer": 1, "exp": "An alcohol concentration of 0.04 or greater is prohibited.", "ref": "14 CFR 107.27; 91.17"}, {"id": "REG-014", "area": "REG", "acs": "UA.I.C", "q": "Refusing a law enforcement request to submit to an alcohol test is grounds for:", "choices": ["Denial of an application for up to one year, or suspension or revocation of the certificate", "A requirement to retake the knowledge test within 30 days", "A written warning only"], "answer": 0, "exp": "Refusal is grounds for denial for up to 1 year or suspension/revocation.", "ref": "14 CFR 107.59"}, {"id": "REG-015", "area": "REG", "acs": "UA.I.C", "q": "A conviction for a federal or state drug offense can result in:", "choices": ["A mandatory five-year ban from all aviation", "Denial of an application for up to one year after the conviction, or suspension or revocation", "No action, because Part 107 has no drug provisions"], "answer": 1, "exp": "Drug convictions are grounds for denial up to one year or suspension/revocation.", "ref": "14 CFR 107.57"}, {"id": "REG-016", "area": "REG", "acs": "UA.I.B", "q": "Does a remote PIC need an FAA medical certificate?", "choices": ["Only for operations at night", "Yes, at least a third-class medical", "No, but no one may fly if they know or have reason to know of a physical or mental condition that would interfere with safe operation"], "answer": 2, "exp": "No medical certificate is required; self-assessment under 107.17 applies.", "ref": "14 CFR 107.17"}, {"id": "REG-017", "area": "REG", "acs": "UA.I.B", "q": "Before each flight, who must check that the small UAS is in a condition for safe operation?", "choices": ["The remote PIC", "An FAA-certificated mechanic", "The visual observer"], "answer": 0, "exp": "The remote PIC must check the sUAS before each flight.", "ref": "14 CFR 107.15; 107.49"}, {"id": "REG-018", "area": "REG", "acs": "UA.I.B", "q": "Which is a required preflight action under 107.49?", "choices": ["Ensure everyone directly participating knows the operating conditions, emergency and contingency procedures, and their roles", "Obtain a standard weather briefing from 1-800-WX-BRIEF", "File a flight plan with Flight Service"], "answer": 0, "exp": "107.49 requires assessing the environment, briefing participants, checking links, power, and attachments. Flight plans and formal briefings are not required.", "ref": "14 CFR 107.49"}, {"id": "REG-019", "area": "REG", "acs": "UA.I.B", "q": "Which statement about visual line of sight (VLOS) is correct?", "choices": ["Corrective lenses may be used, but no other vision-enhancing device satisfies VLOS", "First-person-view goggles worn by the remote PIC satisfy VLOS by themselves", "Binoculars satisfy VLOS if the UA is within 1 mile"], "answer": 0, "exp": "VLOS must be with vision unaided by any device other than corrective lenses. FPV is allowed only if a VO maintains VLOS.", "ref": "14 CFR 107.31"}, {"id": "REG-020", "area": "REG", "acs": "UA.I.B", "q": "Is a visual observer required for Part 107 operations?", "choices": ["Yes, whenever the UA is above 200 ft AGL", "Yes, for every flight", "No; a VO is optional, but if used must maintain effective communication with the remote PIC"], "answer": 2, "exp": "VOs are optional. When used, the remote PIC, person manipulating controls, and VO must communicate effectively.", "ref": "14 CFR 107.33"}, {"id": "REG-021", "area": "REG", "acs": "UA.I.B", "q": "How many small UA may one person operate at the same time without a waiver?", "choices": ["Two, if both are within VLOS", "Three, if a VO is assigned to each", "One"], "answer": 2, "exp": "A person may not operate or act as remote PIC or VO for more than one UA at a time.", "ref": "14 CFR 107.35"}, {"id": "REG-022", "area": "REG", "acs": "UA.I.B", "q": "You may operate a small UA from a moving land vehicle only if:", "choices": ["The vehicle is traveling under 30 mph", "You are over a sparsely populated area and not carrying another person's property for compensation", "You have a visual observer in a second vehicle"], "answer": 1, "exp": "107.25 allows operation from a moving land or water vehicle only over a sparsely populated area.", "ref": "14 CFR 107.25"}, {"id": "REG-023", "area": "REG", "acs": "UA.I.B", "q": "Operating a small UA from a moving aircraft is:", "choices": ["Allowed with a visual observer", "Allowed below 400 ft AGL", "Prohibited"], "answer": 2, "exp": "107.25(a) prohibits operation from a moving aircraft.", "ref": "14 CFR 107.25"}, {"id": "REG-024", "area": "REG", "acs": "UA.I.B", "q": "May you drop an object from a small UA?", "choices": ["Yes, if doing so does not create an undue hazard to persons or property", "Only with a waiver", "No, never"], "answer": 0, "exp": "Dropping objects is allowed if it does not create an undue hazard.", "ref": "14 CFR 107.23(b)"}, {"id": "REG-025", "area": "REG", "acs": "UA.I.B", "q": "Carrying hazardous material on a small UA is:", "choices": ["Allowed if under 5 pounds", "Allowed with a Part 107 waiver", "Prohibited and cannot be waived"], "answer": 2, "exp": "107.36 prohibits carrying hazardous material, and it is not on the list of waivable sections.", "ref": "14 CFR 107.36; 107.205"}, {"id": "REG-026", "area": "REG", "acs": "UA.I.B", "q": "Regarding manned aircraft, the remote PIC must:", "choices": ["Have right of way below 400 ft AGL", "Yield only to aircraft in the traffic pattern", "Yield the right of way to all aircraft and not pass so close as to create a collision hazard"], "answer": 2, "exp": "The small UA must yield to all aircraft, airborne vehicles, and launch/reentry vehicles.", "ref": "14 CFR 107.37"}, {"id": "REG-027", "area": "REG", "acs": "UA.I.B", "q": "Without a waiver, the maximum altitude for a small UA is:", "choices": ["500 ft AGL in Class G airspace", "400 ft MSL", "400 ft AGL, unless within a 400-ft radius of a structure and no higher than 400 ft above its uppermost limit"], "answer": 2, "exp": "The 400-ft AGL limit has a structure exception.", "ref": "14 CFR 107.51(b)"}, {"id": "REG-028", "area": "REG", "acs": "UA.I.B", "q": "You are inspecting a 1,200-ft AGL tower, staying within 400 ft of it. What is your maximum altitude?", "choices": ["400 ft AGL", "1,200 ft AGL", "1,600 ft AGL"], "answer": 2, "exp": "Within a 400-ft radius you may fly up to 400 ft above the structure's top: 1,200 + 400 = 1,600 ft AGL. Airspace authorization rules still apply.", "ref": "14 CFR 107.51(b)"}, {"id": "REG-029", "area": "REG", "acs": "UA.I.B", "q": "What is the maximum groundspeed for a small UA?", "choices": ["87 knots (100 mph)", "70 knots (80 mph)", "100 knots (115 mph)"], "answer": 0, "exp": "107.51(a): 87 knots.", "ref": "14 CFR 107.51(a)"}, {"id": "REG-030", "area": "REG", "acs": "UA.I.B", "q": "What is the minimum flight visibility, as observed from the control station?", "choices": ["3 statute miles", "1 statute mile", "5 statute miles"], "answer": 0, "exp": "107.51(c): 3 SM from the control station.", "ref": "14 CFR 107.51(c)"}, {"id": "REG-031", "area": "REG", "acs": "UA.I.B", "q": "What are the minimum distances from clouds?", "choices": ["Clear of clouds", "1,000 ft below and 1 mile horizontally", "500 ft below and 2,000 ft horizontally"], "answer": 2, "exp": "107.51(d): 500 ft below, 2,000 ft horizontally.", "ref": "14 CFR 107.51(d)"}, {"id": "REG-032", "area": "REG", "acs": "UA.I.B", "q": "In the contiguous United States, civil twilight is:", "choices": ["One hour before sunrise until sunrise, and sunset until one hour after sunset", "30 minutes before official sunrise until sunrise, and sunset until 30 minutes after official sunset", "The period when the sun is more than 6 degrees below the horizon"], "answer": 1, "exp": "107.3 defines civil twilight this way except in Alaska.", "ref": "14 CFR 107.3"}, {"id": "REG-033", "area": "REG", "acs": "UA.I.B", "q": "To fly during civil twilight or at night, the small UA must have:", "choices": ["Lighted anti-collision lighting visible for at least 3 statute miles with a flash rate sufficient to avoid a collision", "A strobe visible for 5 statute miles and a night waiver", "Navigation lights visible for 1 statute mile"], "answer": 0, "exp": "107.29 requires anti-collision lighting visible for at least 3 SM.", "ref": "14 CFR 107.29"}, {"id": "REG-034", "area": "REG", "acs": "UA.I.B", "q": "When may the remote PIC reduce the intensity of the anti-collision lighting at night?", "choices": ["Whenever the UA is below 100 ft AGL", "When it is in the interest of safety, but the lights may not be turned off", "Never"], "answer": 1, "exp": "107.29 allows reducing intensity, not extinguishing, if in the interest of safety.", "ref": "14 CFR 107.29"}, {"id": "REG-035", "area": "REG", "acs": "UA.I.B", "q": "Besides anti-collision lighting, what does a remote PIC need to fly at night under Part 107?", "choices": ["A night waiver from FAADroneZone", "A visual observer for each flight", "To have passed the initial knowledge test or completed recurrent training under the current (post-April 6, 2021) rules"], "answer": 2, "exp": "Night operations no longer need a waiver; the pilot must have current knowledge testing or training that covers night.", "ref": "14 CFR 107.29(a)"}, {"id": "REG-036", "area": "REG", "acs": "UA.I.B", "q": "Which airspace requires prior ATC authorization for a Part 107 operation?", "choices": ["Class B, C, D, and the surface area of Class E designated for an airport", "Only Class B and C", "Any airspace within 5 miles of any airport"], "answer": 0, "exp": "107.41 requires ATC authorization in those areas.", "ref": "14 CFR 107.41"}, {"id": "REG-037", "area": "REG", "acs": "UA.I.B", "q": "You plan to fly in Class G airspace 2 miles from a nontowered airport. What is required?", "choices": ["Permission from the airport manager", "No ATC authorization, but you must not interfere with operations and traffic patterns at the airport", "LAANC authorization"], "answer": 1, "exp": "Class G needs no ATC authorization; 107.43 prohibits interfering with airport traffic.", "ref": "14 CFR 107.43"}, {"id": "REG-038", "area": "REG", "acs": "UA.I.B", "q": "May you fly in a restricted area?", "choices": ["Yes, if it is a weekend", "Yes, below 400 ft AGL", "Only with permission from the using or controlling agency"], "answer": 2, "exp": "107.45 prohibits operating in prohibited or restricted areas unless the using or controlling agency gives permission.", "ref": "14 CFR 107.45"}, {"id": "REG-039", "area": "REG", "acs": "UA.I.B", "q": "During an in-flight emergency, the remote PIC may deviate from Part 107 rules:", "choices": ["Only after receiving ATC permission", "Never", "To the extent necessary, and must send a written report to the FAA if requested"], "answer": 2, "exp": "107.21 allows deviation to meet the emergency; a written report is required upon FAA request.", "ref": "14 CFR 107.21"}, {"id": "REG-040", "area": "REG", "acs": "UA.I.B", "q": "Who is responsible for determining the performance of the small UA for a given operation?", "choices": ["The manufacturer", "The remote PIC", "The FAA"], "answer": 1, "exp": "The remote PIC must ensure the UA will pose no undue hazard, including knowing its performance.", "ref": "14 CFR 107.19; 107.49"}, {"id": "REG-041", "area": "REG", "acs": "UA.I.B", "q": "Operating a small UA in a careless or reckless manner that endangers life or property is:", "choices": ["Allowed if a VO is present", "Prohibited", "Allowed in Class G airspace"], "answer": 1, "exp": "107.23(a) prohibits careless or reckless operation.", "ref": "14 CFR 107.23(a)"}, {"id": "REG-042", "area": "REG", "acs": "UA.I.C", "q": "What is the minimum age to obtain a remote pilot certificate?", "choices": ["18", "16", "14"], "answer": 1, "exp": "107.61 requires the applicant to be at least 16.", "ref": "14 CFR 107.61"}, {"id": "REG-043", "area": "REG", "acs": "UA.I.C", "q": "Which is an eligibility requirement for a remote pilot certificate?", "choices": ["Hold a third-class medical certificate", "Own a registered drone", "Be able to read, speak, write, and understand English (unless an FAA limitation applies for medical reasons)"], "answer": 2, "exp": "107.61 lists age, English proficiency, fitness, and passing the knowledge test.", "ref": "14 CFR 107.61"}, {"id": "REG-044", "area": "REG", "acs": "UA.I.C", "q": "After passing the knowledge test, how do you apply for the certificate?", "choices": ["Through IACRA (FAA Form 8710-13), followed by TSA security vetting", "By mailing your test report to the TSA", "At the PSI testing center on test day"], "answer": 0, "exp": "Applicants use IACRA; TSA vets the applicant before the temporary certificate is issued.", "ref": "14 CFR 107.63; AC 107-2A"}, {"id": "REG-045", "area": "REG", "acs": "UA.I.C", "q": "To exercise remote pilot privileges, aeronautical knowledge must be current within the preceding:", "choices": ["36 calendar months", "12 calendar months", "24 calendar months"], "answer": 2, "exp": "107.65: pass the initial test or complete recurrent training within the previous 24 calendar months.", "ref": "14 CFR 107.65"}, {"id": "REG-046", "area": "REG", "acs": "UA.I.C", "q": "You complete recurrent training on April 6, 2025. Through what date may you exercise privileges?", "choices": ["April 6, 2027", "April 30, 2027", "April 30, 2026"], "answer": 1, "exp": "Calendar months run to the end of the month: 24 calendar months from April 2025 ends April 30, 2027.", "ref": "14 CFR 107.65; FAASTeam NOTC1795"}, {"id": "REG-047", "area": "REG", "acs": "UA.I.C", "q": "How do remote pilots keep their aeronautical knowledge current?", "choices": ["Complete the free FAA online recurrent training (ALC-677) every 24 calendar months", "Fly at least 3 hours every 90 days", "Retake the knowledge test at a PSI center every two years"], "answer": 0, "exp": "Since 2021, recurrent knowledge is maintained through free online training.", "ref": "14 CFR 107.65; FAASafety.gov"}, {"id": "REG-048", "area": "REG", "acs": "UA.I.C", "q": "When does a remote pilot certificate expire?", "choices": ["After 5 years", "After 24 calendar months", "It does not expire, but the holder must maintain aeronautical knowledge recency to use it"], "answer": 2, "exp": "The certificate has no expiration date; recency is separate.", "ref": "14 CFR 107.65"}, {"id": "REG-049", "area": "REG", "acs": "UA.I.C", "q": "After moving, how long do you have to notify the FAA of a new permanent mailing address and keep exercising privileges?", "choices": ["30 days", "90 days", "10 days"], "answer": 0, "exp": "After 30 days you may not exercise privileges until the FAA is notified.", "ref": "14 CFR 107.77"}, {"id": "REG-050", "area": "REG", "acs": "UA.I.C", "q": "A Part 61 pilot with a current flight review can earn a remote pilot certificate by:", "choices": ["Completing the FAA online training course (ALC-451) instead of the knowledge test", "Logging 5 hours of drone time", "Getting a logbook endorsement from a CFI"], "answer": 0, "exp": "Current Part 61 pilots may complete ALC-451 in lieu of the initial test.", "ref": "14 CFR 107.61(d); 107.74"}, {"id": "REG-051", "area": "REG", "acs": "UA.I.C", "q": "If you fail the knowledge test, how long must you wait to retest?", "choices": ["14 calendar days", "You may retest the same day", "30 days"], "answer": 0, "exp": "107.71: wait 14 calendar days after a failure.", "ref": "14 CFR 107.71"}, {"id": "REG-052", "area": "REG", "acs": "UA.I.B", "q": "A 0.5-lb (220 g) drone will be flown under Part 107 for a paid job. Must it be registered?", "choices": ["No, drones under 0.55 lb never need registration", "Only if it has a camera", "Yes; all drones flown under Part 107 must be registered regardless of weight"], "answer": 2, "exp": "The 0.55-lb exception applies only to limited recreational flying.", "ref": "14 CFR Part 48; FAA registration guidance"}, {"id": "REG-053", "area": "REG", "acs": "UA.I.B", "q": "Where must the FAA registration number be displayed?", "choices": ["Inside the battery compartment", "On the remote controller only", "On an external surface of the aircraft"], "answer": 2, "exp": "Registration numbers must be on an external surface, applied by engraving, permanent label, or permanent marker.", "ref": "14 CFR 48.200–48.205; AIM 11-2-2"}, {"id": "REG-054", "area": "REG", "acs": "UA.I.B", "q": "How long is a Part 48 small UA registration valid?", "choices": ["3 years", "5 years", "1 year"], "answer": 0, "exp": "Part 107 registration is valid for three years.", "ref": "FAA AIP ENR 8.2"}, {"id": "REG-055", "area": "REG", "acs": "UA.I.B", "q": "An 11-year-old owns a drone that must be registered. Who registers it?", "choices": ["The 11-year-old, with a parent's email", "No one; minors are exempt", "Another person 13 years of age or older"], "answer": 2, "exp": "If the owner is under 13, someone 13 or older must register the UA.", "ref": "AIM 11-2-2"}, {"id": "REG-056", "area": "REG", "acs": "UA.I.F", "q": "Which are the ways to comply with the Remote ID rule?", "choices": ["File a flight plan or use LAANC", "Carry a transponder or ADS-B Out", "Fly a standard Remote ID drone, attach a Remote ID broadcast module, or fly at an FAA-Recognized Identification Area (FRIA)"], "answer": 2, "exp": "Part 89 provides those three compliance paths.", "ref": "14 CFR Part 89"}, {"id": "REG-057", "area": "REG", "acs": "UA.I.F", "q": "When using a Remote ID broadcast module, the operation must be:", "choices": ["Below 200 ft AGL", "Within 1 NM of the takeoff point", "Within visual line of sight of the person manipulating the flight controls"], "answer": 2, "exp": "Broadcast-module operations are limited to VLOS.", "ref": "14 CFR 89.115"}, {"id": "REG-058", "area": "REG", "acs": "UA.I.F", "q": "Your standard Remote ID drone stops broadcasting during flight. What must you do?", "choices": ["Continue the mission and report it within 10 days", "Land as soon as practicable", "Climb to improve the signal"], "answer": 1, "exp": "If Remote ID stops broadcasting, land as soon as practicable.", "ref": "14 CFR 89.110"}, {"id": "REG-059", "area": "REG", "acs": "UA.I.F", "q": "Which item is NOT part of a standard Remote ID broadcast?", "choices": ["The control station's position", "The remote pilot's name", "The UA's position, altitude, and velocity"], "answer": 1, "exp": "Remote ID broadcasts UA ID, UA and control-station location/altitude, velocity, time, and emergency status, not the pilot's name.", "ref": "14 CFR 89.305"}, {"id": "REG-060", "area": "REG", "acs": "UA.I.F", "q": "A drone without Remote ID equipment may be flown:", "choices": ["Anywhere below 200 ft AGL", "Anywhere in Class G airspace", "Only within visual line of sight at an FAA-Recognized Identification Area (FRIA)"], "answer": 2, "exp": "Without RID equipment, flights are limited to FRIAs, within VLOS.", "ref": "14 CFR 89.115"}, {"id": "REG-061", "area": "REG", "acs": "UA.I.F", "q": "Where must the serial number of a standard Remote ID drone be listed?", "choices": ["On the remote pilot certificate", "In the flight log only", "On the drone's FAA registration (Certificate of Aircraft Registration)"], "answer": 2, "exp": "The RID serial number is entered in the Part 48 registration.", "ref": "14 CFR 48.100; 89.130"}, {"id": "REG-062", "area": "REG", "acs": "UA.I.E", "q": "Which small UA qualifies for Category 1 operations over people?", "choices": ["One weighing 0.55 lb or less including everything on board, with no exposed rotating parts that would lacerate skin", "Any UA under 2 lb with propeller guards", "Any UA with a parachute"], "answer": 0, "exp": "Category 1 is weight-based (0.55 lb or less) plus no lacerating exposed rotating parts.", "ref": "14 CFR 107.110"}, {"id": "REG-063", "area": "REG", "acs": "UA.I.E", "q": "Category 2 operations over people require a UA that:", "choices": ["Weighs less than 2 lb", "Has an airworthiness certificate", "Would not cause injury worse than an 11 ft-lb kinetic energy transfer, has no exposed lacerating rotating parts, and has an FAA-accepted declaration of compliance"], "answer": 2, "exp": "Category 2: 11 ft-lb injury threshold, no exposed rotating parts, no safety defects, FAA-accepted DOC.", "ref": "14 CFR 107.115–107.120"}, {"id": "REG-064", "area": "REG", "acs": "UA.I.E", "q": "Which statement about Category 3 operations is correct?", "choices": ["No declaration of compliance is required", "Up to 50 ft-lb injury threshold is allowed", "Sustained flight over open-air assemblies is prohibited"], "answer": 2, "exp": "Category 3 (25 ft-lb) is prohibited over open-air assemblies and limited to restricted-access sites or transit over people.", "ref": "14 CFR 107.125"}, {"id": "REG-065", "area": "REG", "acs": "UA.I.E", "q": "Which category of operations over people requires an FAA airworthiness certificate?", "choices": ["Category 2", "Category 3", "Category 4"], "answer": 2, "exp": "Category 4 requires a UA with an airworthiness certificate under Part 21.", "ref": "14 CFR 107.140"}, {"id": "REG-066", "area": "REG", "acs": "UA.I.E", "q": "To conduct sustained flight over an open-air assembly in Category 1, 2, or 4, the UA must also:", "choices": ["Carry a parachute", "Meet Remote ID requirements", "Have a visual observer for every 100 people"], "answer": 1, "exp": "Sustained flight over open-air assemblies requires Remote ID compliance.", "ref": "14 CFR 107.110–107.140; Part 89"}, {"id": "REG-067", "area": "REG", "acs": "UA.I.D", "q": "Which Part 107 section CAN be waived?", "choices": ["107.31, visual line of sight", "107.27, alcohol or drugs", "107.36, carriage of hazardous material"], "answer": 0, "exp": "107.205 lists waivable sections; VLOS is one. Hazmat and alcohol are not.", "ref": "14 CFR 107.205"}, {"id": "REG-068", "area": "REG", "acs": "UA.I.D", "q": "How do you request a Part 107 waiver?", "choices": ["Ask a CFI for an endorsement", "Call the nearest control tower", "Apply through FAADroneZone, explaining how the operation will be conducted safely, well ahead of the planned date"], "answer": 2, "exp": "Waivers are requested through FAADroneZone; the FAA advises allowing up to 90 days.", "ref": "14 CFR 107.200; AC 107-2A"}, {"id": "REG-069", "area": "REG", "acs": "UA.I.B", "q": "A Part 107 certificate holder wants to fly purely for fun under the recreational exception. What must they do?", "choices": ["Follow the recreational rules, including passing TRUST, or simply fly under Part 107 rules", "Get a recreational waiver", "Nothing; the Part 107 certificate covers recreational rules"], "answer": 0, "exp": "To fly under 49 U.S.C. 44809 the person must meet its requirements, including TRUST; otherwise fly under Part 107.", "ref": "AIM 11-5-1"}, {"id": "REG-070", "area": "REG", "acs": "UA.I.B", "q": "Which UA may be registered for recreational use and then flown on a Part 107 job?", "choices": ["Any drone with Remote ID", "None; a drone registered under the recreational exception cannot be flown under Part 107", "Any drone under 0.55 lb"], "answer": 1, "exp": "Drones registered as recreational must be registered under Part 107 before Part 107 use.", "ref": "FAA registration guidance"}, {"id": "AIR-071", "area": "AIR", "acs": "UA.II.A", "q": "Class A airspace begins at:", "choices": ["10,000 ft MSL", "18,000 ft MSL", "14,500 ft MSL"], "answer": 1, "exp": "Class A extends from 18,000 ft MSL up to FL600.", "ref": "AIM 3-2-2"}, {"id": "AIR-072", "area": "AIR", "acs": "UA.II.A", "q": "On a sectional chart, Class B airspace is shown by:", "choices": ["Dashed blue lines", "Solid magenta lines", "Solid blue lines"], "answer": 2, "exp": "Class B is solid blue; Class C solid magenta; Class D dashed blue.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-073", "area": "AIR", "acs": "UA.II.A", "q": "On a sectional chart, Class C airspace is shown by:", "choices": ["Solid magenta lines", "Solid blue lines", "Dashed magenta lines"], "answer": 0, "exp": "Class C is solid magenta.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-074", "area": "AIR", "acs": "UA.II.A", "q": "On a sectional chart, Class D airspace is shown by:", "choices": ["A magenta vignette", "Dashed blue lines", "Solid blue lines"], "answer": 1, "exp": "Class D is dashed blue.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-075", "area": "AIR", "acs": "UA.II.A", "q": "A dashed magenta line around an airport indicates:", "choices": ["Class E airspace beginning at the surface", "Class D airspace", "A Mode C veil"], "answer": 0, "exp": "Dashed magenta depicts a Class E surface area, which requires ATC authorization under 107.41.", "ref": "Aeronautical Chart User's Guide; 14 CFR 107.41"}, {"id": "AIR-076", "area": "AIR", "acs": "UA.II.A", "q": "A shaded magenta band (vignette) indicates Class E airspace begins at:", "choices": ["The surface", "700 ft AGL", "1,200 ft AGL"], "answer": 1, "exp": "Magenta vignette: Class E from 700 ft AGL. Blue vignette: 1,200 ft AGL.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-077", "area": "AIR", "acs": "UA.II.A", "q": "Below the floor of a magenta vignette, at 300 ft AGL, you are typically in:", "choices": ["Class D airspace", "Class G airspace, so no ATC authorization is needed", "Class E airspace, so LAANC is required"], "answer": 1, "exp": "Below 700 ft AGL under a magenta vignette is Class G (unless another class is depicted).", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-078", "area": "AIR", "acs": "UA.II.A", "q": "A Class D ceiling is shown as [32]. This means the ceiling is:", "choices": ["3,200 ft AGL", "3,200 ft MSL", "32,000 ft MSL"], "answer": 1, "exp": "Bracketed numbers are hundreds of feet MSL. A minus sign, [-32], means up to but not including 3,200 MSL.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-079", "area": "AIR", "acs": "UA.II.A", "q": "A Class B sector is labeled 80 over 30. The floor of that sector is:", "choices": ["8,000 ft MSL", "3,000 ft AGL", "3,000 ft MSL"], "answer": 2, "exp": "Top number is the ceiling, bottom the floor, in hundreds of feet MSL.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-080", "area": "AIR", "acs": "UA.II.A", "q": "The outer shelf of typical Class C airspace begins at:", "choices": ["1,200 ft above the airport elevation", "The surface", "700 ft AGL"], "answer": 0, "exp": "Class C: surface area about 5 NM; shelf out to about 10 NM from 1,200 ft up to 4,000 ft above the airport.", "ref": "AIM 3-2-4"}, {"id": "AIR-081", "area": "AIR", "acs": "UA.II.A", "q": "You will fly at 200 ft AGL beneath a Class C shelf whose floor is 1,200 ft above the airport. Do you need ATC authorization?", "choices": ["No, because you are below the shelf and outside Class C", "Yes, because all airspace under Class C is Class D", "Yes, because you are within 10 NM of a Class C airport"], "answer": 0, "exp": "Authorization depends on the airspace you are in. Below the shelf is usually Class E or G; check for surface areas.", "ref": "14 CFR 107.41"}, {"id": "AIR-082", "area": "AIR", "acs": "UA.II.A", "q": "Typical Class D airspace extends from the surface to:", "choices": ["About 2,500 ft above the airport elevation", "10,000 ft MSL", "4,000 ft above the airport elevation"], "answer": 0, "exp": "Class D generally extends to 2,500 ft above airport elevation (charted in MSL).", "ref": "AIM 3-2-5"}, {"id": "AIR-083", "area": "AIR", "acs": "UA.II.A", "q": "A thin magenta circle labeled MODE C 30 NM surrounds a Class B airport. Does it require sUAS authorization?", "choices": ["Yes, all flights inside the veil need LAANC", "Yes, and a transponder is required", "No; authorization depends on the airspace class you are in, not the Mode C veil"], "answer": 2, "exp": "The Mode C veil is a transponder rule for manned aircraft.", "ref": "14 CFR 91.215; 107.41"}, {"id": "AIR-084", "area": "AIR", "acs": "UA.II.A", "q": "Class G airspace is:", "choices": ["Airspace above 14,500 ft MSL", "Controlled airspace near small airports", "Uncontrolled airspace, requiring no ATC authorization for Part 107"], "answer": 2, "exp": "Class G is uncontrolled.", "ref": "AIM 3-3-1"}, {"id": "AIR-085", "area": "AIR", "acs": "UA.V.B", "q": "An airport symbol printed in magenta indicates:", "choices": ["A towered airport", "A nontowered airport", "A military airport"], "answer": 1, "exp": "Blue airport symbols have control towers; magenta symbols do not.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-086", "area": "AIR", "acs": "UA.V.B", "q": "A star next to the tower frequency (CT – 118.3 ★) means:", "choices": ["The tower operates part-time", "The airport has a rotating beacon", "The frequency is for emergencies only"], "answer": 0, "exp": "The star indicates part-time tower operation; check the Chart Supplement for hours.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-087", "area": "AIR", "acs": "UA.V.B", "q": "On a sectional, a C in a solid circle after a frequency identifies:", "choices": ["The Common Traffic Advisory Frequency (CTAF)", "Class C airspace", "The control tower"], "answer": 0, "exp": "The circled C marks the CTAF.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-088", "area": "AIR", "acs": "UA.V.B", "q": "In an airport data block, 'L 72' indicates:", "choices": ["Lighting available for 72 hours", "Field elevation of 72 ft", "Runway lighting, with a longest runway of 7,200 ft"], "answer": 2, "exp": "Runway length appears in hundreds of feet.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-089", "area": "AIR", "acs": "UA.V.B", "q": "An obstacle is labeled 1549 above (1222). How tall is the obstacle above the ground?", "choices": ["1,222 ft", "1,549 ft", "327 ft"], "answer": 0, "exp": "The bold top number is MSL; the number in parentheses is AGL.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-090", "area": "AIR", "acs": "UA.V.B", "q": "A Maximum Elevation Figure (MEF) of 2 with a small 7 means:", "choices": ["2,700 ft MSL is the highest elevation, including obstacles, in that quadrangle (with a buffer)", "The quadrangle has 27 obstacles", "2,700 ft AGL is the minimum safe altitude"], "answer": 0, "exp": "MEFs are in thousands and hundreds of feet MSL.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-091", "area": "AIR", "acs": "UA.II.A", "q": "Before flying in a Military Operations Area (MOA), the remote PIC should:", "choices": ["Avoid it; flight is prohibited", "Check whether it is active (Chart Supplement, FSS, or controlling agency) and use extra caution; no permission is required", "Get written permission from the military"], "answer": 1, "exp": "MOAs do not require permission, but military activity may be present.", "ref": "AIM 3-4-5"}, {"id": "AIR-092", "area": "AIR", "acs": "UA.II.A", "q": "A prohibited area such as P-56 means:", "choices": ["Flight is allowed below 400 ft AGL", "Flight is prohibited", "Flight requires LAANC"], "answer": 1, "exp": "Prohibited areas ban flight for security or national welfare reasons.", "ref": "AIM 3-4-2"}, {"id": "AIR-093", "area": "AIR", "acs": "UA.II.A", "q": "An alert area on a sectional indicates:", "choices": ["A high volume of pilot training or unusual aerial activity; no permission needed but use caution", "Flight is prohibited when active", "A Temporary Flight Restriction"], "answer": 0, "exp": "Alert areas inform pilots of activity; all pilots are responsible for collision avoidance.", "ref": "AIM 3-4-6"}, {"id": "AIR-094", "area": "AIR", "acs": "UA.II.A", "q": "A warning area is generally located:", "choices": ["Offshore, beginning 3 NM from the coast, containing hazards to non-participating aircraft", "Over national parks", "Around nuclear power plants"], "answer": 0, "exp": "Warning areas extend from 3 NM outward from the U.S. coast.", "ref": "AIM 3-4-4"}, {"id": "AIR-095", "area": "AIR", "acs": "UA.II.A", "q": "A Military Training Route labeled VR1667 is flown:", "choices": ["At or below 1,500 ft AGL", "Above 1,500 ft AGL", "Only at night"], "answer": 0, "exp": "Four-digit MTRs have no segments above 1,500 ft AGL; three-digit routes have one or more segments above 1,500 ft AGL.", "ref": "AIM 3-5-2"}, {"id": "AIR-096", "area": "AIR", "acs": "UA.II.A", "q": "Temporary Flight Restrictions (TFRs) are issued as:", "choices": ["AIRMETs", "Chart Supplement entries", "FDC NOTAMs"], "answer": 2, "exp": "TFRs are published as Flight Data Center NOTAMs; check tfr.faa.gov or B4UFLY.", "ref": "AIM 3-5-3"}, {"id": "AIR-097", "area": "AIR", "acs": "UA.II.A", "q": "For a major sporting event, the standard stadium TFR prohibits drones:", "choices": ["Within 3 NM and up to 3,000 ft AGL, from 1 hour before until 1 hour after the event", "Within 1 NM and up to 1,000 ft AGL during the event only", "Within 5 NM and up to 5,000 ft AGL all day"], "answer": 0, "exp": "Applies to MLB, NFL, NCAA Division I football, and major motor speedway events at venues seating 30,000 or more.", "ref": "FDC NOTAM 4/3621; 14 CFR 99.7"}, {"id": "AIR-098", "area": "AIR", "acs": "UA.II.B", "q": "LAANC provides:", "choices": ["Weather briefings for drone pilots", "Near-real-time ATC authorization in controlled airspace up to the altitudes on UAS Facility Maps", "Remote ID registration"], "answer": 1, "exp": "LAANC automates authorization requests through FAA-approved service suppliers.", "ref": "FAA LAANC guidance"}, {"id": "AIR-099", "area": "AIR", "acs": "UA.II.B", "q": "A UAS Facility Map grid shows 100. This means:", "choices": ["The grid is 100 square miles", "You may fly up to 100 ft AGL without authorization", "ATC may authorize operations up to 100 ft AGL in that grid through LAANC"], "answer": 2, "exp": "Grid values are the maximum altitude ATC may authorize there. A 0 means further coordination is required.", "ref": "FAA UAS Facility Maps"}, {"id": "AIR-100", "area": "AIR", "acs": "UA.II.B", "q": "You need to fly higher than the UAS Facility Map altitude in Class D. What should you do?", "choices": ["Call the tower 10 minutes before flight", "Request authorization through FAADroneZone, allowing time for review", "Use LAANC; it overrides the map"], "answer": 1, "exp": "Requests above facility map altitudes go through FAADroneZone.", "ref": "FAA LAANC guidance"}, {"id": "AIR-101", "area": "AIR", "acs": "UA.V.B", "q": "Lines of latitude measure:", "choices": ["Position east or west of the prime meridian", "Magnetic variation", "Position north or south of the equator"], "answer": 2, "exp": "Latitude lines run east-west and measure degrees north or south of the equator.", "ref": "PHAK Ch. 16"}, {"id": "AIR-102", "area": "AIR", "acs": "UA.V.B", "q": "A parachute symbol on a sectional indicates:", "choices": ["A parachute jumping area", "A glider operations area", "An emergency landing site"], "answer": 0, "exp": "Expect parachutists and jump aircraft; check the Chart Supplement.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-103", "area": "AIR", "acs": "UA.V.B", "q": "A small magenta flag symbol on a sectional marks:", "choices": ["A visual checkpoint used by manned aircraft, so expect low-flying traffic", "A drone flying site", "A Remote ID area"], "answer": 0, "exp": "VFR checkpoints concentrate manned traffic.", "ref": "Aeronautical Chart User's Guide"}, {"id": "AIR-104", "area": "AIR", "acs": "UA.II.B", "q": "Which source provides current TFRs and NOTAMs before a flight?", "choices": ["The FAA NOTAM system, tfr.faa.gov, or a B4UFLY/LAANC app", "The aircraft's flight manual", "The sectional chart only"], "answer": 0, "exp": "Sectionals do not show TFRs; check current NOTAMs.", "ref": "14 CFR 107.47; AIM 5-1-3"}, {"id": "AIR-105", "area": "AIR", "acs": "UA.II.A", "q": "How does a part-time Class D airport's airspace change when the tower closes?", "choices": ["It reverts to Class E or Class G, as listed in the Chart Supplement", "It stays Class D at all times", "It becomes Class C"], "answer": 0, "exp": "Check the Chart Supplement for the airspace in effect when the tower is closed.", "ref": "AIM 3-2-5"}, {"id": "AIR-106", "area": "AIR", "acs": "UA.II.A", "q": "National Security UAS Flight Restrictions over sites such as military bases are issued under:", "choices": ["Part 107 waivers", "Remote ID rules", "14 CFR 99.7 Special Security Instructions"], "answer": 2, "exp": "These restrictions are issued under 99.7 and shown on FAA UAS maps.", "ref": "14 CFR 99.7"}, {"id": "WX-107", "area": "WX", "acs": "UA.III.A", "q": "METAR: KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002. What is the wind?", "choices": ["From 270° true at 15 knots, gusting to 25 knots", "Toward 270° true at 15 knots", "From 270° magnetic at 25 knots, gusting to 15 knots"], "answer": 0, "exp": "METAR wind is the direction it blows from, in degrees true, then speed and gusts in knots.", "ref": "Aviation Weather Handbook FAA-H-8083-28"}, {"id": "WX-108", "area": "WX", "acs": "UA.III.A", "q": "METAR: KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002. What is the ceiling?", "choices": ["4,500 ft MSL", "4,500 ft AGL", "450 ft AGL"], "answer": 1, "exp": "The ceiling is the lowest broken or overcast layer (or vertical visibility). Cloud bases are in hundreds of feet AGL.", "ref": "FAA-H-8083-28"}, {"id": "WX-109", "area": "WX", "acs": "UA.III.A", "q": "METAR: KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002. The temperature and dewpoint are:", "choices": ["−8°C and 2°C", "8°F and 2°F", "8°C and −2°C"], "answer": 2, "exp": "M means minus; values are in degrees Celsius.", "ref": "FAA-H-8083-28"}, {"id": "WX-110", "area": "WX", "acs": "UA.III.A", "q": "A ceiling is defined as:", "choices": ["The highest cloud layer reported", "The lowest layer reported as broken or overcast, or a vertical visibility into an obscuration", "The lowest layer of any clouds"], "answer": 1, "exp": "FEW and SCT layers are not ceilings.", "ref": "FAA-H-8083-28"}, {"id": "WX-111", "area": "WX", "acs": "UA.III.A", "q": "A TAF normally covers a period of:", "choices": ["48 hours", "24 hours (some airports 30 hours)", "6 hours"], "answer": 1, "exp": "TAFs are issued four times daily and normally cover 24 or 30 hours.", "ref": "FAA-H-8083-28"}, {"id": "WX-112", "area": "WX", "acs": "UA.III.A", "q": "A SPECI is:", "choices": ["A special-use airspace notice", "A forecast for a specific airport", "An unscheduled METAR issued when conditions change significantly"], "answer": 2, "exp": "SPECI reports are issued between routine hourly METARs.", "ref": "FAA-H-8083-28"}, {"id": "WX-113", "area": "WX", "acs": "UA.III.A", "q": "An AIRMET Tango warns of:", "choices": ["IFR conditions and mountain obscuration", "Moderate turbulence, sustained surface winds of 30 knots or more, or low-level wind shear", "Icing and freezing levels"], "answer": 1, "exp": "Sierra = IFR/mountain obscuration; Tango = turbulence/winds; Zulu = icing.", "ref": "FAA-H-8083-28"}, {"id": "WX-114", "area": "WX", "acs": "UA.III.A", "q": "A Convective SIGMET is issued for:", "choices": ["Light turbulence", "Moderate icing only", "Thunderstorms and related hazards such as tornadoes and large hail"], "answer": 2, "exp": "Convective SIGMETs cover severe convective weather.", "ref": "FAA-H-8083-28"}, {"id": "WX-115", "area": "WX", "acs": "UA.III.B", "q": "When the temperature-dewpoint spread is small and decreasing, expect:", "choices": ["Fog or low clouds", "Clear skies and good visibility", "Stronger winds"], "answer": 0, "exp": "A close spread means air is near saturation.", "ref": "PHAK Ch. 12"}, {"id": "WX-116", "area": "WX", "acs": "UA.III.B", "q": "How does high density altitude affect a small UA?", "choices": ["Reduces propeller efficiency and climb performance", "Has no effect on propellers", "Increases lift and battery life"], "answer": 0, "exp": "Thinner air reduces thrust and lift.", "ref": "PHAK Ch. 11"}, {"id": "WX-117", "area": "WX", "acs": "UA.III.B", "q": "Which combination produces the highest density altitude?", "choices": ["High elevation, high temperature, high humidity", "Low elevation, low temperature, low humidity", "High elevation, low temperature, low humidity"], "answer": 0, "exp": "Hot, high, and humid all raise density altitude.", "ref": "PHAK Ch. 4"}, {"id": "WX-118", "area": "WX", "acs": "UA.III.B", "q": "Standard sea-level conditions are:", "choices": ["20°C and 29.92 inches of mercury", "15°C and 29.92 inches of mercury", "0°C and 30.00 inches of mercury"], "answer": 1, "exp": "The standard atmosphere: 15°C, 29.92 inHg.", "ref": "PHAK Ch. 4"}, {"id": "WX-119", "area": "WX", "acs": "UA.III.B", "q": "The standard temperature lapse rate is approximately:", "choices": ["5°C per 1,000 ft", "1°F per 1,000 ft", "2°C per 1,000 ft"], "answer": 2, "exp": "Standard lapse rate is about 2°C (3.5°F) per 1,000 ft.", "ref": "PHAK Ch. 4"}, {"id": "WX-120", "area": "WX", "acs": "UA.III.B", "q": "Characteristics of stable air include:", "choices": ["Cumuliform clouds and showers", "Turbulence and good visibility", "Stratiform clouds, smooth air, and poor visibility"], "answer": 2, "exp": "Stable air resists vertical movement.", "ref": "PHAK Ch. 12"}, {"id": "WX-121", "area": "WX", "acs": "UA.III.B", "q": "A moist, unstable air mass is characterized by:", "choices": ["Stratiform clouds and steady precipitation", "Cumuliform clouds, showery precipitation, turbulence, and good visibility", "Fog and smooth air"], "answer": 1, "exp": "Unstable air produces vertical development.", "ref": "PHAK Ch. 12"}, {"id": "WX-122", "area": "WX", "acs": "UA.III.B", "q": "What conditions are expected with a low-level temperature inversion?", "choices": ["Strong turbulence and thunderstorms", "Smooth air, poor visibility from fog or haze, and possible wind shear", "Excellent visibility"], "answer": 1, "exp": "Inversions trap pollutants and moisture near the surface.", "ref": "PHAK Ch. 12"}, {"id": "WX-123", "area": "WX", "acs": "UA.III.B", "q": "What three conditions are needed for a thunderstorm?", "choices": ["Fog, snow, and a cold front", "Sufficient moisture, unstable air, and a lifting force", "High pressure, cold air, and calm winds"], "answer": 1, "exp": "Moisture, instability, and lift.", "ref": "PHAK Ch. 12"}, {"id": "WX-124", "area": "WX", "acs": "UA.III.B", "q": "Which thunderstorm stage is dominated by downdrafts?", "choices": ["Dissipating", "Mature", "Cumulus"], "answer": 0, "exp": "Cumulus = updrafts; mature = both, precipitation begins at surface; dissipating = downdrafts.", "ref": "PHAK Ch. 12"}, {"id": "WX-125", "area": "WX", "acs": "UA.III.B", "q": "A microburst typically:", "choices": ["Occurs only in winter", "Covers 10 miles and lasts several hours", "Covers about 1 mile or less and can produce downdrafts up to 6,000 ft per minute"], "answer": 2, "exp": "Microbursts are small, intense, short-lived downdrafts.", "ref": "PHAK Ch. 12"}, {"id": "WX-126", "area": "WX", "acs": "UA.III.B", "q": "Weather typical of a fast-moving cold front includes:", "choices": ["Calm winds and fog", "Low stratus and steady drizzle for days", "Cumuliform clouds, gusty winds, and showers or thunderstorms"], "answer": 2, "exp": "Cold fronts lift warm air sharply.", "ref": "PHAK Ch. 12"}, {"id": "WX-127", "area": "WX", "acs": "UA.III.B", "q": "Frost on a small UA's propellers or wings should be:", "choices": ["Smoothed with a cloth and left in place", "Removed before flight because it disrupts airflow, reducing lift and increasing drag", "Ignored because it melts in flight"], "answer": 1, "exp": "Even thin frost degrades lift.", "ref": "PHAK Ch. 12"}, {"id": "WX-128", "area": "WX", "acs": "UA.III.B", "q": "Advection fog forms when:", "choices": ["Moist air is forced up a slope", "Warm, moist air moves over a cooler surface", "The ground cools on clear, calm nights"], "answer": 1, "exp": "Radiation fog forms on clear, calm nights; advection fog requires wind moving moist air over a cold surface.", "ref": "PHAK Ch. 12"}, {"id": "WX-129", "area": "WX", "acs": "UA.III.B", "q": "Flying near large buildings on a windy day, expect:", "choices": ["Smooth air on the downwind side", "Calmer winds above rooftops", "Mechanical turbulence and unpredictable gusts"], "answer": 2, "exp": "Obstructions break up airflow, creating eddies.", "ref": "PHAK Ch. 12"}, {"id": "WX-130", "area": "WX", "acs": "UA.III.B", "q": "A sea breeze typically blows:", "choices": ["From the water toward land during the day", "From land toward the water during the day", "Only at night"], "answer": 0, "exp": "Land heats faster in daytime, drawing cooler air in from the water.", "ref": "PHAK Ch. 12"}, {"id": "WX-131", "area": "WX", "acs": "UA.III.A", "q": "Which is an FAA-approved source of aviation weather for flight planning?", "choices": ["aviationweather.gov or Flight Service (1-800-WX-BRIEF)", "A general TV weather app", "Social media posts from other pilots"], "answer": 0, "exp": "Use official aviation weather sources.", "ref": "FAA-H-8083-28; AC 107-2A"}, {"id": "LP-132", "area": "LP", "acs": "UA.IV.A", "q": "In a level 60° banked turn, the load factor is:", "choices": ["1.5 G", "3 G", "2 G"], "answer": 2, "exp": "Load factor = 1 / cos(bank). At 60°, 1/0.5 = 2.", "ref": "PHAK Ch. 5"}, {"id": "LP-133", "area": "LP", "acs": "UA.IV.A", "q": "A 33-lb UA in a level 30° banked turn has a load factor of about 1.154. What load must its structure support?", "choices": ["About 34 lb", "About 38 lb", "About 47 lb"], "answer": 1, "exp": "33 × 1.154 ≈ 38 lb. Use the load factor chart in FAA-CT-8080-2H, Figure 2.", "ref": "FAA-CT-8080-2H Fig. 2; PHAK Ch. 5"}, {"id": "LP-134", "area": "LP", "acs": "UA.IV.A", "q": "What increases load factor on a small UA?", "choices": ["Steep turns", "Flying slower in level flight", "Descending in a straight line"], "answer": 0, "exp": "Load factor rises with bank angle in a level turn.", "ref": "PHAK Ch. 5"}, {"id": "LP-135", "area": "LP", "acs": "UA.IV.A", "q": "A stall occurs when:", "choices": ["Airspeed drops below 30 knots", "The battery voltage falls", "The critical angle of attack is exceeded"], "answer": 2, "exp": "Stalls are caused by exceeding the critical AOA, at any airspeed.", "ref": "PHAK Ch. 5"}, {"id": "LP-136", "area": "LP", "acs": "UA.IV.A", "q": "As load factor increases, stall speed:", "choices": ["Increases", "Decreases", "Stays the same"], "answer": 0, "exp": "Stall speed increases with the square root of load factor (about 41% higher at 2 G).", "ref": "PHAK Ch. 5"}, {"id": "LP-137", "area": "LP", "acs": "UA.IV.A", "q": "An aft center of gravity makes a fixed-wing UA:", "choices": ["More stable with heavier controls", "Unaffected", "Less stable and harder to recover from a stall"], "answer": 2, "exp": "Aft CG reduces stability.", "ref": "PHAK Ch. 10"}, {"id": "LP-138", "area": "LP", "acs": "UA.IV.A", "q": "A forward center of gravity typically results in:", "choices": ["Better stall recovery and lower stall speed", "More stability, heavier control forces, and a higher stall speed", "Less stability and lighter controls"], "answer": 1, "exp": "Forward CG adds stability at the cost of performance.", "ref": "PHAK Ch. 10"}, {"id": "LP-139", "area": "LP", "acs": "UA.IV.A", "q": "Where should a remote PIC find loading information to keep the CG within limits?", "choices": ["The manufacturer's instructions or operating documents", "The sectional chart", "The FAA's AC 107-2A"], "answer": 0, "exp": "Use manufacturer data for weight and balance.", "ref": "AC 107-2A"}, {"id": "LP-140", "area": "LP", "acs": "UA.IV.A", "q": "Adding a heavier payload to a multirotor generally:", "choices": ["Has no effect if within the maximum weight", "Increases flight time", "Reduces flight time, climb rate, and maneuverability"], "answer": 2, "exp": "More weight requires more thrust and energy.", "ref": "AC 107-2A; PHAK Ch. 10"}, {"id": "LP-141", "area": "LP", "acs": "UA.IV.A", "q": "Cold temperatures typically affect lithium batteries by:", "choices": ["Having no effect", "Reducing available capacity and voltage under load, shortening flight time", "Increasing flight time"], "answer": 1, "exp": "Warm batteries per the manufacturer and monitor voltage.", "ref": "Manufacturer guidance; AC 107-2A"}, {"id": "LP-142", "area": "LP", "acs": "UA.IV.A", "q": "Hot, high-elevation conditions affect a small UA's performance by:", "choices": ["Improving battery life", "Reducing thrust and lift, so climb and payload capacity decrease", "Increasing thrust"], "answer": 1, "exp": "High density altitude reduces performance.", "ref": "PHAK Ch. 11"}, {"id": "OPS-143", "area": "OPS", "acs": "UA.V.A", "q": "At a nontowered airport, which frequency should you monitor for traffic?", "choices": ["ATIS", "Ground control", "CTAF"], "answer": 2, "exp": "Pilots self-announce on the CTAF at nontowered airports.", "ref": "AIM 4-1-9"}, {"id": "OPS-144", "area": "OPS", "acs": "UA.V.A", "q": "UNICOM is:", "choices": ["The tower frequency", "A nongovernment air-to-ground radio station that may provide airport information", "An automated weather broadcast"], "answer": 1, "exp": "UNICOM is often used as the CTAF at nontowered airports.", "ref": "AIM 4-1-9"}, {"id": "OPS-145", "area": "OPS", "acs": "UA.V.A", "q": "Where there is no tower, FSS, or UNICOM, pilots self-announce on:", "choices": ["MULTICOM, 122.9 MHz", "121.5 MHz", "118.0 MHz"], "answer": 0, "exp": "MULTICOM 122.9 is used where no other CTAF exists.", "ref": "AIM 4-1-9"}, {"id": "OPS-146", "area": "OPS", "acs": "UA.V.A", "q": "How should an altitude of 4,500 ft be spoken on the radio?", "choices": ["Four five zero zero", "Forty-five hundred", "Four thousand five hundred"], "answer": 2, "exp": "Altitudes are spoken in thousands and hundreds.", "ref": "AIM 4-2-9"}, {"id": "OPS-147", "area": "OPS", "acs": "UA.V.A", "q": "Runway 27 is spoken as:", "choices": ["Runway two seven", "Runway twenty-seven", "Runway two seven zero"], "answer": 0, "exp": "Runway numbers are spoken as separate digits.", "ref": "AIM 4-2-9"}, {"id": "OPS-148", "area": "OPS", "acs": "UA.V.A", "q": "In the phonetic alphabet, the letter D is:", "choices": ["Dog", "David", "Delta"], "answer": 2, "exp": "ICAO phonetic alphabet: Alfa, Bravo, Charlie, Delta...", "ref": "AIM 4-2-7"}, {"id": "OPS-149", "area": "OPS", "acs": "UA.V.A", "q": "ATIS provides:", "choices": ["A continuous broadcast of noncontrol information such as weather and active runways", "Drone authorizations", "ATC clearances"], "answer": 0, "exp": "ATIS reduces frequency congestion.", "ref": "AIM 4-1-13"}, {"id": "OPS-150", "area": "OPS", "acs": "UA.V.B", "q": "A pilot reports 'midfield left downwind, Runway 13.' Where is the aircraft relative to the runway?", "choices": ["Southwest of the runway, flying southeast", "Northeast of the runway, flying northwest", "Northeast of the runway, flying southeast"], "answer": 1, "exp": "Downwind for 13 is flown on about 310°. Left traffic puts the runway on the pilot's left (southwest), so the aircraft is northeast.", "ref": "AIM 4-3-3"}, {"id": "OPS-151", "area": "OPS", "acs": "UA.V.B", "q": "Unless otherwise indicated, traffic pattern turns are made:", "choices": ["In either direction", "To the right", "To the left"], "answer": 2, "exp": "Standard traffic patterns use left turns; right traffic is noted (e.g., RP on charts).", "ref": "AIM 4-3-3"}, {"id": "OPS-152", "area": "OPS", "acs": "UA.V.B", "q": "Runway 9 is aligned with approximately:", "choices": ["009° true", "090° true", "090° magnetic"], "answer": 2, "exp": "Runway numbers are the magnetic heading divided by 10.", "ref": "AIM 2-3-3"}, {"id": "OPS-153", "area": "OPS", "acs": "UA.V.B", "q": "What is the most comprehensive source of information about a specific airport?", "choices": ["The sectional chart", "The Chart Supplement", "The METAR"], "answer": 1, "exp": "The Chart Supplement lists hours, frequencies, runways, and remarks.", "ref": "Chart Supplement U.S.; PHAK Ch. 14"}, {"id": "OPS-154", "area": "OPS", "acs": "UA.V.B", "q": "Wind direction in a METAR is referenced to:", "choices": ["The active runway", "Magnetic north", "True north"], "answer": 2, "exp": "Written reports use true; ATIS and tower winds use magnetic.", "ref": "FAA-H-8083-28"}, {"id": "OPS-155", "area": "OPS", "acs": "UA.V.B", "q": "A wind sock shows wind direction because:", "choices": ["The small end points into the wind", "Wind enters the large end, so the large end points toward where the wind is coming from", "It always points north"], "answer": 1, "exp": "The sock streams downwind.", "ref": "AIM 4-3-4"}, {"id": "OPS-156", "area": "OPS", "acs": "UA.V.B", "q": "A large X on a runway indicates:", "choices": ["A displaced threshold", "The runway is for drones only", "The runway is closed"], "answer": 2, "exp": "X markings show closed runways or taxiways.", "ref": "AIM Ch. 2, Sec. 3"}, {"id": "OPS-157", "area": "OPS", "acs": "UA.V.B", "q": "The typical traffic pattern altitude for light aircraft at a nontowered airport is about:", "choices": ["400 ft AGL", "1,000 ft AGL", "2,500 ft AGL"], "answer": 1, "exp": "AC 90-66 recommends 1,000 ft AGL for most aircraft.", "ref": "AC 90-66C"}, {"id": "OPS-158", "area": "OPS", "acs": "UA.V.C", "q": "Before flight, what should be in place for a lost control link?", "choices": ["A preprogrammed lost-link procedure, such as return-to-home at a safe altitude, briefed to the crew", "Nothing; the UA will land where it is", "A call to ATC"], "answer": 0, "exp": "Plan and brief lost-link behavior before launch.", "ref": "14 CFR 107.49; AC 107-2A"}, {"id": "OPS-159", "area": "OPS", "acs": "UA.V.C", "q": "Your UA flies away toward a towered airport's airspace. What should you do?", "choices": ["Report it to the manufacturer the next day", "Notify the ATC facility immediately with the UA's last known position and direction", "Wait until the battery dies"], "answer": 1, "exp": "Notify ATC so traffic can be protected.", "ref": "AC 107-2A"}, {"id": "OPS-160", "area": "OPS", "acs": "UA.V.C", "q": "A lithium battery is swollen after a flight. What should you do?", "choices": ["Use it only for short flights", "Charge it fully to reshape the cells", "Remove it from service and dispose of it per the manufacturer and local rules"], "answer": 2, "exp": "Swelling indicates cell damage and fire risk.", "ref": "Manufacturer guidance; AC 107-2A"}, {"id": "OPS-161", "area": "OPS", "acs": "UA.V.C", "q": "Who must brief participants on emergency procedures before a Part 107 operation?", "choices": ["The client", "The remote PIC", "The visual observer"], "answer": 1, "exp": "107.49 makes the remote PIC responsible for ensuring participants know emergency procedures.", "ref": "14 CFR 107.49"}, {"id": "OPS-162", "area": "OPS", "acs": "UA.V.C", "q": "A manned helicopter approaches low over your work area. What is the correct action?", "choices": ["Yield the right of way, descending or moving the UA clear of its path", "Hold position; the helicopter must avoid you", "Climb to get above it"], "answer": 0, "exp": "Small UA must yield to all manned aircraft.", "ref": "14 CFR 107.37"}, {"id": "OPS-163", "area": "OPS", "acs": "UA.V.D", "q": "Taking a risky shot to impress onlookers reflects which hazardous attitude?", "choices": ["Anti-authority", "Macho", "Resignation"], "answer": 1, "exp": "Macho: 'I can do it.' Antidote: 'Taking chances is foolish.'", "ref": "PHAK Ch. 2"}, {"id": "OPS-164", "area": "OPS", "acs": "UA.V.D", "q": "The antidote for the anti-authority attitude is:", "choices": ["Not so fast. Think first.", "It could happen to me.", "Follow the rules. They are usually right."], "answer": 2, "exp": "Anti-authority: 'Don't tell me.'", "ref": "PHAK Ch. 2"}, {"id": "OPS-165", "area": "OPS", "acs": "UA.V.D", "q": "A pilot rushes a launch without a preflight because 'we can check it later.' This is:", "choices": ["Invulnerability", "Resignation", "Impulsivity"], "answer": 2, "exp": "Impulsivity: 'Do it quickly.' Antidote: 'Not so fast. Think first.'", "ref": "PHAK Ch. 2"}, {"id": "OPS-166", "area": "OPS", "acs": "UA.V.D", "q": "'Accidents happen to other people, not me' reflects:", "choices": ["Anti-authority", "Macho", "Invulnerability"], "answer": 2, "exp": "Antidote: 'It could happen to me.'", "ref": "PHAK Ch. 2"}, {"id": "OPS-167", "area": "OPS", "acs": "UA.V.D", "q": "'What's the use? Nothing I do will matter' reflects:", "choices": ["Impulsivity", "Resignation", "Invulnerability"], "answer": 1, "exp": "Antidote: 'I'm not helpless. I can make a difference.'", "ref": "PHAK Ch. 2"}, {"id": "OPS-168", "area": "OPS", "acs": "UA.V.D", "q": "The PAVE checklist stands for:", "choices": ["Plan, Assess, Verify, Execute", "Pilot, Aircraft, enVironment, External pressures", "Preflight, Airspace, Visibility, Emergency"], "answer": 1, "exp": "PAVE helps identify risk during planning.", "ref": "PHAK Ch. 2"}, {"id": "OPS-169", "area": "OPS", "acs": "UA.V.E", "q": "The IMSAFE checklist evaluates:", "choices": ["The aircraft's airworthiness", "The pilot's personal fitness: Illness, Medication, Stress, Alcohol, Fatigue, Emotion", "Weather minimums"], "answer": 1, "exp": "IMSAFE is a personal self-assessment.", "ref": "PHAK Ch. 2"}, {"id": "OPS-170", "area": "OPS", "acs": "UA.V.D", "q": "The DECIDE model steps are:", "choices": ["Decide, Execute, Confirm, Inform, Deliver, End", "Detect, Evaluate, Communicate, Inspect, Document, Exit", "Detect, Estimate, Choose, Identify, Do, Evaluate"], "answer": 2, "exp": "DECIDE is a decision-making framework.", "ref": "PHAK Ch. 2"}, {"id": "OPS-171", "area": "OPS", "acs": "UA.V.D", "q": "When should Crew Resource Management be practiced?", "choices": ["Only during emergencies", "Only with crews larger than three", "In all phases of the operation, from planning through post-flight"], "answer": 2, "exp": "CRM uses all available resources throughout the operation.", "ref": "PHAK Ch. 2; AC 107-2A"}, {"id": "OPS-172", "area": "OPS", "acs": "UA.V.D", "q": "Which best improves an organization's safety culture?", "choices": ["Standard procedures, training, and encouraging every crewmember to speak up about hazards", "Rewarding the fastest mission completion", "Letting the most experienced pilot skip checklists"], "answer": 0, "exp": "Safety culture depends on procedures and open reporting.", "ref": "AC 107-2A"}, {"id": "OPS-173", "area": "OPS", "acs": "UA.V.D", "q": "What breaks the error chain before an accident?", "choices": ["Good aeronautical decision-making and risk management", "Flying faster to finish sooner", "Relying on automation"], "answer": 0, "exp": "ADM breaks the chain of events leading to accidents.", "ref": "PHAK Ch. 2"}, {"id": "OPS-174", "area": "OPS", "acs": "UA.V.D", "q": "Risk is assessed by considering:", "choices": ["Only the pilot's experience", "The likelihood of an event and the severity of its outcome", "Only the weather"], "answer": 1, "exp": "Risk matrices combine likelihood and severity.", "ref": "PHAK Ch. 2"}, {"id": "OPS-175", "area": "OPS", "acs": "UA.V.D", "q": "Situational awareness means:", "choices": ["Knowing the battery percentage", "Watching the video feed closely", "Accurately perceiving and understanding everything that affects the operation, now and in the near future"], "answer": 2, "exp": "SA includes the aircraft, environment, crew, and airspace.", "ref": "PHAK Ch. 2"}, {"id": "OPS-176", "area": "OPS", "acs": "UA.V.D", "q": "Relying on autopilot or return-to-home so much that you stop monitoring the aircraft is called:", "choices": ["Automation complacency", "Spatial disorientation", "Task saturation"], "answer": 0, "exp": "Stay engaged when using automation.", "ref": "PHAK Ch. 2"}, {"id": "OPS-177", "area": "OPS", "acs": "UA.V.E", "q": "Which is a sign of fatigue?", "choices": ["Improved concentration", "Slowed reactions and poor judgment", "Lower heart rate with better vision"], "answer": 1, "exp": "Fatigue degrades performance and decision-making.", "ref": "PHAK Ch. 17"}, {"id": "OPS-178", "area": "OPS", "acs": "UA.V.E", "q": "Headache, fatigue, and cramps on a hot day are signs of:", "choices": ["Dehydration", "Carbon monoxide poisoning", "Hypoxia"], "answer": 0, "exp": "Drink water and take breaks in shade.", "ref": "PHAK Ch. 17"}, {"id": "OPS-179", "area": "OPS", "acs": "UA.V.E", "q": "A stressed crew member breathes rapidly and feels dizzy and tingly. This is likely:", "choices": ["Hyperventilation; slow the breathing rate or talk aloud", "Dehydration; drink water", "Fatigue; take a nap"], "answer": 0, "exp": "Hyperventilation is caused by excessive breathing under stress.", "ref": "PHAK Ch. 17"}, {"id": "OPS-180", "area": "OPS", "acs": "UA.V.E", "q": "Even small amounts of alcohol:", "choices": ["Improve reaction time", "Impair judgment and decision-making", "Have no effect after 1 hour"], "answer": 1, "exp": "Alcohol impairs judgment at low levels.", "ref": "PHAK Ch. 17"}, {"id": "OPS-181", "area": "OPS", "acs": "UA.V.E", "q": "Before flying after taking an over-the-counter antihistamine, the remote PIC should:", "choices": ["Consider whether drowsiness or other side effects would impair safe operation, and not fly if impaired", "Get a medical certificate", "Fly normally; OTC drugs are always safe"], "answer": 0, "exp": "107.17 prohibits flying with a condition that would interfere with safe operation.", "ref": "14 CFR 107.17; PHAK Ch. 17"}, {"id": "OPS-182", "area": "OPS", "acs": "UA.V.E", "q": "The most effective way to scan for other aircraft is:", "choices": ["Staring at the center of the sky", "Short, regularly spaced eye movements, each covering about 10° and held about 1 second", "One continuous sweep across the sky"], "answer": 1, "exp": "The eye needs time to focus on each sector.", "ref": "PHAK Ch. 14; AIM 8-1-6"}, {"id": "OPS-183", "area": "OPS", "acs": "UA.V.E", "q": "After exposure to bright light at night, full dark adaptation can take about:", "choices": ["5 minutes", "30 minutes", "2 hours"], "answer": 1, "exp": "Protect night vision; use dim red light.", "ref": "PHAK Ch. 17"}, {"id": "OPS-184", "area": "OPS", "acs": "UA.V.E", "q": "At night, an object is easier to see if you:", "choices": ["Close one eye", "Look slightly to one side of it (off-center viewing)", "Stare directly at it"], "answer": 1, "exp": "Rods outside the center of the eye see better in low light.", "ref": "PHAK Ch. 17"}, {"id": "OPS-185", "area": "OPS", "acs": "UA.V.F", "q": "If the manufacturer provides no maintenance schedule, the remote PIC should:", "choices": ["Never perform maintenance", "Establish a scheduled maintenance protocol based on experience and best practices", "Send the UA to the FAA each year"], "answer": 1, "exp": "AC 107-2A recommends a maintenance program when the manufacturer provides none.", "ref": "AC 107-2A Ch. 5"}, {"id": "OPS-186", "area": "OPS", "acs": "UA.V.F", "q": "Who must inspect the small UAS to ensure it is in a condition for safe operation?", "choices": ["The manufacturer", "The remote PIC", "An FAA inspector"], "answer": 1, "exp": "107.15 places this on the remote PIC.", "ref": "14 CFR 107.15"}, {"id": "OPS-187", "area": "OPS", "acs": "UA.V.F", "q": "Keeping maintenance and inspection records helps the remote PIC:", "choices": ["Track component life, identify trends, and show the UA is in a condition for safe operation", "Skip preflight inspections", "Avoid registration"], "answer": 0, "exp": "Records are recommended best practice.", "ref": "AC 107-2A"}, {"id": "OPS-188", "area": "OPS", "acs": "UA.V.F", "q": "During preflight you find a chipped propeller. What should you do?", "choices": ["Replace it before flight", "Fly gently to finish the job", "Tape the chip"], "answer": 0, "exp": "Damaged props can fail or cause vibration.", "ref": "AC 107-2A"}], "sets": {"mockA": ["REG-045", "OPS-176", "LP-140", "OPS-175", "REG-060", "AIR-105", "OPS-146", "REG-042", "REG-037", "REG-052", "REG-007", "REG-044", "AIR-075", "OPS-151", "REG-047", "REG-002", "WX-118", "AIR-096", "AIR-089", "OPS-152", "REG-056", "AIR-084", "OPS-158", "REG-049", "REG-063", "REG-033", "REG-001", "REG-053", "AIR-072", "REG-061", "REG-015", "OPS-164", "AIR-100", "REG-041", "REG-027", "AIR-076", "REG-004", "REG-068", "WX-129", "AIR-086", "REG-020", "REG-022", "AIR-077", "REG-031", "OPS-156", "OPS-167", "AIR-074", "OPS-186", "OPS-160", "AIR-097", "OPS-161", "REG-023", "REG-034", "OPS-149", "REG-025", "REG-029", "OPS-166", "OPS-177", "REG-026", "WX-113"], "mockB": ["REG-021", "REG-028", "OPS-174", "AIR-103", "WX-123", "REG-054", "REG-050", "AIR-099", "OPS-150", "AIR-088", "AIR-080", "REG-012", "REG-064", "AIR-094", "OPS-145", "REG-024", "REG-030", "REG-057", "OPS-148", "REG-070", "AIR-090", "REG-038", "REG-059", "REG-066", "REG-065", "OPS-169", "REG-005", "REG-067", "REG-035", "AIR-101", "OPS-178", "REG-013", "REG-051", "OPS-168", "REG-006", "OPS-173", "AIR-091", "OPS-171", "OPS-180", "AIR-082", "AIR-085", "REG-043", "WX-121", "OPS-147", "WX-110", "OPS-179", "REG-011", "REG-058", "OPS-183", "REG-036", "AIR-093", "REG-014", "OPS-157", "REG-010", "REG-009", "OPS-188", "REG-048", "AIR-098", "LP-141", "REG-008"], "diagnostic": ["OPS-144", "AIR-071", "REG-039", "OPS-182", "AIR-083", "OPS-187", "WX-115", "LP-135", "REG-046", "AIR-104", "REG-019", "LP-136", "WX-117", "REG-003", "WX-120"], "checkpoint1": ["AIR-079", "REG-040", "AIR-081", "AIR-102", "AIR-106", "REG-062", "REG-018", "AIR-078", "AIR-092", "AIR-087", "REG-032", "REG-069", "REG-017", "REG-016", "REG-055"], "minimock": ["REG-057", "OPS-171", "WX-107", "OPS-186", "OPS-163", "REG-014", "AIR-077", "REG-038", "OPS-157", "REG-005", "LP-141", "WX-123", "REG-009", "REG-052", "OPS-169", "AIR-103", "REG-047", "AIR-101", "AIR-093", "REG-045"]}, "setInfo": {"diagnostic": ["Pre-Work Diagnostic", 15, "Not graded — tells the instructor where to focus."], "checkpoint1": ["Session 1 Checkpoint", 15, "Regulations and airspace. Target 80%."], "minimock": ["Session 2 Mini-Mock", 20, "Timed 25 minutes. Target 80%."], "mockA": ["Full Practice Exam A", 60, "2 hours, 2026 reported question mix. Target 85%."], "mockB": ["Full Practice Exam B", 60, "2 hours, different questions. Target 85%."]}, "mixes": {"m2026": {"name": "2026 reported mix", "w": {"REG": 29, "AIR": 12, "OPS": 15, "WX": 3, "LP": 1}}, "acs": {"name": "ACS-10B blueprint", "w": {"REG": 12, "AIR": 12, "WX": 8, "LP": 5, "OPS": 23}}}, "modules": [{"id": "M1", "num": 1, "title": "Regulations I — General, Certification & Reporting", "area": "REG", "acs": "UA.I.A, I.C, I.F", "session": 1, "minutes": 60, "objectives": ["Explain when Part 107 applies and when it does not", "State remote pilot certificate eligibility, applica
