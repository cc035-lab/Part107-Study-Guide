s":"UA.II.A.K1d","q":"(Refer to Figure 1, area 5.) Cedar County is surrounded by a dashed magenta circle. To fly at 200 ft AGL within it you must:","choices":["obtain ATC authorization","only monitor the CTAF","file a flight plan"],"answer":0,"exp":"Dashed magenta = Class E surface area designated for an airport. 107.41 requires authorization.","ref":"14 CFR 107.41","fig":"F_SECT"},{"id":"CH-013","area":"OPS","acs":"UA.V.B.K6a","q":"(Refer to Figure 1, area 5.) What is the length of Cedar County's longest runway?","choices":["5,000 ft","1,180 ft","500 ft"],"answer":0,"exp":"The third item on the elevation line (50) is the longest runway in hundreds of feet.","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-014","area":"AIR","acs":"UA.II.A.K1","q":"(Refer to Figure 1, area 5.) You fly 350 ft AGL near Cedar County (field elevation 1,180 ft). What is your MSL altitude?","choices":["830 ft MSL","1,530 ft MSL","1,180 ft MSL"],"answer":1,"exp":"MSL = AGL + elevation: 350 + 1,180 = 1,530 ft MSL.","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-015","area":"AIR","acs":"UA.II.B.K7","q":"(Refer to Figure 1, point A.) How tall is the obstacle above the ground?","choices":["1,549 ft","1,137 ft","412 ft"],"answer":1,"exp":"The number in parentheses is the height AGL; the bold number (1549) is the top in MSL.","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-016","area":"AIR","acs":"UA.II.B.K7","q":"(Refer to Figure 1, point B.) What does the taller symbol with rays tell you?","choices":["The obstacle is 1,000 ft AGL or higher and lighted","The obstacle is under construction","It is a group of obstacles"],"answer":0,"exp":"Taller symbol = 1,000 ft AGL or more; rays = lighted. 2049 (1299).","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-017","area":"REG","acs":"UA.I.B.K21b","q":"(Refer to Figure 1, point B.) You inspect this tower, staying within 400 ft of it. What is the highest altitude Part 107 permits (ignoring airspace)?","choices":["400 ft AGL","1,699 ft AGL","2,449 ft MSL"],"answer":1,"exp":"Up to 400 ft above the structure's top: 1,299 + 400 = 1,699 ft AGL (2,449 MSL). Check the airspace at that altitude.","ref":"14 CFR 107.51(b)","fig":"F_SECT"},{"id":"CH-018","area":"AIR","acs":"UA.II.B.K7","q":"(Refer to Figure 1, point C.) The symbol at point C is a:","choices":["group obstacle, top 1,362 ft MSL","single obstacle 380 ft MSL","lighted obstacle more than 1,000 ft AGL"],"answer":0,"exp":"Two inverted Vs = group obstacle; bold 1362 = top MSL, (380) = AGL.","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-019","area":"AIR","acs":"UA.II.A.K1","q":"(Refer to Figure 1.) What is the Maximum Elevation Figure for the quadrangle containing R-5802?","choices":["2,500 ft MSL","250 ft AGL","25,000 ft MSL"],"answer":0,"exp":"Large digit = thousands, small digit = hundreds: 2⁵ = 2,500 ft MSL.","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-020","area":"AIR","acs":"UA.II.A.K2","q":"(Refer to Figure 1, area 6.) What must you do before flying in the Blue Ridge MOA?","choices":["Nothing is required, but check whether it is active and use extreme caution","Get permission from the controlling agency","Obtain a waiver"],"answer":0,"exp":"MOAs don't require permission for sUAS, but military aircraft may be flying low and fast.","ref":"AIM 3-4-5","fig":"F_SECT"},{"id":"CH-021","area":"AIR","acs":"UA.II.A.K2","q":"(Refer to Figure 1, area 7.) R-5802 is a:","choices":["restricted area — permission from the controlling agency is required when it is active","restricted area — authorization through LAANC is required","warning area — flight over it is prohibited"],"answer":0,"exp":"Blue hatched border with R- = restricted area (107.45).","ref":"14 CFR 107.45","fig":"F_SECT"},{"id":"CH-022","area":"AIR","acs":"UA.II.A.K3","q":"(Refer to Figure 1, area 8.) The gray line labeled VR1709 is a military training route flown:","choices":["at or below 1,500 ft AGL","above 1,500 ft AGL","only under instrument flight rules"],"answer":0,"exp":"VR = visual route. Four digits = no segment above 1,500 ft AGL.","ref":"AIM 3-5-2","fig":"F_SECT"},{"id":"CH-023","area":"AIR","acs":"UA.II.A.K3","q":"(Refer to Figure 1.) How are TFRs depicted on sectional charts?","choices":["They are not — check NOTAMs before every flight","Red dashed circles","Blue hatched borders"],"answer":0,"exp":"TFRs are issued by FDC NOTAM and don't appear on the chart.","ref":"14 CFR 107.47","fig":"F_SECT"},{"id":"CH-024","area":"AIR","acs":"UA.II.A.K1","q":"(Refer to Figure 1.) The horizontal line labeled 40°30′N measures:","choices":["degrees of latitude north of the equator","degrees of longitude west of the prime meridian","magnetic variation"],"answer":0,"exp":"Latitude lines run east–west and measure north/south of the equator.","ref":"PHAK Ch. 16","fig":"F_SECT"},{"id":"CH-025","area":"AIR","acs":"UA.II.A.K1","q":"(Refer to Figure 1.) A point 12 minute-ticks north of the 40°30′N line on the 76°00′W meridian is at:","choices":["40°42′N, 76°00′W","40°18′N, 76°00′W","40°30′N, 76°12′W"],"answer":0,"exp":"Each tick = 1 minute; latitude increases northward: 30′ + 12′ = 42′.","ref":"PHAK Ch. 16","fig":"F_SECT"},{"id":"CH-026","area":"OPS","acs":"UA.V.B.K7","q":"(Refer to Figure 1.) You plan a flight over the national wildlife refuge. What should you consider?","choices":["Manned pilots are asked to stay above 2,000 ft AGL; avoid disturbing wildlife and check the refuge's own rules","Flight is prohibited below 2,000 ft AGL for all aircraft","Refuges are Class D airspace"],"answer":0,"exp":"Charted refuges carry a request (not a rule) for manned aircraft to stay above 2,000 ft AGL; land-manager rules may restrict drone launches.","ref":"Chart User's Guide","fig":"F_SECT"},{"id":"CH-027","area":"OPS","acs":"UA.V.B.K6a","q":"(Refer to Figure 3.) What is the field elevation at Millbrook?","choices":["790 ft MSL","5,500 ft MSL","122 ft MSL"],"answer":0,"exp":"The first number on the elevation line is field elevation in feet MSL.","ref":"Chart User's Guide","fig":"F_DATABLOCK"},{"id":"CH-028","area":"OPS","acs":"UA.V.B.K4","q":"(Refer to Figure 3.) 'RP 27' means aircraft using Runway 27 fly:","choices":["a right-hand traffic pattern","a 2,700-ft pattern altitude","only during daylight"],"answer":0,"exp":"RP = right pattern for the listed runway(s). The standard pattern is left.","ref":"Chart User's Guide","fig":"F_DATABLOCK"},{"id":"CH-029","area":"LP","acs":"UA.IV.A.K1","q":"(Refer to Figure 5.) A small UA weighs 33 lb. What load must its structure support in a level 30° banked turn?","choices":["33 lb","38 lb","47 lb"],"answer":1,"exp":"Load factor at 30° ≈ 1.154; 33 × 1.154 ≈ 38 lb.","ref":"FAA-G-8082-22","fig":"F_LOAD"},{"id":"CH-030","area":"LP","acs":"UA.IV.A.K1","q":"(Refer to Figure 5.) At what bank angle does the load factor reach 2 G?","choices":["45°","60°","70°"],"answer":1,"exp":"1 ÷ cos 60° = 2.0.","ref":"PHAK Ch. 5","fig":"F_LOAD"},{"id":"CH-031","area":"LP","acs":"UA.IV.A.K1","q":"(Refer to Figure 5.) As bank angle increases in a level turn, a fixed-wing sUA's stall speed:","choices":["increases","decreases","stays the same"],"answer":0,"exp":"Stall speed rises with the square root of the load factor.","ref":"PHAK Ch. 5","fig":"F_LOAD"},{"id":"CH-032","area":"LP","acs":"UA.IV.A.K1b","q":"(Refer to Figure 6.) Moving a payload aft of the center of gravity will most likely:","choices":["reduce stability and make the aircraft harder to control","increase stability","have no effect if total weight is unchanged"],"answer":0,"exp":"An aft CG reduces stability; any CG shift changes handling.","ref":"FAA-G-8082-22","fig":"F_CG"},{"id":"CH-033","area":"OPS","acs":"UA.V.B.K4","q":"(Refer to Figure 7.) Manned aircraft normally join the traffic pattern by entering:","choices":["at a 45° angle to the downwind leg","straight in on the base leg","directly over the runway at pattern altitude"],"answer":0,"exp":"The recommended entry is 45° to the downwind leg, at pattern altitude.","ref":"AIM 4-3-3","fig":"F_PATTERN"},{"id":"CH-034","area":"OPS","acs":"UA.V.B.K4","q":"(Refer to Figure 7.) An aircraft on the downwind leg for Runway 27 is flying:","choices":["east, parallel to the runway","west, parallel to the runway","north, perpendicular to the runway"],"answer":0,"exp":"Downwind is flown opposite the landing direction (landing west on 27 → downwind heading east).","ref":"AIM 4-3-2","fig":"F_PATTERN"},{"id":"CH-035","area":"OPS","acs":"UA.V.B.K3","q":"(Refer to Figure 8.) The area marked with arrows before the threshold bars may be used for:","choices":["taxiing and takeoff, but not landing","landing only","nothing — it is closed"],"answer":0,"exp":"That is a displaced threshold.","ref":"AIM 2-3-3","fig":"F_RUNWAY"},{"id":"CH-036","area":"OPS","acs":"UA.V.B.K8","q":"(Refer to Figure 9.) At night you see a rotating beacon flashing white and yellow. It marks a:","choices":["lighted water airport (seaplane base)","military airport","heliport"],"answer":0,"exp":"White-yellow = water airport. White-green = civil land; dual white + green = military.","ref":"AIM 2-1-9","fig":"F_LIGHTS"},{"id":"CH-037","area":"OPS","acs":"UA.II.B.K9","q":"(Refer to Figure 9.) At night you see an aircraft's red light on your left and green light on your right. The aircraft is:","choices":["coming toward you","flying away from you","crossing from left to right"],"answer":0,"exp":"Red is the left wingtip, green the right. Seeing them in that arrangement means it faces you.","ref":"PHAK Ch. 17","fig":"F_LIGHTS"},{"id":"CH-038","area":"WX","acs":"UA.III.B.K1e","q":"(Refer to Figure 11.) Which stage of a thunderstorm begins when precipitation reaches the surface?","choices":["Cumulus","Mature","Dissipating"],"answer":1,"exp":"The mature stage starts with rain at the surface and has both up- and downdrafts.","ref":"AC 00-6B","fig":"F_TSTORM"},{"id":"CH-039","area":"WX","acs":"UA.III.B.K1d","q":"(Refer to Figure 10.) A line with blue triangles pointing in the direction of movement is a:","choices":["cold front","warm front","stationary front"],"answer":0,"exp":"Blue triangles = cold front. Red semicircles = warm front.","ref":"AC 00-45H","fig":"F_FRONTS"},{"id":"CH-040","area":"REG","acs":"UA.I.F.K6","q":"(Refer to Figure 12.) Which location does a Remote ID broadcast module transmit in place of the control station location?","choices":["The takeoff location","The pilot's home address","The nearest airport"],"answer":0,"exp":"Broadcast modules transmit the takeoff location; standard RID drones transmit the control station location.","ref":"14 CFR 89.315","fig":"F_RID"},{"id":"CH-041","area":"WX","acs":"UA.III.A.K2","q":"METAR KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002. What is the ceiling?","choices":["4,500 ft MSL","4,500 ft AGL","There is no ceiling"],"answer":1,"exp":"Ceiling = lowest broken/overcast layer; METAR cloud heights are AGL.","ref":"AC 00-45H"},{"id":"CH-042","area":"WX","acs":"UA.III.A.K2","q":"METAR KMDT 031853Z VRB04KT 3/4SM BR OVC004 12/11 A2981. Can a remote pilot legally fly here?","choices":["Yes, at or below 400 ft AGL","No — visibility is below 3 SM and the cloud clearance can't be met","Yes, if a visual observer is used"],"answer":1,"exp":"Visibility ¾ SM < 3 SM; with an overcast at 400 ft you cannot stay 500 ft below clouds.","ref":"14 CFR 107.51"},{"id":"CH-043","area":"WX","acs":"UA.III.A.K2","q":"In the METAR group 27015G25KT the wind direction is referenced to:","choices":["true north","magnetic north","the runway heading"],"answer":0,"exp":"METAR/TAF winds are true; tower and ATIS winds are magnetic.","ref":"AC 00-45H"},{"id":"CH-044","area":"WX","acs":"UA.III.A.K2","q":"In a METAR, the temperature/dewpoint group 15/13 suggests:","choices":["fog or low clouds are likely","thunderstorms are certain","icing is likely"],"answer":0,"exp":"A spread of 2 °C or less indicates likely fog/low clouds.","ref":"AC 00-6B"},{"id":"CH-045","area":"WX","acs":"UA.III.A.K3","q":"TAF KABE ... FM212300 30008KT P6SM SKC. 'FM212300' means:","choices":["from 2300Z on the 21st, these conditions replace the forecast","temporary conditions between 21Z and 23Z","a 23% probability"],"answer":0,"exp":"FM = from: a rapid, lasting change.","ref":"AC 00-45H"},{"id":"CH-046","area":"WX","acs":"UA.III.A.K3","q":"A TAF covers the area within how many statute miles of the airport?","choices":["5","10","25"],"answer":0,"exp":"TAFs are for the area within 5 SM of the runway complex.","ref":"AC 00-45H"},{"id":"CH-047","area":"WX","acs":"UA.III.B.K1a","q":"Which conditions produce the highest density altitude (worst performance)?","choices":["High elevation, high temperature, high humidity","Low elevation, low temperature, low humidity","High elevation, low temperature, low humidity"],"answer":0,"exp":"High, hot and humid = thin air = poor performance.","ref":"PHAK Ch. 11"}],"sets":{"mockA":["REG-045","OPS-176","LP-140","OPS-175","REG-060","AIR-105","OPS-146","REG-042","REG-037","REG-052","REG-007","REG-044","AIR-075","OPS-151","REG-047","REG-002","WX-118","AIR-096","AIR-089","OPS-152","REG-056","AIR-084","OPS-158","REG-049","REG-063","REG-033","REG-001","REG-053","AIR-072","REG-061","REG-015","OPS-164","AIR-100","REG-041","REG-027","AIR-076","REG-004","REG-068","WX-129","AIR-086","REG-020","REG-022","AIR-077","REG-031","OPS-156","OPS-167","AIR-074","OPS-186","OPS-160","AIR-097","OPS-161","REG-023","REG-034","OPS-149","REG-025","REG-029","OPS-166","OPS-177","REG-026","WX-113"],"mockB":["REG-021","REG-028","OPS-174","AIR-103","WX-123","REG-054","REG-050","AIR-099","OPS-150","AIR-088","AIR-080","REG-012","REG-064","AIR-094","OPS-145","REG-024","REG-030","REG-057","OPS-148","REG-070","AIR-090","REG-038","REG-059","REG-066","REG-065","OPS-169","REG-005","REG-067","REG-035","AIR-101","OPS-178","REG-013","REG-051","OPS-168","REG-006","OPS-173","AIR-091","OPS-171","OPS-180","AIR-082","AIR-085","REG-043","WX-121","OPS-147","WX-110","OPS-179","REG-011","REG-058","OPS-183","REG-036","AIR-093","REG-014","OPS-157","REG-010","REG-009","OPS-188","REG-048","AIR-098","LP-141","REG-008"],"diagnostic":["OPS-144","AIR-071","REG-039","OPS-182","AIR-083","OPS-187","WX-115","LP-135","REG-046","AIR-104","REG-019","LP-136","WX-117","REG-003","WX-120"],"checkpoint1":["AIR-079","REG-040","AIR-081","AIR-102","AIR-106","REG-062","REG-018","AIR-078","AIR-092","AIR-087","REG-032","REG-069","REG-017","REG-016","REG-055"],"minimock":["REG-057","OPS-171","WX-107","OPS-186","OPS-163","REG-014","AIR-077","REG-038","OPS-157","REG-005","LP-141","WX-123","REG-009","REG-052","OPS-169","AIR-103","REG-047","AIR-101","AIR-093","REG-045"],"chartbook":["CH-001","CH-002","CH-003","CH-004","CH-005","CH-006","CH-007","CH-008","CH-009","CH-010","CH-011","CH-012","CH-013","CH-014","CH-015","CH-016","CH-017","CH-018","CH-019","CH-020","CH-021","CH-022","CH-023","CH-024","CH-025","CH-026","CH-027","CH-028","CH-029","CH-030","CH-031","CH-032","CH-033","CH-034","CH-035","CH-036","CH-037","CH-038","CH-039","CH-040","CH-041","CH-042","CH-043","CH-044","CH-045","CH-046","CH-047"]},"setInfo":{"diagnostic":["Pre-Work Diagnostic",15,"Not graded — tells the instructor where to focus."],"checkpoint1":["Session 1 Checkpoint",15,"Regulations and airspace. Target 80%."],"minimock":["Session 2 Mini-Mock",20,"Timed 25 minutes. Target 80%."],"mockA":["Full Practice Exam A",60,"2 hours, 2026 reported question mix. Target 85%."],"mockB":["Full Practice Exam B",60,"2 hours, different questions. Target 85%."],"chartbook":["Chart & Figure Workbook",47,"Untimed, with instant feedback. Uses the sample sectional and figures from the study modules."]},"mixes":{"m2026":{"name":"2026 reported mix","w":{"REG":29,"AIR":12,"OPS":15,"WX":3,"LP":1}},"acs":{"name":"ACS-10B blueprint","w":{"REG":12,"AIR":12,"WX":8,"LP":5,"OPS":23}}},"modules":[{"id":"M1","num":1,"title":"Regulations I — General, Certification & Reporting","area":"REG","acs":"UA.I.A, I.C, I.F","session":1,"minutes":60,"objectives":["Explain when Part 107 applies and when it does not","State remote pilot certificate eligibility, application steps, and recency requirements","Apply accident-reporting, alcohol/drug, and medical-fitness rules","Describe registration, marking, and the three Remote ID compliance paths"],"sections":[["Who and what Part 107 covers",["Small UA = less than 55 lb at takeoff, including everything on board or attached (107.3).","Applies to civil, non-recreational operations. Does NOT apply to public aircraft operations, air carrier ops, moored balloons, kites, amateur rockets, or unmanned free balloons (107.1).","Recreational flyers use 49 U.S.C. 44809 and TRUST; a Part 107 holder flying for fun either follows Part 107 or meets the recreational rules.","Crew roles: Remote PIC (final authority, 107.19); person manipulating the controls (may be uncertificated only under direct supervision with immediate takeover ability); visual observer (optional)."]],["Getting and keeping the certificate",["Eligibility (107.61): age 16+; read, speak, write, understand English; no condition that interferes with safe operation; pass the UAG test (or ALC-451 for current Part 61 pilots).","Process: IACRA FTN → schedule at PSI ($175) → pass (70%, 42/60) → IACRA application (Form 8710-13) → TSA vetting → temporary then permanent certificate.","Failed test? Wait 14 calendar days to retest (107.71).","The certificate does not expire. Recency (107.65): initial test or recurrent training within the previous 24 calendar months; recurrent is free online (ALC-677).","Carry certificate + ID when flying; present to FAA, NTSB, TSA, or any federal/state/local law enforcement officer on request (107.7).","Address change: notify the FAA within 30 days or stop exercising privileges (107.77)."]],["Reporting, alcohol, drugs, fitness",["Accident report within 10 calendar days (107.9) for serious injury (AIS 3+), any loss of consciousness, or damage to property other than the UA exceeding $500 (repair cost or fair market value). Report via FAADroneZone or the FSDO.","Alcohol: 8 hours bottle-to-throttle; BAC below 0.04; not under the influence (107.27 → 91.17).","Drug conviction or refusing an alcohol test: denial up to 1 year or suspension/revocation (107.57, 107.59).","No medical certificate, but you may not fly with a known physical or mental condition that would interfere with safe operation (107.17)."]],["Registration and Remote ID",["Every drone flown under Part 107 must be registered regardless of weight (Part 48); $5 per aircraft, valid 3 years. Owner must be 13+.","Registration number goes on an external surface.","Remote ID (Part 89): standard Remote ID drone, broadcast module (VLOS only), or FRIA (VLOS, no RID equipment).","RID broadcasts UA ID, UA position/altitude/velocity, control station position, time, and emergency status — not the pilot's name.","Standard RID serial number goes on the registration. If RID stops broadcasting in flight: land as soon as practicable."]]],"traps":["Damage to the drone itself never counts toward the $500.","'Calendar months' run to the end of the month.","Recreational registration cannot be used for Part 107 flights."],"lessons":[{"t":"1.1 Where Part 107 applies","acs":["UA.I.A.K1","UA.I.A.K2"],"html":"<p>Title 14 of the Code of Federal Regulations, <b>Part 107<\/b>, governs <b>civil small unmanned aircraft systems (sUAS)<\/b> flown in the United States for any purpose other than pure recreation. If you fly a drone for Civil Air Patrol, for a business, for a school project you are paid for, for real-estate photos, or to help a fire department, you are flying under Part 107.<\/p>\n<h4>Part 107 does NOT apply to (107.1)<\/h4>\n<ul>\n<li><b>Air carrier operations<\/b> (carrying property between states for hire needs Part 135 certification).<\/li>\n<li><b>Recreational flying<\/b> under the statutory exception in <b>49 U.S.C. 44809<\/b>. Recreational flyers must pass the free <b>TRUST<\/b> test and follow a community-based organization's safety guidelines.<\/li>\n<li><b>Amateur rockets, moored balloons, kites, and unmanned free balloons<\/b> (Part 101).<\/li>\n<li><b>Public aircraft operations<\/b> (government agencies operating under their own authority), unless the agency chooses to operate under Part 107.<\/li>\n<\/ul>\n<div class=\"tip\"><b>On the test:<\/b> A Part 107 certificate holder who flies purely for fun may fly under either set of rules — but must follow <i>all<\/i> of the rules of whichever one they choose for that flight. You cannot mix and match.<\/div>\n<h4>Definitions you must know (107.3 and 14 CFR 1.1)<\/h4>\n<table class=\"tbl\">\n<tr><th>Term<\/th><th>Meaning<\/th><\/tr>\n<tr><td>Small unmanned aircraft (sUA)<\/td><td>An unmanned aircraft weighing <b>less than 55 pounds on takeoff, including everything on board or otherwise attached<\/b> (payload, camera, parachute, battery).<\/td><\/tr>\n<tr><td>Small unmanned aircraft system (sUAS)<\/td><td>The aircraft <b>plus<\/b> its associated elements — communication links, control station, and anything else needed to operate it safely.<\/td><\/tr>\n<tr><td>Control station<\/td><td>The interface the remote pilot uses to control the flight path (controller, tablet, laptop).<\/td><\/tr>\n<tr><td>Remote pilot in command (remote PIC)<\/td><td>The person who holds a remote pilot certificate and has <b>final authority and responsibility<\/b> for the operation.<\/td><\/tr>\n<tr><td>Person manipulating the flight controls<\/td><td>Whoever is actually flying. It can be the remote PIC or someone else under the remote PIC's direct supervision.<\/td><\/tr>\n<tr><td>Visual observer (VO)<\/td><td>A person designated by the remote PIC to help see and avoid other air traffic or objects. Optional.<\/td><\/tr>\n<tr><td>Corrective lenses<\/td><td>Glasses or contacts only. Binoculars, cameras and FPV goggles are not \"corrective lenses.\"<\/td><\/tr>\n<tr><td>Civil twilight<\/td><td>In the lower 48 states, Hawaii and territories: the 30 minutes before official sunrise and the 30 minutes after official sunset. Alaska uses the Air Almanac.<\/td><\/tr>\n<tr><td>Night<\/td><td>The time between the end of evening civil twilight and the beginning of morning civil twilight.<\/td><\/tr>\n<\/table>\n<details class=\"chk\"><summary>Check yourself: A 52-lb drone carries a 4-lb camera. Is it a small UA?<\/summary>No. Weight is measured at takeoff including everything attached: 56 lb is not \"less than 55 lb.\" It would need an exemption to fly.<\/details>"},{"t":"1.2 Getting your Remote Pilot Certificate","acs":["UA.I.C.K3","UA.I.B.K22"],"html":"<h4>Eligibility (107.61)<\/h4>\n<ol>\n<li>Be at least <b>16 years old<\/b>.<\/li>\n<li>Be able to <b>read, speak, write, and understand English<\/b>. If you can't for a medical reason, the FAA may add operating limitations to the certificate.<\/li>\n<li>Not know, or have reason to know, of any <b>physical or mental condition<\/b> that would interfere with safe operation.<\/li>\n<li>Demonstrate aeronautical knowledge in one of two ways:\n <ul><li><b>Pass the initial knowledge test<\/b> (Unmanned Aircraft General – Small, \"UAG\") at an FAA-approved testing center, <b>or<\/b><\/li>\n <li>Hold a Part 61 pilot certificate (other than student pilot), have a <b>flight review within the previous 24 calendar months<\/b>, and complete the free online course <b>ALC-451<\/b>.<\/li><\/ul><\/li>\n<\/ol>\n<h4>Step by step<\/h4>\n<ol>\n<li>Create an <b>IACRA<\/b> account to get your FAA Tracking Number (FTN).<\/li>\n<li>Schedule the UAG test with <b>PSI<\/b> (fee about $175 — confirm with PSI). Bring government-issued photo ID.<\/li>\n<li>Pass with <b>70%<\/b> or better (42 of 60 questions). You get a Knowledge Test Report with an exam ID.<\/li>\n<li>Wait about 48 hours, then complete <b>FAA Form 8710-13<\/b> in IACRA using your exam ID.<\/li>\n<li>The <b>TSA<\/b> runs a security background check.<\/li>\n<li>You receive a <b>temporary certificate<\/b> by email (printable from IACRA, valid 120 days); the permanent plastic certificate comes by mail.<\/li>\n<\/ol>\n<div class=\"warn\"><b>Failed the test?<\/b> You must wait <b>14 calendar days<\/b> before retesting (107.71). You pay again.<\/div>\n<h4>Who must hold the certificate (107.12)<\/h4>\n<p>The remote PIC must hold a remote pilot certificate with a small UAS rating. <b>Anyone else may fly<\/b> (manipulate the controls) only if they are under the <b>direct supervision<\/b> of a certificated remote PIC who has the ability to <b>immediately take direct control<\/b> of the aircraft. This is how a 15-year-old cadet can fly a training mission with you beside them.<\/p>\n<details class=\"chk\"><summary>Check yourself: Your cadet is 15 and has passed a practice exam. Can she take the UAG test?<\/summary>No. Applicants must be at least 16 to be eligible for the certificate, so she should keep studying and test on or after her 16th birthday. Until then she can still fly under your direct supervision.<\/details>"},{"t":"1.3 Staying current and carrying your certificate","acs":["UA.I.C.K4","UA.I.A.K5","UA.I.A.K3"],"html":"<h4>Aeronautical knowledge recency (107.65)<\/h4>\n<p>The certificate itself <b>never expires<\/b>. But to act as remote PIC you must have, within the <b>previous 24 calendar months<\/b>, either passed the initial knowledge test or completed the FAA's <b>free online recurrent training (ALC-677)<\/b> at FAASafety.gov.<\/p>\n<div class=\"ex\"><b>Worked example — calendar months.<\/b> You passed the test on <b>March 3, 2025<\/b>. \"24 calendar months\" runs to the <b>end<\/b> of the month: you are current through <b>March 31, 2027<\/b>. Complete ALC-677 any time before then.<\/div>\n<h4>Inspection, testing and demonstration of compliance (107.7)<\/h4>\n<p>When flying you must have your <b>remote pilot certificate<\/b> and <b>photo ID<\/b> available. On request you must present them, and any document, record or report required by the regulations, to:<\/p>\n<ul><li>the <b>FAA<\/b>, the <b>NTSB<\/b>, the <b>TSA<\/b>, and<\/li><li>any <b>federal, state, or local law enforcement officer<\/b>.<\/li><\/ul>\n<p>You must also allow the FAA, on request, to <b>test or inspect<\/b> your sUAS, you, any person manipulating the controls, and any visual observer to confirm compliance.<\/p>\n<h4>Falsification, reproduction or alteration (107.5)<\/h4>\n<p>Making a fraudulent or intentionally false entry in any application, record or report — or reproducing or altering a certificate, rating, authorization, record or report for a fraudulent purpose — is grounds to <b>deny an application<\/b> and to <b>suspend or revoke<\/b> any certificate, waiver or authorization you hold. That includes a waiver application or an accident report.<\/p>\n<h4>Change of address (107.77)<\/h4>\n<p>Tell the FAA about a new permanent mailing address within <b>30 days<\/b>, or you may not exercise the privileges of your certificate until you do.<\/p>"},{"t":"1.4 Accident reporting","acs":["UA.I.A.K4"],"html":"<p>Within <b>10 calendar days<\/b> of the operation, the remote PIC must report to the FAA any operation that results in at least:<\/p>\n<ol>\n<li><b>Serious injury<\/b> to any person — Abbreviated Injury Scale (AIS) level 3 or higher (for example, injuries that need hospitalization, broken bones), <b>or any loss of consciousness<\/b>; or<\/li>\n<li><b>Damage to any property, other than the small unmanned aircraft<\/b>, unless the cost of repair (materials and labor) or the fair market value if it is a total loss is <b>$500 or less<\/b>.<\/li>\n<\/ol>\n<p>Report through <b>FAA DroneZone<\/b> or to the local <b>Flight Standards District Office (FSDO)<\/b>.<\/p>\n<div class=\"tip\"><b>On the test:<\/b> Damage to <b>your own drone never counts<\/b> toward the $500. A $350 fence repair is not reportable. A car with $650 of damage is. A bystander who faints after being bumped is reportable because of the loss of consciousness, even with no other injury.<\/div>\n<p class=\"small mute\">Separately, the NTSB (49 CFR 830) must be notified immediately of an unmanned aircraft accident involving death or serious injury. CAP members also follow CAP mishap reporting rules.<\/p>\n<details class=\"chk\"><summary>Check yourself: You crash on May 2 and damage a $1,200 drone and nothing else. Report?<\/summary>No. Only damage to property other than the UA counts, and nobody was injured.<\/details>"},{"t":"1.5 Alcohol, drugs and refusing a test","acs":["UA.I.B.K8","UA.I.C.K1","UA.I.C.K2"],"html":"<p>Part 107.27 applies the manned-aircraft alcohol and drug rules (14 CFR 91.17 and 91.19) to remote pilots and visual observers. You may not act as a crewmember:<\/p>\n<ul>\n<li>within <b>8 hours<\/b> after drinking any alcohol (\"8 hours bottle to throttle\");<\/li>\n<li>while <b>under the influence<\/b> of alcohol;<\/li>\n<li>with a <b>blood or breath alcohol concentration of 0.04 or greater<\/b>;<\/li>\n<li>while using any drug that affects your faculties in a way contrary to safety.<\/li>\n<\/ul>\n<div class=\"tip\"><b>On the test:<\/b> All three conditions must be met. Eight hours after drinking with a BAC of 0.05 — you still cannot fly.<\/div>\n<h4>Offenses involving drugs or alcohol (107.57)<\/h4>\n<p>A conviction for violating any federal or state law about growing, processing, manufacturing, selling, possessing, transporting or importing narcotic drugs, marijuana, or depressant or stimulant drugs is grounds for:<\/p>\n<ul><li><b>denial of an application<\/b> for a certificate for up to <b>1 year<\/b> after the final conviction; or<\/li><li><b>suspension or revocation<\/b> of a certificate.<\/li><\/ul>\n<p>Breaking 91.17(a) or 91.19(a) carries the same consequences.<\/p>\n<h4>Refusing to be tested (107.59)<\/h4>\n<p>Refusing a law enforcement or FAA request to take an alcohol test, or to furnish or authorize release of test results, is grounds for <b>denial of an application for up to 1 year<\/b> after the refusal and for <b>suspension or revocation<\/b>.<\/p>"},{"t":"1.6 Registration and marking","acs":["UA.I.B.K1"],"html":"<ul>\n<li>Every small UA flown under Part 107 must be <b>registered with the FAA regardless of weight<\/b> — even a 249-gram drone (Part 48, through FAA DroneZone). Alternatively it may hold a traditional Part 47 registration.<\/li>\n<li>Cost: <b>$5 per aircraft<\/b>, valid <b>3 years<\/b>. The owner must be at least <b>13<\/b> years old (otherwise someone 13 or older registers it).<\/li>\n<li>The <b>registration number must be displayed on an external surface<\/b> of the aircraft (48.200). It must be visible without tools — you may not hide it inside the battery compartment.<\/li>\n<li>Carry the registration certificate (paper or electronic) when flying, and keep the registration up to date: update address changes and report sale, transfer, or destruction.<\/li>\n<li>A <b>recreational (TRUST/Part 48 \"recreational\") registration cannot be used<\/b> for a Part 107 flight — register the aircraft as Part 107.<\/li>\n<li>For Remote ID, the <b>serial number<\/b> of the standard Remote ID drone or broadcast module must be listed on the registration.<\/li>\n<\/ul>"},{"t":"1.7 Remote ID (Part 89)","acs":["UA.I.F.K1","UA.I.F.K2","UA.I.F.K3","UA.I.F.K4","UA.I.F.K5","UA.I.F.K6","UA.I.F.K7"],"html":"<p><b>Remote ID<\/b> is a \"digital license plate.\" The drone broadcasts identification and location information that people nearby (and law enforcement) can receive with a phone. Since <b>March 16, 2024<\/b>, every drone required to be registered must comply in one of three ways:<\/p>\n{{FIG:F_RID}}\n<h4>1. Standard Remote ID drone<\/h4>\n<p>Built in by the manufacturer. Broadcasts from <b>takeoff to shutdown<\/b>. The <b>minimum message elements<\/b> are:<\/p>\n<ul>\n<li><b>UA identification<\/b> — the serial number, or a session ID;<\/li>\n<li>UA <b>latitude, longitude and geometric altitude<\/b>, and <b>velocity<\/b>;<\/li>\n<li><b>control station latitude, longitude and geometric altitude<\/b>;<\/li>\n<li>a <b>time mark<\/b>; and<\/li>\n<li><b>emergency status<\/b>.<\/li>\n<\/ul>\n<p>It does <b>not<\/b> broadcast the pilot's name, phone number or address. Only the FAA and law enforcement can connect the serial number to the owner.<\/p>\n<p>If the Remote ID stops broadcasting during flight, <b>land as soon as practicable<\/b>. The drone must not take off if it fails its Remote ID self-test.<\/p>\n<h4>2. Remote ID broadcast module (alternative Remote ID)<\/h4>\n<p>An add-on device for older or home-built drones. It broadcasts UA identification (module serial number), UA position/altitude/velocity, <b>takeoff location<\/b> (instead of control station location) and a time mark. Drones using a broadcast module must stay within <b>visual line of sight<\/b>.<\/p>\n<h4>3. FAA-Recognized Identification Area (FRIA)<\/h4>\n<p>A defined area (often a model-aircraft field or school) where drones without Remote ID may fly, but only <b>within visual line of sight and within the FRIA boundaries<\/b>.<\/p>\n<h4>Other Remote ID rules<\/h4>\n<ul>\n<li><b>Aeronautical research / showing compliance:<\/b> with FAA authorization, a drone may fly without Remote ID to conduct aeronautical research or to show compliance with regulations.<\/li>\n<li><b>ADS-B Out is not a substitute<\/b> and is prohibited for sUAS under Part 107 (107.53) unless authorized. ATC transponders are also prohibited (107.52).<\/li>\n<li><b>Confirmation of identification:<\/b> the operator must list the Remote ID serial number on the aircraft's FAA registration so the broadcast can be tied to a registered aircraft.<\/li>\n<li><b>Product labeling:<\/b> standard Remote ID drones and broadcast modules must carry an English label showing they meet the Remote ID requirements (produced under an FAA-accepted Declaration of Compliance).<\/li>\n<\/ul>\n<div class=\"tip\"><b>On the test:<\/b> Know the difference between what a standard RID drone broadcasts (control station location + emergency status) and what a broadcast module broadcasts (takeoff location, no emergency status).<\/div>"},{"t":"1.8 Records, multiple categories and older aircraft","acs":["UA.I.A.K6","UA.I.A.K7","UA.I.A.K8"],"html":"<h4>Multiple-category sUAS (107.150)<\/h4>\n<p>A drone may be eligible for more than one category of operations over people (see Module 2) — for example Category 2 in one configuration and Category 3 in another — <b>as long as the remote PIC cannot switch modes or configurations by accident<\/b>. The label must show each category, and before each flight the remote PIC must confirm which category the aircraft is configured for and follow that category's rules.<\/p>\n<h4>Record retention<\/h4>\n<ul>\n<li>Remote PIC: keep and produce on request any document, record or report the rules require (107.7) — certificate, registration, waivers and authorizations, and any reports the FAA asks for.<\/li>\n<li>Declaration of Compliance applicants (manufacturers or modifiers): keep supporting compliance records for <b>2 years<\/b> after production ceases (or 2 years after submitting the declaration if they only design or modify) and make them available to the FAA (107.165).<\/li>\n<li>Category 4 aircraft: maintenance, preventive maintenance and alteration records kept for <b>1 year<\/b> or until the work is repeated or superseded; life-limited parts and inspection status records transfer with the aircraft (107.140).<\/li>\n<\/ul>\n<h4>Previously manufactured sUAS<\/h4>\n<p>Drones built before the newer rules can still be flown. For Remote ID they use a <b>broadcast module<\/b> or fly in a <b>FRIA<\/b>. For operations over people they qualify only if they meet <b>Category 1<\/b> (0.55 lb or less, no lacerating exposed rotating parts) or the manufacturer/modifier files a Declaration of Compliance that covers them (often after a modification or firmware update).<\/p>"}]},{"id":"M2","num":2,"title":"Regulations II — Operating Rules, Night, Over People & Waivers","area":"REG","acs":"UA.I.B, I.D, I.E","session":1,"minutes":60,"objectives":["Apply the 107.51 operating limits from memory","State lighting and training requirements for civil twilight and night","Identify the four categories of operations over people","Distinguish waivable from non-waivable rules"],"sections":[["The numbers you must know (107.51)",["Altitude: 400 ft AGL — or higher within 400 ft of a structure, up to 400 ft above its top.","Groundspeed: 87 knots (100 mph).","Visibility: 3 statute miles from the control station.","Clouds: 500 ft below, 2,000 ft horizontally."]],["Preflight and crew",["Remote PIC checks the sUAS before every flight (107.15) and completes 107.49: assess the environment (weather, airspace, people and property), brief everyone on conditions, emergency and contingency procedures and roles, verify control links, sufficient power, and secure attachments.","VLOS (107.31): unaided vision except corrective lenses. FPV is allowed only if a VO keeps VLOS.","VO (107.33) is optional; if used, effective communication is required.","One UA at a time (107.35)."]],["Prohibited or limited operations",["Careless or reckless operation (107.23(a)). Dropping objects is allowed if no undue hazard (107.23(b)).","From a moving aircraft: never. From a moving land or water vehicle: only over sparsely populated areas (107.25).","Hazardous materials: prohibited, not waivable (107.36).","Yield right of way to all aircraft (107.37).","Controlled airspace (B, C, D, surface E) needs ATC authorization (107.41); don't interfere with airport traffic (107.43); restricted/prohibited areas need the controlling agency (107.45); obey TFRs/NOTAMs (107.47).","In-flight emergency: deviate as necessary; written report to FAA if requested (107.21)."]],["Civil twilight and night (107.29)",["Civil twilight (lower 48): 30 min before official sunrise to sunrise; sunset to 30 min after sunset.","Anti-collision lighting visible 3 SM with flash rate sufficient to avoid collision, for twilight AND night.","Intensity may be reduced (never extinguished) in the interest of safety.","Night requires initial test or recurrent training under the current rules (post-April 6, 2021). No waiver needed."]],["Operations over people (Subpart D)",["Category 1: 0.55 lb or less including everything; no exposed rotating parts that would lacerate skin.","Category 2: injury below 11 ft-lb transfer; no exposed lacerating parts; no safety defects; FAA-accepted Declaration of Compliance.","Category 3: below 25 ft-lb; DOC; NOT over open-air assemblies; only over closed/restricted-access sites with notice, or transit (not sustained) over people.","Category 4: FAA airworthiness certificate; follow its operating limitations.","Sustained flight over open-air assemblies (Cat 1, 2, 4) requires Remote ID compliance."]],["Waivers (Subpart D, 107.205)",["Waivable examples: 107.25, 107.29, 107.31, 107.33, 107.35, 107.37(a), 107.39, 107.41, 107.51, 107.145.","Not waivable: hazmat (107.36), alcohol/drugs (107.27), careless/reckless (107.23).","Apply via FAADroneZone with a safety case; allow up to 90 days."]]],"traps":["The structure exception still needs airspace authorization if in controlled airspace.","Twilight needs the same lights as night.","Cat 3 is the only category banned over open-air assemblies."],"lessons":[{"t":"2.1 The operating limits (107.51)","acs":["UA.I.B.K21","UA.I.B.K21a","UA.I.B.K21b","UA.I.B.K21c","UA.I.B.K21d","UA.II.B.K1"],"html":"<table class=\"tbl big-tbl\">\n<tr><th>Limit<\/th><th>Value<\/th><th>Notes<\/th><\/tr>\n<tr><td>Groundspeed<\/td><td><b>87 knots (100 mph)<\/b><\/td><td>Groundspeed, not airspeed — a tailwind counts.<\/td><\/tr>\n<tr><td>Altitude<\/td><td><b>400 ft AGL<\/b><\/td><td>Unless within a <b>400-ft radius of a structure<\/b>, and not more than <b>400 ft above the structure's immediate uppermost limit<\/b>.<\/td><\/tr>\n<tr><td>Flight visibility<\/td><td><b>3 statute miles<\/b><\/td><td>Measured from the <b>control station<\/b>.<\/td><\/tr>\n<tr><td>Cloud clearance<\/td><td><b>500 ft below<\/b>, <b>2,000 ft horizontal<\/b><\/td><td>No minimum above clouds is listed because you can't legally be above one and keep VLOS from the ground.<\/td><\/tr>\n<\/table>\n<div class=\"ex\"><b>Worked example — the structure rule.<\/b> You inspect a 1,200-ft AGL tower. While you stay within 400 ft of it (horizontally) you may fly up to <b>1,600 ft AGL<\/b> (1,200 + 400). Step 401 ft away and the 400-ft AGL limit applies again. The exception does <b>not<\/b> remove airspace rules: if that tower sits in Class E airspace starting at 700 ft AGL, you need authorization to climb into it.<\/div>\n<details class=\"chk\"><summary>Check yourself: Groundspeed 70 kt with a 20-kt tailwind. Legal?<\/summary>Groundspeed already includes the wind. 70 kt groundspeed is legal. If the airspeed were 70 kt and the tailwind 20 kt, groundspeed would be 90 kt — illegal.<\/details>"},{"t":"2.2 The remote PIC, crew and preflight","acs":["UA.I.B.K4","UA.I.B.K4a","UA.I.B.K2","UA.I.B.K3","UA.I.B.K20"],"html":"<h4>Responsibility and authority (107.19)<\/h4>\n<ul>\n<li>A remote PIC must be designated <b>before or during<\/b> the flight.<\/li>\n<li>The remote PIC is <b>directly responsible for, and is the final authority<\/b> on, the operation.<\/li>\n<li>The remote PIC must make sure the flight complies with Part 107 and poses no undue hazard to other people, aircraft or property if control is lost.<\/li>\n<li>A person other than the remote PIC may fly only under the remote PIC's <b>direct supervision<\/b>, with the remote PIC able to <b>immediately take direct control<\/b> (for example, a buddy-box controller or standing beside them with a handoff plan).<\/li>\n<\/ul>\n<h4>Medical condition (107.17)<\/h4>\n<p>No medical certificate is required, but you may not fly — or act as VO — if you know or have reason to know of a physical or mental condition that would interfere with safe operation (for example, a migraine, new medication, or eye problem).<\/p>\n<h4>Condition for safe operation (107.15)<\/h4>\n<p>Before each flight the remote PIC must check the sUAS to make sure it is in a condition for safe operation. If it becomes unsafe, <b>stop the operation<\/b>.<\/p>\n<h4>Preflight familiarization, inspection and actions (107.49)<\/h4>\n<p>Before flight the remote PIC must:<\/p>\n<ol>\n<li><b>Assess the operating environment<\/b>, considering risks to persons and property in the immediate vicinity both on the surface and in the air, including: local weather; local airspace and any flight restrictions; the location of persons and property on the surface; and other ground hazards.<\/li>\n<li>Ensure that all persons directly participating know the <b>operating conditions, emergency procedures, contingency procedures, roles and responsibilities, and potential hazards<\/b> (a crew briefing).<\/li>\n<li>Ensure that all <b>control links<\/b> between the control station and the aircraft are working properly.<\/li>\n<li>If the sUAS is powered, ensure there is <b>enough power<\/b> to operate for the intended time.<\/li>\n<li>Ensure that any object attached or carried is <b>secure<\/b> and does not adversely affect flight characteristics or controllability.<\/li>\n<\/ol>\n<div class=\"tip\"><b>CAP tie-in:<\/b> This is exactly what the CAP sUAS preflight checklist and crew brief do. Use the same order every time.<\/div>"},{"t":"2.3 Visual line of sight and visual observers","acs":["UA.I.B.K10","UA.I.B.K11","UA.I.B.K12","UA.I.B.K23"],"html":"<h4>Visual line of sight (107.31)<\/h4>\n<p>With vision that is <b>unaided by any device other than corrective lenses<\/b>, the remote PIC and the person manipulating the controls must be able to see the aircraft throughout the flight well enough to:<\/p>\n<ul><li>know its location;<\/li><li>determine its attitude, altitude and direction of flight;<\/li><li>observe the airspace for other air traffic or hazards; and<\/li><li>determine that it does not endanger the life or property of another.<\/li><\/ul>\n<p>Either the remote PIC/person manipulating the controls keeps VLOS, <b>or<\/b> a visual observer does — but the remote PIC and the person flying must always be <b>able<\/b> to see it.<\/p>\n<div class=\"tip\"><b>FPV:<\/b> First-person-view goggles are allowed only if a visual observer maintains VLOS at all times.<\/div>\n<h4>Visual observers (107.33)<\/h4>\n<ul>\n<li>The remote PIC, the person manipulating the controls and the VO must maintain <b>effective communication<\/b> with each other at all times (voice, radio, or other means).<\/li>\n<li>The remote PIC must make sure the VO can see the aircraft in the way VLOS requires.<\/li>\n<li>All must coordinate to scan the airspace and keep the aircraft clear of hazards.<\/li>\n<li>A VO does not need a certificate. A VO cannot be used to extend range beyond what the remote PIC could see (\"daisy-chaining\" is not allowed without a waiver).<\/li>\n<\/ul>\n<h4>One aircraft at a time (107.35)<\/h4>\n<p>A person may not act as remote PIC or manipulate the controls of more than one sUA at a time (waivable — this is how drone light shows are flown).<\/p>\n<h4>Automated operations<\/h4>\n<p>Waypoint missions, automated mapping grids and \"return to home\" are allowed. Automation does not change responsibility: the remote PIC must keep VLOS, be ready to take manual control immediately, and ensure the flight follows every rule. Fully autonomous flight with nobody able to intervene needs a waiver.<\/p>"},{"t":"2.4 Hazardous operations and right-of-way","acs":["UA.I.B.K5","UA.I.B.K6","UA.I.B.K6a","UA.I.B.K6b","UA.I.B.K7","UA.I.B.K13","UA.I.B.K14","UA.I.B.K14a"],"html":"<table class=\"tbl\">\n<tr><th>Rule<\/th><th>What it says<\/th><\/tr>\n<tr><td>107.21 In-flight emergency<\/td><td>In an emergency requiring immediate action, the remote PIC <b>may deviate from any rule<\/b> to the extent necessary. If the FAA asks, send a <b>written report<\/b> of the deviation.<\/td><\/tr>\n<tr><td>107.23 Careless or reckless; dropping objects<\/td><td>No careless or reckless operation that endangers life or property. You <b>may drop an object<\/b> only if it does not create an undue hazard to persons or property.<\/td><\/tr>\n<tr><td>107.25 Moving vehicles<\/td><td>No operation <b>from a moving aircraft<\/b>. From a <b>moving land or water-borne vehicle<\/b> only over a <b>sparsely populated area<\/b> — and never when transporting another person's property for compensation.<\/td><\/tr>\n<tr><td>107.36 Hazardous material<\/td><td>A small UA may <b>not carry hazardous material<\/b> (as defined in 49 CFR 171.8). Its own lithium battery is not \"carried\" cargo.<\/td><\/tr>\n<tr><td>107.37 Right-of-way<\/td><td>Yield the right-of-way to <b>all<\/b> aircraft, airborne vehicles and launch/reentry vehicles. Don't pass so close to another aircraft as to create a collision hazard.<\/td><\/tr>\n<\/table>\n<h4>See and avoid (107.37 and AC 107-2A)<\/h4>\n<ul>\n<li>Manned aircraft pilots usually <b>cannot see a small drone<\/b> in time to avoid it. It is always on you to give way.<\/li>\n<li>Scan with short, regularly spaced eye movements (see Module 7, vision). Listen for engines and rotors.<\/li>\n<li>Helicopters (medevac, news, police, utility patrols) and crop dusters fly legally below 400 ft. Descend and move clear immediately.<\/li>\n<li>Know your aircraft's descent rate and plan an \"escape\" altitude before you need it.<\/li>\n<\/ul>\n<details class=\"chk\"><summary>Check yourself: You are mapping a farm from a slow-moving pickup on a rural road. Legal?<\/summary>Yes — operating from a moving land vehicle is allowed over a sparsely populated area (107.25), provided you aren't carrying someone else's property for hire.<\/details>"},{"t":"2.5 Airspace, airports and restricted areas — the rules","acs":["UA.I.B.K16","UA.I.B.K17","UA.I.B.K18","UA.I.B.K19","UA.I.B.K27","UA.I.B.K28"],"html":"<ul>\n<li><b>107.41 Controlled airspace:<\/b> you need <b>prior ATC authorization<\/b> to fly in <b>Class B, C or D<\/b> airspace or within the lateral boundaries of the <b>surface area of Class E airspace designated for an airport<\/b>. Class E that begins at 700 or 1,200 ft AGL is above 400 ft and normally is not a factor. (Module 3 covers how to get authorization.)<\/li>\n<li><b>107.43 Airports:<\/b> you may not fly in a way that interferes with operations and traffic patterns at any <b>airport, heliport or seaplane base<\/b> — even in Class G.<\/li>\n<li><b>107.45 Prohibited or restricted areas:<\/b> no flight without permission from the <b>using or controlling agency<\/b>.<\/li>\n<li><b>107.47 Flight restrictions in the proximity of certain areas designated by NOTAM:<\/b> you must follow TFRs and special security instructions issued under 14 CFR 91.137 (disaster/hazard areas), 91.138 (national disaster areas in Hawaii), 91.139 (emergency air traffic rules), 91.141 (presidential and other parties), 91.143 (space flight operations), 91.144 (abnormally high barometric pressure), 91.145 (aerial demonstrations and major sporting events), and 99.7 (special security instructions).<\/li>\n<li><b>107.52 / 107.53:<\/b> an sUA may not use an <b>ATC transponder<\/b> or <b>ADS-B Out<\/b> unless authorized by the FAA. (They would clutter controllers' screens.)<\/li>\n<\/ul>"},{"t":"2.6 Civil twilight and night","acs":["UA.I.B.K9","UA.I.B.K24","UA.I.B.K25"],"html":"<p>Under 107.29, daylight flying needs no lights. To fly during <b>civil twilight<\/b> or at <b>night<\/b>:<\/p>\n<table class=\"tbl\">\n<tr><th><\/th><th>Civil twilight<\/th><th>Night<\/th><\/tr>\n<tr><td>Anti-collision lighting visible for at least <b>3 statute miles<\/b>, flash rate sufficient to avoid a collision<\/td><td>✔ Required<\/td><td>✔ Required<\/td><\/tr>\n<tr><td>Initial knowledge test taken on or after <b>April 6, 2021<\/b>, or current recurrent training (ALC-677)<\/td><td>—<\/td><td>✔ Required<\/td><\/tr>\n<tr><td>Waiver<\/td><td>Not needed<\/td><td>Not needed<\/td><\/tr>\n<\/table>\n<ul>\n<li>The remote PIC may <b>reduce the intensity<\/b> of the anti-collision lights (but not turn them off) if that is in the interest of safety — for example, to avoid blinding the crew.<\/li>\n<li>Civil twilight (lower 48): <b>30 minutes before official sunrise to sunrise<\/b> and <b>sunset to 30 minutes after official sunset<\/b>.<\/li>\n<li>Position lights are not required by Part 107 but help you keep orientation.<\/li>\n<\/ul>\n<div class=\"warn\"><b>Common trap:<\/b> Twilight needs the same 3-SM anti-collision lighting as night.<\/div>"},{"t":"2.7 Carrying property for compensation","acs":["UA.I.B.K26"],"html":"<p>Part 107 allows carrying property for compensation or hire (for example, a delivery) only if:<\/p>\n<ul>\n<li>the total weight of the aircraft <b>including the cargo is less than 55 lb<\/b>;<\/li>\n<li>the flight stays within <b>visual line of sight<\/b> and is not made from a moving vehicle or aircraft;<\/li>\n<li>the flight is <b>within one state<\/b> (not between Hawaii and another state, or involving DC or a U.S. territory and another location);<\/li>\n<li>no <b>hazardous material<\/b> is carried.<\/li>\n<\/ul>\n<p>Anything beyond that is an air carrier operation and needs Part 135 certification.<\/p>"},{"t":"2.8 Operations over people — the four categories","acs":["UA.I.B.K15","UA.I.E.K1","UA.I.E.K3","UA.I.E.K3a","UA.I.E.K3b","UA.I.E.K3c","UA.I.E.K3d","UA.I.E.K16","UA.I.E.K17","UA.I.E.K15","UA.I.E.K13"],"html":"<p>Since April 2021, Subpart D (107.100–107.165) lets remote pilots fly <b>over people<\/b> without a waiver if the aircraft meets one of four categories. \"Over\" means <b>directly above any part of a person<\/b>. People who are <b>directly participating<\/b> in the operation, or are <b>under a covered structure or inside a stationary vehicle<\/b> that would protect them, don't count.<\/p>\n<table class=\"tbl\">\n<tr><th><\/th><th>Category 1<\/th><th>Category 2<\/th><th>Category 3<\/th><th>Category 4<\/th><\/tr>\n<tr><td>Standard<\/td><td><b>0.55 lb (250 g) or less<\/b> including everything attached at takeoff<\/td><td>Injury no worse than <b>11 ft-lb<\/b> of kinetic energy transfer<\/td><td>Injury no worse than <b>25 ft-lb<\/b><\/td><td><b>Airworthiness certificate<\/b> (Part 21)<\/td><\/tr>\n<tr><td>Exposed rotating parts that could lacerate skin<\/td><td>Not allowed<\/td><td>Not allowed<\/td><td>Not allowed<\/td><td>Per certificate limits<\/td><\/tr>\n<tr><td>Safety defects<\/td><td>—<\/td><td>None<\/td><td>None<\/td><td>—<\/td><\/tr>\n<tr><td>Declaration of Compliance (DoC)<\/td><td>No<\/td><td><b>Yes<\/b>, using an FAA-accepted <b>Means of Compliance<\/b><\/td><td><b>Yes<\/b><\/td><td>No (airworthiness certificate instead)<\/td><\/tr>\n<tr><td>Label showing category<\/td><td>No<\/td><td>Yes<\/td><td>Yes<\/td><td>—<\/td><\/tr>\n<tr><td>Sustained flight over <b>open-air assemblies<\/b><\/td><td>Only with <b>Remote ID<\/b><\/td><td>Only with <b>Remote ID<\/b><\/td><td><b>Prohibited<\/b><\/td><td>Only with <b>Remote ID<\/b><\/td><\/tr>\n<tr><td>Other limits<\/td><td>—<\/td><td>—<\/td><td>Over people only inside a <b>closed or restricted-access site<\/b> where everyone is <b>on notice<\/b> — or <b>transit only<\/b> (no sustained flight) elsewhere<\/td><td>Follow the Flight Manual's operating limitations<\/td><\/tr>\n<\/table>\n<h4>Key terms<\/h4>\n<ul>\n<li><b>Impact kinetic energy<\/b> — KE = ½ × mass × velocity². The faster and heavier, the more energy. Manufacturers test against 11 and 25 ft-lb.<\/li>\n<li><b>Means of Compliance (MoC)<\/b> — an FAA-accepted test or analysis method that shows the aircraft meets the injury and laceration standards.<\/li>\n<li><b>Declaration of Compliance (DoC)<\/b> — the manufacturer's (or modifier's) formal declaration, filed with the FAA, that the aircraft meets Category 2 or 3. The FAA keeps a list of accepted DoCs; check it before flying over people.<\/li>\n<li><b>Exposed rotating parts<\/b> — propellers must be guarded or designed so they can't lacerate skin.<\/li>\n<\/ul>\n<div class=\"tip\"><b>On the test:<\/b> Category 3 is the only category <b>prohibited over open-air assemblies<\/b>. Categories 1, 2 and 4 need Remote ID for <b>sustained<\/b> flight over an open-air assembly (a crowd at a concert or parade).<\/div>"},{"t":"2.9 Operations over people — the details","acs":["UA.I.E.K2","UA.I.E.K4","UA.I.E.K5","UA.I.E.K6","UA.I.E.K7","UA.I.E.K8","UA.I.E.K9","UA.I.E.K10","UA.I.E.K11","UA.I.E.K12","UA.I.E.K14"],"html":"<ul>\n<li><b>At night:<\/b> operations over people are allowed under the same categories if the night rules are met (training and 3-SM anti-collision lighting).<\/li>\n<li><b>Selecting an operational area:<\/b> plan the flight path to avoid passing over people who aren't participating. Consider wind drift, failure modes and a safe landing area. Brief participants.<\/li>\n<li><b>Minimum distances:<\/b> Part 107 sets no fixed lateral distance; \"over\" means directly above any part of a person. Good practice is a buffer at least as large as your drift and descent distance in a failure.<\/li>\n<li><b>Moving vehicles (107.145):<\/b> Categories 1–3 may fly over people in moving vehicles only if the aircraft stays within or over a <b>closed- or restricted-access site<\/b> where everyone in the vehicles is on notice, <b>or<\/b> it does <b>not maintain sustained flight<\/b> over the moving vehicles. Category 4 needs its airworthiness certificate and operating limitations to allow it.<\/li>\n<li><b>Closed or restricted-access site:<\/b> a location with barriers or controls (fences, gates, staffed entry, signs) so that the people inside can be notified that a drone may fly over them.<\/li>\n<li><b>Modifications:<\/b> if you modify a Category 2 or 3 aircraft in a way the manufacturer's instructions don't allow (heavier camera, different props), it is <b>no longer eligible<\/b> for that category.<\/li>\n<li><b>Remote pilot operating instructions:<\/b> Category 2 and 3 DoC holders must provide instructions describing the system, which modifications don't affect eligibility, and how to verify and change modes or configurations. Read them before flying over people.<\/li>\n<li><b>Required components and category declaration:<\/b> the aircraft must carry a legible, prominent, permanently affixed English <b>label<\/b> showing its category. If the label is damaged, destroyed or missing, the remote PIC must <b>relabel<\/b> it before flying over people (107.135).<\/li>\n<li><b>Optional components:<\/b> parts the manufacturer lists as allowed to be added or removed (for example, a prop guard or light) without changing eligibility — only if listed in the instructions.<\/li>\n<li><b>Applicant-produced, designed or modified sUAS:<\/b> anyone who builds or modifies an aircraft can file their own DoC for Category 2 or 3, using an accepted Means of Compliance, and takes on the manufacturer's responsibilities (records, labeling, instructions, correcting safety defects).<\/li>\n<li><b>Maintenance:<\/b> maintain an over-people aircraft according to the manufacturer's instructions so it stays eligible. Category 4 follows its approved maintenance program and keeps records (1 year or until superseded).<\/li>\n<\/ul>"},{"t":"2.10 Waivers","acs":["UA.I.D.K1"],"html":"<p>The FAA can issue a <b>certificate of waiver<\/b> (107.200) if the applicant shows the operation can be conducted safely. Apply through <b>FAA DroneZone<\/b> at least <b>90 days<\/b> before you need it, with a description of the operation and a safety case (hazards, mitigations).<\/p>\n<h4>Waivable rules (107.205)<\/h4>\n<ul class=\"cols2\">\n<li>107.25 Moving vehicle or aircraft (not for carrying property for hire)<\/li>\n<li>107.29(a)(2) and (b) Night and twilight lighting/training<\/li>\n<li>107.31 Visual line of sight (BVLOS)<\/li>\n<li>107.33 Visual observer<\/li>\n<li>107.35 Multiple sUAS<\/li>\n<li>107.37(a) Yielding right of way<\/li>\n<li>107.39 Operations over people<\/li>\n<li>107.41 Airspace (use LAANC/DroneZone authorizations instead)<\/li>\n<li>107.51(a)–(d) Speed, altitude, visibility, cloud clearance<\/li>\n<li>107.145 Over moving vehicles<\/li>\n<\/ul>\n<div class=\"warn\"><b>Not waivable<\/b> (examples): 107.36 hazardous materials, 107.27 alcohol and drugs, 107.23 careless or reckless operation, 107.19 remote PIC responsibility, 107.15 condition for safe operation.<\/div>\n<p>A waiver comes with special provisions (conditions). Violating them is the same as violating the rule that was waived.<\/p>"}]},{"id":"M3","num":3,"title":"Airspace Classification & Authorization","area":"AIR","acs":"UA.II.A, II.B","session":1,"minutes":45,"objectives":["Identify each airspace class and its chart depiction","Decide whether a location needs ATC authorization","Use LAANC, UAS Facility Maps, and FAADroneZone correctly","Recognize special use airspace, MTRs, and TFRs"],"sections":[["The classes",["Class A: 18,000 ft MSL to FL600 — not a factor for sUAS.","Class B: solid blue; tiered 'upside-down wedding cake'; numbers = ceiling/floor in hundreds ft MSL (80/30).","Class C: solid magenta; ~5 NM surface area, ~10 NM shelf from 1,200 ft above airport to 4,000 ft above airport.","Class D: dashed blue; surface to ~2,500 ft above airport; [32] = ceiling 3,200 MSL; [-32] = up to but not including.","Class E: surface area = dashed magenta; magenta vignette = floor 700 AGL; blue vignette = floor 1,200 AGL; otherwise 14,500 MSL.","Class G: uncontrolled — no authorization needed."]],["Do I need authorization?",["Yes in B, C, D, and Class E surface areas (107.41).","No under a Class C/B shelf if the airspace at your altitude is E (above surface) or G.","Mode C veil (30 NM magenta circle) does not by itself require authorization.","Part-time towers: when closed, airspace reverts per Chart Supplement."]],["LAANC and FAADroneZone",["LAANC: near-real-time authorization through FAA-approved apps, up to UAS Facility Map grid altitudes.","Grid value = max AGL altitude ATC may authorize there; 0 = further coordination.","Above grid altitude or LAANC unavailable → FAADroneZone request (plan ahead)."]],["Special use and other airspace",["Prohibited (P-56): no flight. Restricted: controlling agency permission when active.","MOA: no permission, but check activity. Alert: training/unusual activity. Warning: offshore beyond 3 NM.","MTRs: IR/VR; 4 digits = at or below 1,500 AGL; 3 digits = segments above 1,500 AGL.","TFRs are FDC NOTAMs — check tfr.faa.gov or B4UFLY. Stadium TFR: 3 NM / 3,000 AGL, 1 hr before to 1 hr after (MLB, NFL, NCAA D-I football, major speedways; 30,000+ seats).","National Security UAS Flight Restrictions (99.7) over sensitive sites."]]],"traps":["Read whether chart altitudes are MSL or AGL.","Authorization depends on the airspace at YOUR altitude.","Sectionals do not show TFRs."],"lessons":[{"t":"3.1 The National Airspace System and ATC","acs":["UA.II.A.K4"],"html":"<p>The <b>National Airspace System (NAS)<\/b> is the network of U.S. airspace, airports, navigation aids, rules and air traffic control (ATC) facilities. ATC separates aircraft in <b>controlled airspace<\/b> (Classes A, B, C, D and E). Class G is <b>uncontrolled<\/b>.<\/p>\n<ul>\n<li><b>Control towers<\/b> manage traffic on and near an airport (Class B, C, D surface areas).<\/li>\n<li><b>TRACONs<\/b> (approach/departure control) handle traffic in the surrounding area.<\/li>\n<li><b>Air Route Traffic Control Centers<\/b> (\"Center\") handle en-route traffic.<\/li>\n<li><b>Flight Service<\/b> (1-800-WX-BRIEF, 1800wxbrief.com) provides weather briefings, NOTAMs and flight plans.<\/li>\n<\/ul>\n<p>Remote pilots normally do not talk to ATC by radio. Your connection to ATC is the <b>airspace authorization<\/b> you get through <b>LAANC<\/b> or <b>FAA DroneZone<\/b>, and the phone number listed on a waiver or authorization for emergencies.<\/p>\n{{FIG:F_PROFILE}}"},{"t":"3.2 The airspace classes","acs":["UA.II.A.K1","UA.II.A.K1a","UA.II.A.K1b","UA.II.A.K1c","UA.II.A.K1d","UA.II.A.K1e"],"html":"<table class=\"tbl\">\n<tr><th>Class<\/th><th>Typical dimensions<\/th><th>Chart depiction<\/th><th>sUAS needs authorization?<\/th><\/tr>\n<tr><td><b>A<\/b><\/td><td>18,000 ft MSL up to FL600<\/td><td>Not charted on sectionals<\/td><td>Not a factor<\/td><\/tr>\n<tr><td><b>B<\/b><\/td><td>Surface to about 10,000 ft MSL around the busiest airports; layered \"upside-down wedding cake\" shelves. Surrounded by a 30-NM <b>Mode C veil<\/b>.<\/td><td><b>Solid blue<\/b> lines; altitudes as ceiling over floor in hundreds of ft MSL<\/td><td><b>Yes<\/b><\/td><\/tr>\n<tr><td><b>C<\/b><\/td><td>Surface to 4,000 ft above airport elevation; <b>5-NM-radius core<\/b> from the surface and a <b>10-NM shelf<\/b> usually from 1,200 ft AGL; outer area to 20 NM (not charted, not airspace you need authorization for)<\/td><td><b>Solid magenta<\/b> lines<\/td><td><b>Yes<\/b><\/td><\/tr>\n<tr><td><b>D<\/b><\/td><td>Surface to about 2,500 ft above airport elevation around a towered airport (size varies)<\/td><td><b>Dashed blue<\/b>; ceiling in [brackets]<\/td><td><b>Yes<\/b><\/td><\/tr>\n<tr><td><b>E surface area<\/b><\/td><td>Begins at the surface around some nontowered airports (and around Class D airports when the tower is closed)<\/td><td><b>Dashed magenta<\/b><\/td><td><b>Yes<\/b><\/td><\/tr>\n<tr><td><b>E (other)<\/b><\/td><td>Begins at <b>700 ft AGL<\/b> (magenta vignette), <b>1,200 ft AGL<\/b> (most of the country, or blue vignette), or 14,500 ft MSL; continues up to but not including 18,000 MSL<\/td><td>Vignettes / no line<\/td><td>Normally no — it starts above 400 ft AGL<\/td><\/tr>\n<tr><td><b>G<\/b><\/td><td>Everything not designated A–E; usually from the surface up to 700 or 1,200 ft AGL<\/td><td>Not outlined<\/td><td><b>No<\/b><\/td><\/tr>\n<\/table>\n<ul>\n<li>The <b>Mode C veil<\/b> (thin magenta circle, 30 NM around a Class B primary airport) is a transponder requirement for manned aircraft. It does <b>not<\/b> by itself require drone authorization — what matters is the airspace class at your altitude.<\/li>\n<li>A <b>part-time Class D<\/b> tower: when the tower closes, the airspace reverts to Class E surface (if weather reporting is available) or Class G. The Chart Supplement tells you which. Check before assuming.<\/li>\n<li>Under a Class B or C <b>shelf<\/b>, the airspace at your altitude is whatever lies underneath — usually Class E or G — so no authorization may be needed.<\/li>\n<\/ul>\n<div class=\"tip\"><b>The one question that matters:<\/b> \"What airspace is <i>at my altitude<\/i> over <i>my point<\/i>?\" Not \"what is printed nearby.\"<\/div>"},{"t":"3.3 Getting authorization: LAANC and DroneZone","acs":["UA.II.B.K2"],"html":"<ul>\n<li><b>LAANC<\/b> (Low Altitude Authorization and Notification Capability): near-real-time authorization through FAA-approved apps (Aloft, Autel, DJI-partner apps, etc.) for Class B, C, D and E surface areas at participating airports — <b>up to the altitude shown on the UAS Facility Map grid<\/b>. Requests above the grid can be submitted for \"further coordination\" up to 90 days ahead.<\/li>\n<li><b>UAS Facility Maps<\/b> show squares around airports with numbers such as 0, 100, 200, 400: the maximum altitude (ft AGL) at which ATC may authorize you in that square without extra review. A <b>0<\/b> grid means expect a longer review — submit through DroneZone.<\/li>\n<li><b>FAA DroneZone<\/b> (faadronezone.faa.gov): airspace authorizations where LAANC isn't available, waivers, registration, accident reports. Apply well ahead of time.<\/li>\n<li>An authorization has <b>limits<\/b> — area, altitude, date/time window and special provisions (for example, \"notify the tower 15 minutes before launch\" or \"remain clear of the approach path\"). Follow them exactly; they are part of the legal permission.<\/li>\n<li>CAP members also follow CAPR 70-4 and their wing's approval process for sUAS sorties.<\/li>\n<\/ul>"},{"t":"3.4 Special-use and other airspace","acs":["UA.II.A.K2","UA.II.A.K3"],"html":"<h4>Special-use airspace (SUA)<\/h4>\n<table class=\"tbl\">\n<tr><th>Type<\/th><th>What it is<\/th><th>Can a drone fly there?<\/th><\/tr>\n<tr><td><b>Prohibited (P-56)<\/b><\/td><td>Flight prohibited for national security (White House, Camp David)<\/td><td><b>No<\/b><\/td><\/tr>\n<tr><td><b>Restricted (R-5802)<\/b><\/td><td>Hazards often invisible — artillery, guided missiles<\/td><td>Only with permission from the <b>controlling agency<\/b> when active<\/td><\/tr>\n<tr><td><b>Warning (W-)<\/b><\/td><td>Like restricted but over international waters, beginning 3 NM offshore<\/td><td>Use extreme caution<\/td><\/tr>\n<tr><td><b>Military Operations Area (MOA)<\/b><\/td><td>Military training, aerobatics, high-speed low flight<\/td><td>No permission needed, but check if it's active (Flight Service) and use extreme caution<\/td><\/tr>\n<tr><td><b>Alert area (A-)<\/b><\/td><td>High volume of pilot training or unusual activity<\/td><td>Yes — be alert<\/td><\/tr>\n<tr><td><b>Controlled firing area (CFA)<\/b><\/td><td>Activities stop when an aircraft approaches (spotters/radar)<\/td><td>Not charted; no action required<\/td><\/tr>\n<\/table>\n<p>Times of use, altitudes and the controlling agency are printed in the <b>SUA table<\/b> in the margin of the sectional.<\/p>\n<h4>Other airspace areas<\/h4>\n<ul>\n<li><b>Military Training Routes (MTRs):<\/b> gray lines labeled <b>IR<\/b> (instrument) or <b>VR<\/b> (visual). <b>Four digits<\/b> (VR1709) = flown <b>at or below 1,500 ft AGL<\/b>; three digits (IR712) = has segments above 1,500 ft AGL. Jets can fly at 250+ knots at low altitude. Check with Flight Service if the route is active.<\/li>\n<li><b>Temporary Flight Restrictions (TFRs):<\/b> issued by <b>FDC NOTAM<\/b>. Examples: disasters and wildfires (91.137), VIP/presidential movement (91.141), space launches, and <b>stadiums<\/b> — 3 NM radius, up to 3,000 ft AGL, from 1 hour before to 1 hour after MLB, NFL, NCAA Division I football and major motor speedway events in stadiums with 30,000+ seats (99.7 special security instruction). TFRs are <b>not printed on charts<\/b>.<\/li>\n<li><b>National Security UAS Flight Restrictions:<\/b> drone-specific restrictions over certain military bases, national landmarks and critical infrastructure (99.7 / 49 U.S.C. 44812). They appear in B4UFLY and LAANC apps.<\/li>\n<li><b>Parachute jump operations:<\/b> parachute symbol on the chart; details in the Chart Supplement. Jumpers may be overhead even in Class G.<\/li>\n<li><b>Airport Advisory Services:<\/b> Local Airport Advisory provided by Flight Service at some nontowered airports (within 10 SM).<\/li>\n<li><b>Terminal Radar Service Areas (TRSAs):<\/b> optional radar service for manned VFR aircraft; outlined in gray. The airspace beneath is usually Class D around the primary airport and E/G elsewhere.<\/li>\n<li><b>National Security Areas (NSAs):<\/b> pilots are asked to <b>voluntarily avoid<\/b> flying through; may become prohibited temporarily by NOTAM.<\/li>\n<li><b>VFR routes:<\/b> VFR flyways, corridors and transition routes through or near Class B — expect concentrated manned traffic.<\/li>\n<li><b>Wildlife refuges, national parks:<\/b> manned pilots are asked to stay above 2,000 ft AGL. Launching or landing drones in national parks is prohibited by National Park Service rules; check local rules for refuges.<\/li>\n<\/ul>"},{"t":"3.5 Operations near airports and the NOTAM system","acs":["UA.II.B.K3","UA.II.B.K5"],"html":"<h4>Near airports<\/h4>\n<ul>\n<li>Never interfere with traffic patterns (107.43). Manned aircraft fly the pattern at about <b>1,000 ft AGL<\/b> and descend on final through your altitude.<\/li>\n<li>Stay away from <b>approach and departure paths<\/b> extending out from each runway end. Helicopters may approach from any direction.<\/li>\n<li>At nontowered airports, <b>monitor the CTAF<\/b> (Module 7) and consider calling the airport manager.<\/li>\n<li>Even in Class G with no authorization needed, the airport environment is the highest-risk place to fly.<\/li>\n<\/ul>\n<h4>NOTAMs (Notices to Airmen)<\/h4>\n<p>A NOTAM is time-critical information not known far enough ahead to be printed on charts — a closed runway, an unlit tower, a TFR. Types you should know:<\/p>\n<ul>\n<li><b>NOTAM (D)<\/b> — distant dissemination: runway/taxiway closures, lighting outages, obstacles, airport hazards.<\/li>\n<li><b>FDC NOTAMs<\/b> — regulatory: <b>TFRs<\/b>, changes to procedures and charts.<\/li>\n<li>Pointer, military and Special Activity Airspace NOTAMs.<\/li>\n<\/ul>\n<p><b>How to get them:<\/b> call Flight Service at <b>1-800-WX-BRIEF<\/b> or use <b>1800wxbrief.com<\/b>, the FAA NOTAM Search website, or apps that pull NOTAMs (B4UFLY, LAANC providers). Check NOTAMs <b>before every flight<\/b> — TFRs can appear within minutes (wildfires, police activity, VIP visits).<\/p>"},{"t":"3.6 Flight hazards","acs":["UA.II.B.K4","UA.II.B.K4a","UA.II.B.K4b","UA.II.B.K4c","UA.II.B.K4d","UA.II.B.K4e","UA.II.B.K4f","UA.II.B.K4g"],"html":"<table class=\"tbl\">\n<tr><th>Hazard<\/th><th>What to know<\/th><\/tr>\n<tr><td>Common accident causes<\/td><td>Most accidents trace to <b>human factors<\/b>: poor decisions, complacency, skipped preflight, loss of situational awareness, flying beyond battery or wind limits, losing sight of the aircraft, hitting obstacles (trees, wires).<\/td><\/tr>\n<tr><td>Unmanned balloons<\/td><td>Avoid flying <b>beneath<\/b> unmanned free balloons and tethered balloons — payloads or cables can fall or hang below.<\/td><\/tr>\n<tr><td>Emergency airborne inspection of other aircraft<\/td><td>Manned pilots sometimes fly close to another aircraft to inspect a problem (e.g., landing gear). It is hazardous and should only be done by briefed, qualified pilots — <b>never approach another aircraft with a drone<\/b>.<\/td><\/tr>\n<tr><td>Precipitation static (P-static)<\/td><td>Static electricity builds up on an aircraft flying in rain, snow or dust and discharges, causing <b>radio noise and loss of communication/control link<\/b>; sometimes St. Elmo's fire.<\/td><\/tr>\n<tr><td>Lasers<\/td><td>Laser illumination can flash-blind a crew. Never point lasers at aircraft. Report laser illumination to ATC/FAA (and law enforcement) immediately.<\/td><\/tr>\n<tr><td>Thermal plumes<\/td><td>Smoke stacks, cooling towers and flare stacks create strong updrafts, turbulence, heat and reduced visibility. Avoid flying through or over them.<\/td><\/tr>\n<tr><td>Wire environment<\/td><td>Power lines and guy wires are nearly invisible, especially against a cluttered background. Towers have guy wires that can extend hundreds of feet out from the base. Look for poles and towers to find wires; scout the area first.<\/td><\/tr>\n<\/table>"},{"t":"3.7 Lighting and night considerations","acs":["UA.II.B.K6","UA.II.B.K7","UA.II.B.K8","UA.II.B.K9","UA.II.B.K10"],"html":"<ul>\n<li><b>Operator equipment for night flight:<\/b> flashlight with a <b>red<\/b> mode (preserves night vision), spare batteries for aircraft lights, reflective vests, cones/lights to mark the launch area, headlamp, and a charged device with a dimmed screen.<\/li>\n<li><b>Ground structures and lighting:<\/b> structures more than about 200 ft AGL are generally lighted (steady/flashing red or high-intensity white strobes) and charted as obstacles. Lights can be out of service — check obstacle-light NOTAMs.<\/li>\n<li><b>Hazards without lighting:<\/b> trees, wires, poles, fences, cranes, light posts and terrain are invisible at night. <b>Survey the site in daylight<\/b> before a night flight.<\/li>\n<li><b>Manned aircraft lighting:<\/b> red position light on the <b>left<\/b> wingtip, green on the <b>right<\/b>, white on the tail, plus flashing anti-collision lights. If you see red on the left and green on the right, the aircraft is heading toward you.<\/li>\n<li><b>sUAS lighting:<\/b> 3-SM anti-collision lighting for twilight and night (107.29). Position lights help you judge orientation.<\/li>\n<\/ul>\n{{FIG:F_LIGHTS}}"}]},{"id":"M4","num":4,"title":"Sectional Chart Lab","area":"AIR","acs":"UA.II.A, V.B","session":2,"minutes":70,"objectives":["Read airport data blocks, frequencies, and field elevation","Determine airspace class, floor, ceiling, and authorization need at any point","Interpret obstacles, MEFs, latitude/longitude, and hazard symbols","Read unfamiliar current-sectional excerpts (post-October 26, 2026 test format)"],"sections":[["Reading an airport",["Blue symbol = towered; magenta = nontowered.","Data block: name, identifier, CT frequency (★ = part-time), ATIS, elevation, L = lighting, longest runway in hundreds of ft, circled C = CTAF, UNICOM.","Use the Chart Supplement for hours, pattern direction, and remarks."]],["Obstacles and terrain",["Obstacle labels: bold top = MSL; (parentheses) = AGL.","Group obstacles, lighted obstacles, and towers over 1,000 ft AGL have special symbols.","MEF = highest terrain/obstacle in the quadrangle (+ buffer), in thousands/hundreds MSL."]],["Position and hazards",["Latitude = N/S of equator (lines run E–W). Longitude = E/W of prime meridian. Each degree = 60 minutes; ticks every minute.","Parachute symbol = jump area. Magenta flag = VFR checkpoint (manned traffic). Gray line with IR/VR = MTR.","Wildlife refuges, national parks: manned aircraft asked to stay above 2,000 ft AGL; check local rules."]],["Method for any chart question",["1) Find the point. 2) What airspace boundary surrounds it? 3) Floor/ceiling — MSL or AGL? 4) Convert using field or ground elevation. 5) Is my operating altitude inside controlled airspace? 6) Any SUA, MTR, obstacle, or NOTAM issue?","Practice on current sectionals, not just the supplement — the test now shows unfamiliar chart excerpts."]]],"traps":["Subtract field elevation when converting MSL to AGL.","Class D ceilings are charted MSL.","The newest test shows charts you have never seen."],"lessons":[{"t":"4.1 Sectional charts: what they are","acs":["UA.V.B.K6","UA.V.B.K6a","UA.V.B.K6b"],"html":"<ul>\n<li><b>Sectional aeronautical charts<\/b> are the primary VFR navigation charts: scale <b>1:500,000<\/b> (about 1 inch = 7 NM). They are updated every <b>56 days<\/b>. Free digital copies are at <b>faa.gov → Digital VFR Charts<\/b>.<\/li>\n<li><b>Terminal Area Charts (TACs)<\/b> show Class B areas at larger scale (1:250,000).<\/li>\n<li>The <b>Chart Supplement<\/b> (formerly the Airport/Facility Directory) gives details charts can't: tower hours, runway data, traffic pattern direction, lighting, weather-reporting phone numbers, parachute jumping details, and remarks. Updated every 56 days; free online.<\/li>\n<li>The <b>FAA Aeronautical Chart User's Guide<\/b> explains every symbol. Since October 26, 2026 the UAG test can show <b>current sectional excerpts not in the testing supplement<\/b> — so learn the symbols, not just the test figures.<\/li>\n<\/ul>\n{{FIG:F_LEGEND}}"},{"t":"4.2 Reading an airport","acs":["UA.V.B.K6a","UA.V.B.K1"],"html":"{{FIG:F_DATABLOCK}}\n<ul>\n<li><b>Color:<\/b> blue airport symbol and data = towered; magenta = nontowered.<\/li>\n<li><b>Symbol shape:<\/b> circle with runway lines = hard-surfaced runways; \"R\" in a circle = private; \"H\" in a circle = heliport; anchor = seaplane base.<\/li>\n<li><b>Frequencies:<\/b> CT = control tower; ★ = part-time; Ⓒ = CTAF; ATIS; UNICOM (the last number on the elevation line); AWOS/ASOS frequencies near the name.<\/li>\n<li><b>Elevation line:<\/b> field elevation (ft MSL) — lighting (L, *L) — longest runway in hundreds of feet — UNICOM frequency.<\/li>\n<li><b>RP<\/b> = right-hand traffic pattern for the runways listed (the standard pattern is left).<\/li>\n<li>Tower hours, pattern altitude and what airspace applies when the tower is closed are in the <b>Chart Supplement<\/b>.<\/li>\n<\/ul>"},{"t":"4.3 Latitude, longitude, MSL and AGL","acs":["UA.II.A.K1","UA.V.B.K6a"],"html":"<h4>Latitude and longitude<\/h4>\n<ul>\n<li><b>Latitude<\/b> lines run east–west and measure degrees <b>north or south of the equator<\/b>.<\/li>\n<li><b>Longitude<\/b> lines (meridians) run north–south and measure degrees <b>east or west of the prime meridian<\/b> (Greenwich). The U.S. is west longitude.<\/li>\n<li>1 degree = <b>60 minutes<\/b>. On a sectional each minute is a tick mark; every 10 minutes is a longer tick. One minute of latitude = 1 nautical mile.<\/li>\n<li>Latitude increases going north; west longitude increases going west (to the left on the chart).<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> A point 12 ticks north of the 40°30′N line is at <b>40°42′N<\/b>. A point 5 ticks west (left) of 76°00′W is at <b>76°05′W<\/b>.<\/div>\n<h4>MSL vs AGL — the conversion that wins test questions<\/h4>\n<ul>\n<li>Charts give most altitudes in <b>MSL<\/b> (mean sea level). Part 107 limits are in <b>AGL<\/b> (above ground level).<\/li>\n<li><b>AGL = MSL − ground elevation.<\/b> <b>MSL = AGL + ground elevation.<\/b><\/li>\n<li>Exceptions printed in AGL on the chart: obstacle heights in (parentheses), Class C/B floors written as \"SFC\", and the 700/1,200 ft AGL Class E floors.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> Class D ceiling [32] = 3,200 ft MSL. The field elevation is 790 ft. The Class D extends <b>2,410 ft above the airport<\/b>. Flying at 400 ft AGL you are inside it — you need authorization.<\/div>\n<div class=\"ex\"><b>Worked example.<\/b> A Class C shelf is \"44 over 16\" (1,600–4,400 ft MSL). The ground under you is 412 ft MSL. The shelf floor is 1,600 − 412 = <b>1,188 ft AGL<\/b>. At 400 ft AGL you are <b>below<\/b> the shelf — in the airspace underneath (Class G on Figure 1).<\/div>"},{"t":"4.4 Obstacles, terrain and MEFs","acs":["UA.II.B.K7","UA.V.B.K6a"],"html":"<ul>\n<li>Obstacle symbol: an inverted \"V\" with a dot. <b>Bold number = top of the obstacle in MSL<\/b>; number in <b>(parentheses) = height above ground (AGL)<\/b>.<\/li>\n<li>Taller symbol = 1,000 ft AGL or higher. Lightning-bolt rays = lighted. Two Vs = group obstacle.<\/li>\n<li>\"UC\" next to an obstacle = under construction.<\/li>\n<li><b>Maximum Elevation Figure (MEF)<\/b>: the big number with a small superscript in each latitude/longitude quadrangle. <b>3²<\/b> = 3,
