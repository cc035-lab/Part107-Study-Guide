function results(){const by={};quiz.qs.forEach((q,i)=>{by[q.area]=by[q.area]||[0,0];by[q.area][1]++;if(quiz.ans[i]===q.answer)by[q.area][0]++});const pass=quiz.pct>=70;
 return `<div class="card"><h2>${esc(quiz.title)} — results</h2>${quiz.timeout?'<p class="note">Time expired. Unanswered questions were scored wrong.</p>':''}
 <div class="row"><span class="big">${quiz.pct}%</span><span>${quiz.right} of ${quiz.qs.length} correct</span><span class="badge ${pass?'pass':'fail'}">${pass?'Above':'Below'} the FAA 70% pass mark</span>${quiz.pct>=85?'<span class="badge pass">Meets course 85% target</span>':''}</div>
 <h3>By area</h3><table class="tbl">${Object.entries(by).map(([a,[r,t]])=>`<tr><th>${esc(AREAS[a])}</th><td>${r}/${t}</td><td>${Math.round(r/t*100)}%</td></tr>`).join("")}</table>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="quiz=null;render()">Back to exams</button><button class="btn sec" onclick="startMisses()">Drill my misses</button><button class="btn sec" onclick="window.print()">Print results</button></div></div>
 <div class="card"><h2>Review</h2>${quiz.qs.map((q,i)=>{const a=quiz.ans[i],ok=a===q.answer;return `<details ${ok?'':'open'}><summary>${ok?'✔':'✘'} ${i+1}. ${esc(q.q)}</summary>${q.fig&&!ok?figHTML(q.fig,"q"):""}<p class="small">Your answer: <b>${a===null?'—':esc(q.choices[a])}</b><br>Correct: <b>${esc(q.choices[q.answer])}</b></p><div class="say small">${esc(q.exp)} <span class="mute">(${esc(q.ref)})</span></div></details>`}).join("")}</div>`}

/* ---------- Flashcards ---------- */
function cards(){if(!fc)fc={deck:shuffle(DATA.flashcards.map((c,i)=>i)),i:0,flip:false};const c=DATA.flashcards[fc.deck[fc.i]];
 return `<div class="card"><div class="row" style="justify-content:space-between"><b>Flashcards</b><span class="small mute">${fc.i+1} / ${fc.deck.length} · tap card to flip</span></div></div>
 <div class="card flash" onclick="fc.flip=!fc.flip;render()"><div>${esc(c[0])}</div>${fc.flip?`<div class="back">${esc(c[1])}</div>`:`<div class="small mute" style="margin-top:10px">tap to reveal</div>`}</div>
 <div class="row"><button class="btn sec" onclick="fc.i=(fc.i-1+fc.deck.length)%fc.deck.length;fc.flip=false;render()">‹ Prev</button><button class="btn" onclick="fc.i=(fc.i+1)%fc.deck.length;fc.flip=false;render()">Next ›</button><button class="btn sec" onclick="fc=null;render()">Shuffle</button></div>`}

/* ---------- Labs ---------- */
function labs(){if(lab)return labView(lab,false);
 return `<div class="card"><h2>Lab exercises</h2><p class="small mute">Student versions. Answers appear in Instructor mode and the printed instructor key.</p><div class="tasklist">${DATA.labs.map(l=>`<button onclick="lab='${l.id}';render()"><b>${esc(l.title)}</b><br><span class="small mute">Session ${l.session} · ${esc(String(l.minutes))} min · ${esc(l.module)}</span></button>`).join("")}</div></div>`}
function labView(id,key){const l=DATA.labs.find(x=>x.id===id);
 return `<div class="row noprint" style="margin-bottom:10px"><button class="btn sec sm" onclick="lab=null;render()">← All labs</button><button class="btn sec sm" onclick="window.print()">Print</button></div>
 <div class="card"><h2>${esc(l.title)}</h2><p><b>Purpose:</b> ${esc(l.purpose)}</p><p class="small"><b>Setup:</b> ${esc(l.setup)}</p></div>
 <div class="card"><ol class="tight">${l.items.map(([q,a])=>`<li style="margin-bottom:10px">${esc(q)}${key?`<div class="say small" style="margin-top:4px"><b>Key:</b> ${esc(a)}</div>`:`<div style="border-bottom:1px dashed var(--line);height:28px"></div>`}</li>`).join("")}</ol></div>`}

/* ---------- Tools ---------- */
function tools(){return `<div class="grid2">
 <div class="card"><h2>METAR decoder</h2><p class="small mute">Paste a METAR to see a plain-language breakdown.</p><input type="text" id="metar" value="KABE 211651Z 27015G25KT 10SM BKN045 08/M02 A3002" oninput="decodeMetar()"><div id="mout" class="small" style="margin-top:8px"></div></div>
 <div class="card"><h2>Load factor calculator</h2><label>Weight (lb)</label><input type="number" id="lw" value="33" oninput="lfCalc()"><label>Bank angle (°)</label><input type="number" id="lb" value="30" oninput="lfCalc()"><div id="lout" style="margin-top:8px"></div></div>
 <div class="card"><h2>MSL ↔ AGL</h2><label>Altitude MSL (ft)</label><input type="number" id="am" value="3200" oninput="altCalc()"><label>Ground / field elevation (ft)</label><input type="number" id="ae" value="700" oninput="altCalc()"><div id="aout" style="margin-top:8px"></div></div>
 <div class="card"><h2>Recency date</h2><label>Test or recurrent training completed</label><input type="text" id="rd" placeholder="YYYY-MM-DD" value="2025-04-06" oninput="recCalc()"><div id="rout" style="margin-top:8px"></div></div>
 </div>
 <div class="card"><h2>Airspace quick reference</h2><table class="tbl"><tr><th>Class</th><th>Chart</th><th>Typical vertical limits</th><th>Part 107 authorization</th></tr>
 <tr><td>A</td><td>Not charted on sectional</td><td>18,000 MSL – FL600</td><td>N/A</td></tr>
 <tr><td>B</td><td>Solid blue</td><td>Surface – ~10,000 MSL, tiered</td><td>Required</td></tr>
 <tr><td>C</td><td>Solid magenta</td><td>Surface – 4,000 above airport; shelf from 1,200</td><td>Required</td></tr>
 <tr><td>D</td><td>Dashed blue</td><td>Surface – ~2,500 above airport</td><td>Required</td></tr>
 <tr><td>E surface</td><td>Dashed magenta</td><td>Surface up</td><td>Required</td></tr>
 <tr><td>E 700 / 1,200</td><td>Magenta / blue vignette</td><td>Floor 700 or 1,200 AGL</td><td>Not below floor</td></tr>
 <tr><td>G</td><td>—</td><td>Surface up to overlying E</td><td>Not required</td></tr></table></div>`}
function decodeMetar(){const s=($("#metar")||{}).value||"";const t=s.trim().toUpperCase().split(/\s+/);const o=[];
 t.forEach((x,i)=>{let m;
  if(i===0&&/^[A-Z0-9]{4}$/.test(x))o.push(["Station",x]);
  else if(m=/^(\d\d)(\d\d)(\d\d)Z$/.exec(x))o.push(["Time",`Day ${m[1]}, ${m[2]}:${m[3]} UTC (Zulu)`]);
  else if(x==="AUTO")o.push(["Type","Automated observation"]);
  else if(m=/^(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT$/.exec(x))o.push(["Wind",m[1]==="000"&&m[2]==="00"?"Calm":`${m[1]==="VRB"?"Variable":"From "+m[1]+"° true"} at ${+m[2]} kt${m[4]?", gusting "+(+m[4])+" kt":""}`]);
  else if(m=/^(\d{3})V(\d{3})$/.exec(x))o.push(["Wind variability",`Varying between ${m[1]}° and ${m[2]}°`]);
  else if(m=/^(P?)(\d+\/\d+|\d+)SM$/.exec(x))o.push(["Visibility",(m[1]?"More than ":"")+m[2]+" statute miles"+(eval(m[2])<3?" — BELOW Part 107 minimum (3 SM)":"")]);
  else if(m=/^(FEW|SCT|BKN|OVC|VV)(\d{3})(CB|TCU)?$/.exec(x)){const nm={FEW:"Few",SCT:"Scattered",BKN:"Broken",OVC:"Overcast",VV:"Vertical visibility"}[m[1]];const ft=+m[2]*100;o.push(["Clouds",`${nm} at ${ft.toLocaleString()} ft AGL${/BKN|OVC|VV/.test(m[1])?" (ceiling if lowest)":""}${m[3]?" — "+m[3]:""}`])}
  else if(x==="CLR"||x==="SKC")o.push(["Clouds","Clear"]);
  else if(m=/^(M?\d\d)\/(M?\d\d)$/.exec(x)){const f=v=>v.replace("M","−");o.push(["Temp / dewpoint",`${f(m[1])}°C / ${f(m[2])}°C (spread ${Math.abs(parseInt(m[1].replace("M","-"))-parseInt(m[2].replace("M","-")))}°)`])}
  else if(m=/^A(\d\d)(\d\d)$/.exec(x))o.push(["Altimeter",`${m[1]}.${m[2]} inHg`]);
  else if(/^[-+]?(VC)?(RA|SN|DZ|FG|BR|HZ|TS|SH|FZ|GR|GS|PL|IC|UP|SQ|FC)+/.test(x)){const map={RA:"rain",SN:"snow",DZ:"drizzle",FG:"fog",BR:"mist",HZ:"haze",TS:"thunderstorm",SH:"showers",FZ:"freezing",GR:"hail",GS:"small hail",PL:"ice pellets",IC:"ice crystals",UP:"unknown precip",SQ:"squall",FC:"funnel cloud",VC:"in vicinity"};let d=x.startsWith("-")?"light ":x.startsWith("+")?"heavy ":"";d+=x.replace(/^[-+]/,"").match(/VC|RA|SN|DZ|FG|BR|HZ|TS|SH|FZ|GR|GS|PL|IC|UP|SQ|FC/g).map(c=>map[c]).join(" ");o.push(["Weather",d])}
  else if(x==="RMK")o.push(["Remarks","(remarks follow)"]);
 });
 const el=$("#mout");if(el)el.innerHTML=`<table class="tbl">${o.map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table>`}
function lfCalc(){const w=+($("#lw")||{}).value,b=+($("#lb")||{}).value;const el=$("#lout");if(!el)return;if(!(b>=0&&b<85)){el.innerHTML="Enter a bank angle from 0 to 84°.";return}const lf=1/Math.cos(b*Math.PI/180);el.innerHTML=`Load factor <b>${lf.toFixed(3)} G</b><br>Structure load <b>${(w*lf).toFixed(1)} lb</b><br>Stall speed increase <b>${((Math.sqrt(lf)-1)*100).toFixed(0)}%</b>`}
function altCalc(){const a=+($("#am")||{}).value,e=+($("#ae")||{}).value;const el=$("#aout");if(el)el.innerHTML=`<b>${(a-e).toLocaleString()} ft AGL</b>`}
function recCalc(){const v=(($("#rd")||{}).value||"").trim();const el=$("#rout");if(!el)return;const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v);if(!m){el.innerHTML="Use YYYY-MM-DD.";return}let y=+m[1]+2,mo=+m[2];const last=new Date(y,mo,0);el.innerHTML=`Current through <b>${last.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</b> (24 calendar months)`}

/* ---------- Library ---------- */
function lib(){return `<div class="card"><h2>Free reference library</h2><p class="small mute">All core materials are free FAA publications. ★ = required for this course.</p><table class="tbl">${DATA.resources.map(r=>`<tr><td>${r[4]?"★":""}</td><td><a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a><div class="small mute">${esc(r[3])}</div></td></tr>`).join("")}</table></div>`}

/* ---------- Instructor ---------- */
function inst(){if(!unlocked)return `<div class="card lock"><h2>🔒 Instructor mode</h2><p class="small mute">Lesson plan, timing, lab answer keys, teaching techniques, and exam keys.</p><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')tryUnlock()"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="tryUnlock()">Unlock</button></div></div>`;
 const subs=[["plan","Lesson plan"],["keys","Lab keys"],["teach","Teaching techniques"],["exam","Exam keys"],["set","Settings"]];
 let body="";
 if(instSub==="plan")body=[1,2].map(s=>`<div class="card"><h2>Session ${s}</h2><table class="tbl"><tr><th>Time</th><th>Block</th><th>Content</th></tr>${DATA.schedule[s].map(r=>`<tr><td class="mono">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td></tr>`).join("")}</table></div>`).join("")+`<div class="card"><h2>Formats</h2><ul class="tight"><li><b>Single day:</b> Session 1 08:00–12:00, lunch, Session 2 13:00–17:00. Between-session work moves to pre-work.</li><li><b>Two weekends (recommended):</b> spacing improves retention, especially for charts.</li></ul></div>`;
 if(instSub==="keys")body=lab?labView(lab,true):`<div class="card"><div class="tasklist">${DATA.labs.map(l=>`<button onclick="lab='${l.id}';render()"><b>${esc(l.title)}</b> — answer key</button>`).join("")}</div></div>`;
 if(instSub==="teach")body=`<div class="card"><h2>Teaching techniques used in this course</h2><table class="tbl">${DATA.teaching.map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table></div>`;
 if(instSub==="exam")body=Object.keys(DATA.sets).map(k=>`<div class="card"><details><summary>${esc(DATA.setInfo[k][0])} — answer key</summary><ol class="tight small">${DATA.sets[k].map(id=>{const q=BYID[id];return `<li>${esc(q.q)} — <b>${"ABC"[q.answer]}. ${esc(q.choices[q.answer])}</b></li>`}).join("")}</ol></details></div>`).join("");
 if(instSub==="set")body=`<div class="card"><h2>Change instructor password</h2><input type="password" id="np" placeholder="New password"><div class="row" style="margin-top:8px"><button class="btn" onclick="setPw()">Save</button><button class="btn sec" onclick="store('pw',null);alert('Reset to default.')">Reset to default</button></div><h3>Clear student data on this device</h3><button class="btn sec" onclick="if(confirm('Clear scores and missed questions?')){store('history',[]);store('missed',{});alert('Cleared.')}">Clear scores</button></div>`;
 return `<div class="row noprint" style="margin-bottom:10px">${subs.map(([k,l])=>`<button class="btn ${instSub===k?'':'sec'} sm" onclick="instSub='${k}';lab=null;render()">${l}</button>`).join("")}<button class="btn sec sm" onclick="unlocked=false;render()">Lock</button></div>`+body}
function tryUnlock(){const v=($("#pw")||{}).value||"";if(sha256(K+":"+v)===pwHash()){unlocked=true;render()}else alert("Incorrect password.")}
function setPw(){const v=($("#np")||{}).value||"";if(v.length<4){alert("Use at least 4 characters.");return}store("pw",sha256(K+":"+v));alert("Password saved on this device.")}

render();
document.addEventListener("input",()=>{});
setTimeout(()=>{if(VIEW==="tools"){decodeMetar();lfCalc();altCalc();recCalc()}},0);
const _r=render;render=function(){_r();if(VIEW==="tools"){decodeMetar();lfCalc();altCalc();recCalc()}};
</script>
</body>
</html>
